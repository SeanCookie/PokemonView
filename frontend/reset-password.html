<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Infinity Cards</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f18;
      --panel: #101825;
      --border: #26364f;
      --text: #e9f1ff;
      --muted: #93a8c7;
      --accent: #67b2ff;
      --danger: #ff8795;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .card {
      width: min(420px, 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 18px;
      display: grid;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    label {
      font-size: 12px;
      color: var(--muted);
    }
    input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1624;
      color: var(--text);
      font-size: 14px;
      padding: 0 10px;
    }
    button {
      height: 38px;
      border: 1px solid #34547c;
      border-radius: 8px;
      background: #1b304c;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      min-height: 18px;
      font-size: 12px;
      color: var(--muted);
    }
    .status.error { color: var(--danger); }
    .status.ok { color: #8fd4a8; }
    a {
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset password</h1>
    <p id="intro">Choose a new password for your account.</p>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="password2">Confirm password</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" required />
      <button type="submit" id="submitBtn">Update password</button>
    </form>
    <div id="status" class="status" role="status"></div>
    <a href="/home.html">Back to home</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const token = String(params.get("token") || "").trim();
      const form = document.getElementById("resetForm");
      const password = document.getElementById("password");
      const password2 = document.getElementById("password2");
      const status = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");
      const intro = document.getElementById("intro");

      function setStatus(message, kind) {
        status.textContent = message || "";
        status.className = "status" + (kind ? ` ${kind}` : "");
      }

      if (!token) {
        intro.textContent = "This reset link is missing or invalid.";
        form.hidden = true;
        setStatus("Request a new link from Sign In → Forgot Password?", "error");
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const p1 = String(password.value || "");
        const p2 = String(password2.value || "");
        if (p1.length < 8) {
          setStatus("Password must be at least 8 characters.", "error");
          return;
        }
        if (p1 !== p2) {
          setStatus("Passwords do not match.", "error");
          return;
        }
        submitBtn.disabled = true;
        setStatus("Updating...");
        try {
          const response = await fetch("/api/auth/reset-password", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password: p1 })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || !payload?.ok) {
            setStatus(payload?.error || "Could not reset password.", "error");
            submitBtn.disabled = false;
            return;
          }
          form.hidden = true;
          setStatus(payload.message || "Password updated. You can sign in now.", "ok");
        } catch {
          setStatus("Network error. Please try again.", "error");
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
