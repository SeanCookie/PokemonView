<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokemonView Poke View</title>
  <link rel="stylesheet" href="/brand-logo.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f18;
      --panel: #101825;
      --border: #2a3340;
      --text: #e9f1ff;
      --muted: #93a8c7;
      --terminal: #0a0d14;
      --terminal-soft: #121722;
      --up: #089981;
      --down: #f23645;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .top-nav {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 15, 24, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 8;
    }
    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .nav-link {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }
    .nav-link.active, .nav-link:hover { color: var(--text); }
    .page {
      margin: 12px;
      display: grid;
      gap: 10px;
    }
    .terminal {
      border: 1px solid #2a2e39;
      border-radius: 10px;
      background: #131722;
      overflow: hidden;
      height: calc(100vh - 92px);
      display: grid;
      grid-template-rows: 1fr;
    }
    .terminal-main {
      --watchlist-width: 320px;
      --chart-scale-width: 78px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 8px minmax(240px, var(--watchlist-width));
      min-height: 0;
      overflow: hidden;
    }
    .chart-stack {
      display: grid;
      grid-template-rows: 1fr auto;
      min-width: 0;
      min-height: 0;
    }
    .chart-canvas-wrap {
      width: 100%;
      height: 100%;
      min-height: 420px;
      min-width: 0;
      position: relative;
      cursor: default;
      touch-action: none;
    }
    .chart-canvas-wrap.panning {
      cursor: grabbing;
    }
    .chart-canvas-wrap.axis-time {
      cursor: ew-resize;
    }
    .chart-canvas-wrap.axis-price {
      cursor: ns-resize;
    }
    .chart-area {
      position: relative;
      background: #131722;
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
    }
    .chart-toolbar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 3px;
      border-right: 1px solid #2a2e39;
      background: #131722;
      z-index: 3;
      overflow-y: auto;
    }
    .chart-tool-btn {
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: #787b86;
      font-size: 15px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .chart-tool-btn:hover {
      color: #d1d4dc;
      background: rgba(255, 255, 255, 0.06);
    }
    .chart-tool-btn.active {
      color: #d1d4dc;
      background: rgba(41, 98, 255, 0.22);
      border-color: rgba(41, 98, 255, 0.45);
    }
    .chart-tool-btn.magnet-on {
      color: #089981;
      border-color: rgba(8, 153, 129, 0.45);
    }
    .chart-tool-btn.cursor-crosshair-on {
      color: #d1d4dc;
    }
    .chart-tool-divider {
      height: 1px;
      margin: 4px 2px;
      background: #2a2e39;
    }
    #chartDrawCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      touch-action: none;
    }
    #chartContainer {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 0;
    }
    .chart-symbol-header {
      position: absolute;
      top: 6px;
      left: 8px;
      z-index: 5;
      pointer-events: none;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      max-width: calc(100% - 96px);
      line-height: 1.35;
    }
    .chart-symbol-header[hidden] {
      display: none;
    }
    .chart-symbol-title {
      font: 600 12px Inter, "Segoe UI", Arial, sans-serif;
      color: #d1d4dc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .chart-symbol-stats {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      font: 11px ui-monospace, Consolas, "Segoe UI", monospace;
      color: #787b86;
    }
    .chart-symbol-stats[hidden] {
      display: none;
    }
    .chart-stat {
      white-space: nowrap;
    }
    .chart-stat-v {
      font-weight: 600;
      margin-left: 1px;
    }
    .chart-stat-h .chart-stat-v {
      color: #089981;
    }
    .chart-stat-l .chart-stat-v {
      color: #f23645;
    }
    .chart-stat-psa {
      margin-left: 4px;
    }
    .chart-stat-psa-sep {
      color: #787b86;
      font-weight: 500;
      margin: 0 2px;
    }
    .chart-stat-psa-v {
      color: #42a5f5;
      font-weight: 600;
    }
    .chart-stat-psa[hidden] {
      display: none;
    }
    .chart-stat-hover .chart-stat-v {
      color: #ffffff;
    }
    .chart-resizer {
      border-left: 1px solid #1e2631;
      border-right: 1px solid #1e2631;
      background: #0a1018;
      cursor: col-resize;
      position: relative;
      touch-action: none;
    }
    .chart-resizer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 44px;
      border-radius: 2px;
      background: #334257;
    }
    .chart-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #93a8c7;
      font: 13px Inter, Segoe UI, Arial, sans-serif;
      pointer-events: none;
      background: rgba(19, 23, 34, 0.72);
    }
    .chart-overlay[hidden] {
      display: none;
    }
    .watchlist {
      background: #0a0f18;
      display: grid;
      grid-template-rows: 38px minmax(0, 1fr) auto;
      min-height: 0;
    }
    .watchlist-head {
      border-bottom: 1px solid #1f2836;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 12px;
      color: #c5d6f3;
    }
    .watchlist-add-btn {
      width: 20px;
      height: 20px;
      border: 1px solid #2f3d50;
      border-radius: 6px;
      background: #121a27;
      color: #cfe0ff;
      font-size: 14px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .watchlist-add-btn:hover {
      border-color: #4f6584;
      background: #182334;
    }
    .watchlist-remove-btn {
      width: 20px;
      height: 20px;
      border: 1px solid #4a2b33;
      border-radius: 6px;
      background: #2a151b;
      color: #ffd9e0;
      font-size: 14px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }
    .watchlist-remove-btn:hover {
      border-color: #74424d;
      background: #3a1c24;
    }
    .watchlist-reset-btn {
      height: 20px;
      padding: 0 7px;
      border: 1px solid #2f3d50;
      border-radius: 6px;
      background: #121a27;
      color: #9db2d4;
      font-size: 10px;
      font-weight: 600;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
    }
    .watchlist-reset-btn.hidden {
      display: none;
    }
    .watchlist-reset-btn:hover {
      border-color: #4f6584;
      background: #182334;
      color: #e9f1ff;
    }
    .watchlist-modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 9, 15, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 16px;
    }
    .watchlist-modal.open {
      display: flex;
    }
    .watchlist-modal-panel {
      width: min(920px, 100%);
      border: 1px solid #2c394d;
      border-radius: 12px;
      background: #0f1520;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .watchlist-modal-title {
      margin: 0;
      font-size: 15px;
    }
    .watchlist-modal-sub {
      margin: 0;
      color: #9ab0d1;
      font-size: 12px;
    }
    .watchlist-input {
      width: 100%;
      border: 1px solid #2f3d50;
      border-radius: 8px;
      background: #121a27;
      color: #e4eeff;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .watchlist-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 10px;
      max-height: min(420px, 52vh);
      overflow: auto;
      padding: 4px 2px 8px;
      align-content: start;
    }
    .watchlist-card-tile {
      margin: 0;
      padding: 6px;
      border: 1px solid #2f3d50;
      border-radius: 10px;
      background: #121a27;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }
    .watchlist-card-tile:hover {
      border-color: #4a5f7a;
      background: #161f2e;
    }
    .watchlist-card-tile.selected {
      border-color: #5a7ab0;
      background: #18263a;
      box-shadow: inset 0 0 0 1px rgba(90, 122, 176, 0.45);
    }
    .watchlist-card-tile-visual {
      width: 100%;
      aspect-ratio: 63 / 88;
      border-radius: 6px;
      background: #0a0f18;
      border: 1px solid #1b2432;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .watchlist-card-tile-visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .watchlist-card-tile-ph {
      font-size: 11px;
      font-weight: 700;
      color: #5c6d8a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 6px;
      text-align: center;
      line-height: 1.2;
    }
    .watchlist-card-tile-label {
      font-size: 10px;
      line-height: 1.25;
      color: #9ab0d1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.5em;
    }
    .watchlist-card-grid-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 28px 12px;
      color: #7f95b7;
      font-size: 13px;
    }
    .watchlist-source-tabs {
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .watchlist-source-tabs.visible {
      display: grid;
    }
    .watchlist-source-tab {
      border: 1px solid #2f3d50;
      border-radius: 8px;
      background: #121a27;
      color: #9ab0d1;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .watchlist-source-tab:hover {
      border-color: #4a5f7a;
      color: #cfe0ff;
      background: #161f2e;
    }
    .watchlist-source-tab.active {
      border-color: #5a7ab0;
      background: #18263a;
      color: #e9f1ff;
      box-shadow: inset 0 0 0 1px rgba(90, 122, 176, 0.35);
    }
    .watchlist-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .watchlist-action-btn {
      border: 1px solid #3a4b62;
      border-radius: 8px;
      background: #152133;
      color: #d6e4fc;
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .watchlist-action-btn.primary {
      background: #203557;
      border-color: #476896;
      color: #ffffff;
    }
    .watchlist table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .watchlist th {
      text-align: right;
      color: #7f95b7;
      font-weight: 500;
      padding: 8px 8px 6px;
      border-bottom: 1px solid #1b2432;
    }
    .watchlist th:first-child, .watchlist td:first-child {
      text-align: left;
      padding-left: 10px;
    }
    .watchlist td {
      padding: 6px 8px;
      border-bottom: 1px solid #151d29;
      text-align: right;
      color: #d7e4fb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .watchlist tbody tr {
      cursor: pointer;
    }
    .watchlist tbody tr:hover {
      background: #121a27;
    }
    .watchlist tbody tr.active {
      background: #18263a;
      box-shadow: inset 2px 0 0 #4f6f98;
    }
    .watchlist table {
      table-layout: fixed;
    }
    .watchlist th:nth-child(2),
    .watchlist th:nth-child(3),
    .watchlist th:nth-child(4),
    .watchlist td:nth-child(2),
    .watchlist td:nth-child(3),
    .watchlist td:nth-child(4) {
      width: 62px;
    }
    .watchlist td:first-child {
      max-width: 0;
      overflow: hidden;
    }
    .watch-card {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .watch-metrics-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      line-height: 1.2;
    }
    .watch-metric-line {
      white-space: nowrap;
    }
    .watch-metric-psa {
      color: #42a5f5;
      font-size: 11px;
    }
    .watch-metric-psa.muted {
      color: #5a7a9a;
    }
    .watchlist .up { color: var(--up); }
    .watchlist .down { color: var(--down); }
    .watchlist .muted { color: #9ab0d1; }
    .watchlist-footer {
      border-top: 1px solid #1f2836;
      padding: 8px 10px;
    }
    .watchlist-psa10-btn {
      width: 100%;
      border: 1px solid #2f3d50;
      border-radius: 6px;
      background: #121a27;
      color: #9ab0d1;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 7px 10px;
      cursor: pointer;
    }
    .watchlist-psa10-btn:hover:not(:disabled) {
      border-color: #4f6584;
      background: #182334;
      color: #cfe0ff;
    }
    .watchlist-psa10-btn.active {
      border-color: #42a5f5;
      background: #15263d;
      color: #e3f2fd;
      box-shadow: inset 0 0 0 1px rgba(66, 165, 245, 0.25);
    }
    .watchlist-psa10-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .chart-bottom-bar {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) minmax(var(--chart-scale-width), max-content);
      align-items: center;
      gap: 0;
      min-height: 30px;
      padding: 2px 0;
      border-top: 1px solid #2a2e39;
      background: #131722;
      flex-shrink: 0;
      cursor: grab;
    }
    .chart-bottom-bar-spacer {
      width: 42px;
    }
    .chart-bottom-bar-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding-left: 6px;
    }
    .chart-hover-date {
      flex: 0 0 auto;
      min-width: 96px;
      font-size: 11px;
      line-height: 1.2;
      color: #787b86;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .chart-hover-date[hidden] {
      display: none;
    }
    .chart-bottom-bar.panning {
      cursor: grabbing;
    }
    .chart-range-tabs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1px;
    }
    .chart-range-btn {
      border: none;
      background: transparent;
      color: #787b86;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      padding: 5px 9px;
      cursor: pointer;
      border-radius: 2px;
      line-height: 1.2;
    }
    .chart-range-btn:hover {
      color: #d1d4dc;
      background: rgba(255, 255, 255, 0.06);
    }
    .chart-range-btn.active {
      color: #d1d4dc;
      background: rgba(255, 255, 255, 0.1);
    }
    .chart-bar-clock-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: var(--chart-scale-width);
      width: max-content;
      max-width: 220px;
      padding-right: 8px;
      padding-left: 4px;
      font-size: 11px;
      line-height: 1.2;
      color: #787b86;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    @media (max-width: 1260px) {
      .terminal-main { grid-template-columns: minmax(240px, 1fr) 8px minmax(220px, var(--watchlist-width)); }
    }
    @media (max-width: 1080px) {
      .terminal {
        height: calc(100vh - 100px);
      }
      .terminal-main {
        grid-template-columns: 1fr;
      }
      .chart-resizer {
        display: none;
      }
      .watchlist {
        display: none;
      }
    }
    @media (max-width: 760px) {
      .nav-right { display: none; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-left">
      <a href="/" class="brand" aria-label="Go to homepage">
        <span class="pokeball-logo" aria-hidden="true"></span>
      </a>
      <a href="/" class="nav-link">Home</a>
      <a href="/sets.html" class="nav-link">Sets</a>
      <a href="/dashboard.html" class="nav-link">Collection</a>
      <a href="/showcase" class="nav-link">Showcase</a>
      <a href="/poke-view.html" class="nav-link active">Poke View</a>
      <a href="/scan-your-cards.html" class="nav-link">Scan Your Cards</a>
      <a href="/restock-tracker.html" class="nav-link">Restock Tracker</a>
    </div>
    <div class="nav-right">
      <div data-account-slot></div>
    </div>
  </nav>

  <main class="page">
    <section class="terminal">
      <div class="terminal-main">
        <div class="chart-stack">
          <section class="chart-area">
            <aside class="chart-toolbar" aria-label="Drawing tools">
              <button type="button" class="chart-tool-btn active cursor-crosshair-on" id="chartCursorBtn" data-chart-tool="cursor" title="Crosshair mode (click for pan cursor)">✛</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="trendline" title="Trend line">╱</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="ray" title="Ray">↗</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="hline" title="Horizontal line">─</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="vline" title="Vertical line">│</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="channel" title="Parallel channel">⫽</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="fib" title="Fibonacci retracement">φ</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="brush" title="Brush">✎</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="text" title="Text">T</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="measure" title="Measure">↔</button>
              <button type="button" class="chart-tool-btn" data-chart-tool="zoom" title="Zoom to selection">▭</button>
              <div class="chart-tool-divider" aria-hidden="true"></div>
              <button type="button" class="chart-tool-btn" id="chartMagnetBtn" title="Magnet mode (snap to OHLC)">🧲</button>
              <button type="button" class="chart-tool-btn" id="chartUndoBtn" title="Undo last drawing">↶</button>
              <button type="button" class="chart-tool-btn" id="chartClearBtn" title="Clear all drawings">⌫</button>
            </aside>
            <div class="chart-canvas-wrap">
            <div id="chartContainer" aria-label="Poke View chart"></div>
            <canvas id="chartDrawCanvas" aria-hidden="true"></canvas>
            <div id="chartSymbolHeader" class="chart-symbol-header" hidden aria-live="polite">
              <span id="chartSymbolTitle" class="chart-symbol-title"></span>
              <span id="chartSymbolStats" class="chart-symbol-stats" hidden>
                <span class="chart-stat chart-stat-h">H<span class="chart-stat-v">--</span><span class="chart-stat-psa" hidden><span class="chart-stat-psa-sep">/</span><span class="chart-stat-psa-v">--</span></span></span>
                <span class="chart-stat chart-stat-l">L<span class="chart-stat-v">--</span><span class="chart-stat-psa" hidden><span class="chart-stat-psa-sep">/</span><span class="chart-stat-psa-v">--</span></span></span>
                <span class="chart-stat chart-stat-hover"><span class="chart-stat-v">--</span></span>
              </span>
            </div>
            <div id="chartOverlay" class="chart-overlay" hidden></div>
            </div>
          </section>
          <div class="chart-bottom-bar" aria-label="Chart range and local time">
            <div class="chart-bottom-bar-spacer" aria-hidden="true"></div>
            <div class="chart-bottom-bar-main">

                id="pokeViewFooterClock"

        <aside class="watchlist">
          <header class="watchlist-head">

              <button id="resetLayoutBtn" class="watchlist-reset-btn" type="button" title="Reset chart and watchlist panel widths">Reset</button>
              <button id="watchlistAddBtn" class="watchlist-add-btn" type="button" aria-label="Add card to watchlist">+</button>
              <button id="watchlistRemoveBtn" class="watchlist-remove-btn" type="button" aria-label="Remove selected card from watchlist">-</button>
            </div>

          <div style="overflow:auto;">
            <table>
              <thead>
                <tr>
                  <th>Cards</th>
                  <th>Last</th>
                  <th>Chg</th>
                  <th>Chg%</th>

              <tbody id="watchlistBody"></tbody>
            </table>
          </div>
          <div class="watchlist-footer">
            <button
              id="watchlistPsa10Btn"

              PSA 10
            </button>
          </div>

      </div>
    </section>
  </main>
  <div id="watchlistModal" class="watchlist-modal" aria-hidden="true">
    <section class="watchlist-modal-panel">
      <h3 class="watchlist-modal-title">Add Card To Watchlist</h3>
      <p class="watchlist-modal-sub" id="watchlistModalSub">Click a card to select, double-click or use Add Card</p>
      <div id="watchlistSourceTabs" class="watchlist-source-tabs" role="tablist" aria-label="Card source">
        <button
          type="button"
          class="watchlist-source-tab active"
          id="watchlistSourceCatalogBtn"
          data-source="catalog"
          role="tab"
          aria-selected="true"
        >
          Sets catalog
        </button>
        <button
          type="button"
          class="watchlist-source-tab"
          id="watchlistSourceCollectionBtn"
          data-source="collection"
          role="tab"
          aria-selected="false"
        >
          My collection
        </button>
      </div>
      <input id="watchlistSearchInput" class="watchlist-input" placeholder="Search card name, set code, or nickname..." />
      <div id="watchlistCardGrid" class="watchlist-card-grid" role="listbox" aria-label="Choose a card"></div>
      <div class="watchlist-modal-actions">
        <button id="watchlistCancelBtn" class="watchlist-action-btn" type="button">Cancel</button>
        <button id="watchlistAddConfirmBtn" class="watchlist-action-btn primary" type="button">Add Card</button>
      </div>
    </section>
  </div>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    (function () {
      const chartContainer = document.getElementById("chartContainer");
      const chartOverlay = document.getElementById("chartOverlay");
      const chartSymbolHeader = document.getElementById("chartSymbolHeader");
      const chartSymbolTitle = document.getElementById("chartSymbolTitle");
      const chartSymbolStats = document.getElementById("chartSymbolStats");
      const chartHoverDate = document.getElementById("chartHoverDate");
      const drawCanvas = document.getElementById("chartDrawCanvas");
      const chartWrap = document.querySelector(".chart-canvas-wrap");
      const chartBottomBar = document.querySelector(".chart-bottom-bar");
      const terminalMain = document.querySelector(".terminal-main");
      const chartResizer = document.getElementById("chartResizer");
      const resetLayoutBtn = document.getElementById("resetLayoutBtn");
      const watchlistBody = document.getElementById("watchlistBody");
      const watchlistAddBtn = document.getElementById("watchlistAddBtn");
      const watchlistRemoveBtn = document.getElementById("watchlistRemoveBtn");
      const watchlistModal = document.getElementById("watchlistModal");
      const watchlistSearchInput = document.getElementById("watchlistSearchInput");
      const watchlistCardGrid = document.getElementById("watchlistCardGrid");
      const watchlistSourceTabs = document.getElementById("watchlistSourceTabs");
      const watchlistSourceCatalogBtn = document.getElementById("watchlistSourceCatalogBtn");
      const watchlistSourceCollectionBtn = document.getElementById("watchlistSourceCollectionBtn");
      const watchlistModalSub = document.getElementById("watchlistModalSub");
      const watchlistCancelBtn = document.getElementById("watchlistCancelBtn");
      const watchlistAddConfirmBtn = document.getElementById("watchlistAddConfirmBtn");
      const watchlistPsa10Btn = document.getElementById("watchlistPsa10Btn");
      const pokeViewFooterClock = document.getElementById("pokeViewFooterClock");

      function formatChartBarLocalTime() {
        const d = new Date();
        const time = d.toLocaleTimeString(undefined, {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
        const zone =
          new Intl.DateTimeFormat(undefined, { timeZoneName: "short" })
            .formatToParts(d)
            .find((p) => p.type === "timeZoneName")?.value || "";
        return zone ? `${time} ${zone}` : time;
      }

      function startFooterLocalClock() {
        if (!pokeViewFooterClock) return;
        const tick = () => {
          pokeViewFooterClock.textContent = formatChartBarLocalTime();
        };
        tick();
        window.setInterval(tick, 1000);
      }

      const TIMEFRAME_CONFIG = {
        "3m": { count: 180, seed: 3, volatility: 0.005, drift: 0.0002 },
        "15m": { count: 150, seed: 15, volatility: 0.008, drift: 0.0004 },
        "1h": { count: 130, seed: 60, volatility: 0.012, drift: 0.0007 },
        "4h": { count: 110, seed: 240, volatility: 0.017, drift: 0.0011 }
      };
      const USE_FAKE_CHART_DATA = false;

      const state = {
        timeframe: "3m",
        candles: [],
        historyCandlesFull: [],
        historyCandlesPsa10Full: [],
        hasPsa10History: false,
        showPsa10Overlay: false,
        chartMessage: "Select a card from the watchlist to load its chart",
        watchlist: [],
        selectedWatchlistId: null,
        cardIndex: [],
        cardIndexById: {},
        cardIndexLoaded: false,
        cardNicknames: [],
        cardNicknamesLoaded: false,
        collectionPickerCards: [],
        collectionPickerById: {},
        collectionPickerLoaded: false,
        watchlistPickerSource: "catalog",
        watchlistWidth: 320,
        activeRequestId: 0,
        livePollTimer: null,
        watchlistPickerSelectedId: null,
        chartTool: "cursor",
        cursorCrosshairEnabled: true,
        chartDrawingsById: {},
        chartDraft: null,
        hoverDrawPoint: null,
        chartVisibleCount: null,
        chartScroll: 0,
        priceExpand: 0.07,
        priceScaleManual: null,
        chartMagnet: false,
        axisDrag: null,
        hoverChart: null,
        hoverPrice: null,
        zoomBoxDraft: null,
        activeRangePreset: "ALL",
        applyChartViewportOnNextDraw: false,
        applyChartPriceScaleOnNextDraw: false,
        timeScaleOverrideMs: null,
        placeholderCandles: null
      };

      let lwChart = null;
      let lwCandleSeries = null;
      let lwPsa10CandleSeries = null;
      let lwVolumeSeries = null;
      let lwResizeObserver = null;
      let lwPriceScaleRedrawBound = false;
      let lwDrawingRedrawBound = false;
      let lwCrosshairHoverBound = false;
      let watchlistSaveTimer = null;
      let watchlistAuthBooted = false;
      let watchlistEverSignedIn = false;
      let watchlistSaveInFlight = null;

      function toQueryText(value) {
        return String(value || "").toLowerCase().trim();
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function pickCardImageSrc(local, remote) {
        const l = String(local || "").trim();
        const r = String(remote || "").trim();
        if (l.startsWith("/card-images/") || l.startsWith("/card-images-japanese/")) return l;
        if (r.startsWith("/card-images/") || r.startsWith("/card-images-japanese/")) return r;
        return "";
      }

      function cardNumberLookupKeys(raw) {
        const no = String(raw || "").trim().replace(/^#/, "");
        if (!no) return [];
        const keys = new Set([no, no.toUpperCase()]);
        const stripped = no.replace(/^0+/, "") || no;
        if (stripped !== no) keys.add(stripped);
        const n = Number(stripped);
        if (Number.isFinite(n)) {
          keys.add(String(n));
          keys.add(String(n).padStart(3, "0"));
        }
        const promo = no.match(/^(\d+)([a-zA-Z]+)$/);
        if (promo) {
          const base = promo[1];
          const suffix = promo[2];
          keys.add(base);
          const bn = Number(base);
          if (Number.isFinite(bn)) {
            keys.add(String(bn).padStart(3, "0") + suffix);
            keys.add(String(bn) + suffix);
          }
        }
        return [...keys];
      }

      function lookupCardImageMap(images, cardNo) {
        if (!images || typeof images !== "object") return "";
        for (const key of cardNumberLookupKeys(cardNo)) {
          const url = images[key];
          if (url) return String(url).trim();
        }
        return "";
      }

      function buildLocalCardImageUrl(setCode, cardNo) {
        const code = String(setCode || "").trim().toUpperCase();
        const no = String(cardNo || "").trim();
        if (!code || !no) return "";
        return `/card-images/${encodeURIComponent(code)}/${encodeURIComponent(no)}.jpg`;
      }

      function resolveWatchlistCardImage(setCode, cardNo, localImages, images) {
        const fromLocal = lookupCardImageMap(localImages, cardNo);
        const fromRemote = lookupCardImageMap(images, cardNo);
        const picked = pickCardImageSrc(fromLocal, fromRemote);
        if (picked) return picked;
        return buildLocalCardImageUrl(setCode, cardNo);
      }

      function formatNumber(value, digits = 2) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "--";
        return n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
      }

      function applyPanelWidths() {
        if (!terminalMain) return;
        const hostWidth = terminalMain.clientWidth || 0;
        const maxWidth = Math.max(240, Math.floor(hostWidth * 0.55));
        const width = Math.min(maxWidth, Math.max(220, state.watchlistWidth));
        terminalMain.style.setProperty("--watchlist-width", `${width}px`);
      }

      function updateResetButtonVisibility() {
        if (!resetLayoutBtn) return;
        const isDefault = Math.abs(Number(state.watchlistWidth) - 320) < 0.5;
        resetLayoutBtn.classList.toggle("hidden", isDefault);
      }

      async function loadCardsFromSetsIndex() {
        if (state.cardIndexLoaded) {
          const total = state.cardIndex.length;
          const withImg = state.cardIndex.reduce((acc, item) => acc + (item.imageUrl ? 1 : 0), 0);
          if (total > 0 && withImg / total >= 0.25) return;
        }
        const response = await fetch("/api/sets/cards?language=english", { cache: "no-store" });
        const payload = response.ok ? await response.json() : null;
        const cards = [];

        if (payload && payload.ok && payload.byCode && typeof payload.byCode === "object") {
          for (const [setCode, entry] of Object.entries(payload.byCode)) {
            const cardMap = entry && entry.cards && typeof entry.cards === "object" ? entry.cards : {};
            const localImages =
              entry && entry.localImages && typeof entry.localImages === "object" ? entry.localImages : {};
            const images = entry && entry.images && typeof entry.images === "object" ? entry.images : {};
            const setName = String(entry?.sourceTitle || entry?.title || "").trim();
            for (const [cardNo, cardNameRaw] of Object.entries(cardMap)) {
              const cardName = String(cardNameRaw || "").trim();
              if (!cardName) continue;
              const id = `english:${String(setCode).toUpperCase()}:${cardNo}`;
              const imageUrl = resolveWatchlistCardImage(setCode, cardNo, localImages, images);
              cards.push({
                id,
                card: cardName,
                setCode: String(setCode).toUpperCase(),
                cardNo: String(cardNo),
                setName,
                language: "english",
                label: `${cardName} (${String(setCode).toUpperCase()} #${String(cardNo)})`,
                imageUrl
              });
            }
          }
        }

        cards.sort((a, b) => a.card.localeCompare(b.card) || a.setCode.localeCompare(b.setCode) || a.cardNo.localeCompare(b.cardNo));
        const byId = {};
        for (const item of cards) byId[item.id] = item;
        state.cardIndex = cards;
        state.cardIndexById = byId;
        state.cardIndexLoaded = true;
      }

      function normalizeNicknameQuery(text) {
        return String(text || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function nicknameQueryMatchesText(nicknameKey, queryKey) {
        if (!nicknameKey || !queryKey) return false;
        if (nicknameKey === queryKey) return true;
        if (queryKey.length < 3) return false;
        return nicknameKey.includes(queryKey) || queryKey.includes(nicknameKey);
      }

      function cardNumberMatchesTarget(cardNo, targetNo) {
        const left = cardNumberLookupKeys(cardNo);
        const right = new Set(cardNumberLookupKeys(targetNo));
        return left.some((key) => right.has(key));
      }

      function getNicknameEntriesForQuery(query) {
        const queryKey = normalizeNicknameQuery(query);
        if (!queryKey) return [];
        const exact = [];
        const partial = [];
        for (const entry of state.cardNicknames || []) {
          const nickKey = normalizeNicknameQuery(entry.nickname);
          if (!nickKey) continue;
          if (nickKey === queryKey) exact.push(entry);
          else if (nicknameQueryMatchesText(nickKey, queryKey)) partial.push(entry);
        }
        return [...exact, ...partial];
      }

      function findWatchlistCardForNicknameEntry(entry) {
        if (!entry) return null;
        if ((entry.language || "english") !== "english") return null;
        const setCode = String(entry.setCode || "").toUpperCase();
        return (
          state.cardIndex.find(
            (item) => item.setCode === setCode && cardNumberMatchesTarget(item.cardNo, entry.cardNumber)
          ) || null
        );
      }

      async function loadCardNicknames() {
        if (state.cardNicknamesLoaded) return;
        try {
          const response = await fetch("/api/card-nicknames", { cache: "no-store" });
          if (!response.ok) {
            state.cardNicknames = [];
            return;
          }
          const payload = await response.json();
          state.cardNicknames = Array.isArray(payload?.nicknames) ? payload.nicknames : [];
        } catch {
          state.cardNicknames = [];
        } finally {
          state.cardNicknamesLoaded = true;
        }
      }

      function filterWatchlistCards(query) {
        const q = String(query || "").trim();
        if (!q) return state.cardIndex.slice(0, 300);

        const seen = new Set();
        const matches = [];

        for (const entry of getNicknameEntriesForQuery(q)) {
          const card = findWatchlistCardForNicknameEntry(entry);
          if (!card || seen.has(card.id)) continue;
          seen.add(card.id);
          matches.push(card);
        }

        const queryKey = toQueryText(q);
        for (const item of state.cardIndex) {
          if (seen.has(item.id)) continue;
          if (toQueryText(`${item.card} ${item.setCode} ${item.cardNo}`).includes(queryKey)) {
            seen.add(item.id);
            matches.push(item);
          }
        }

        return matches.slice(0, 300);
      }

      function findCatalogCardForSetAndNumber(setCode, cardNo) {
        const code = String(setCode || "").trim().toUpperCase();
        const no = String(cardNo || "").trim();
        if (!code || !no) return null;
        const directId = `english:${code}:${no}`;
        if (state.cardIndexById[directId]) return state.cardIndexById[directId];
        return (
          state.cardIndex.find(
            (item) => item.setCode === code && cardNumberMatchesTarget(item.cardNo, no)
          ) || null
        );
      }

      function collectionItemToPickerCard(item) {
        if (!item || String(item.type || "") !== "single") return null;
        if (String(item.setLanguage || "english").toLowerCase() === "japanese") return null;
        const setCode = String(item.setCode || "").trim().toUpperCase();
        const cardNo = String(item.cardNumber || "").trim();
        if (!setCode || !cardNo) return null;
        const fromCatalog = findCatalogCardForSetAndNumber(setCode, cardNo);
        if (fromCatalog) {
          return {
            ...fromCatalog,
            imageUrl: fromCatalog.imageUrl || String(item.imageUrl || "").trim()
          };
        }
        const cardName = String(item.name || "").trim() || "Card";
        const setName = String(item.setName || "").trim();
        return {
          id: `english:${setCode}:${cardNo}`,
          card: cardName,
          setCode,
          cardNo,
          setName,
          language: "english",
          label: `${cardName} (${setCode} #${cardNo})`,
          imageUrl: String(item.imageUrl || "").trim()
        };
      }

      function getPickerCardById(id) {
        const key = String(id || "").trim();
        if (!key) return null;
        return state.cardIndexById[key] || state.collectionPickerById[key] || null;
      }

      async function loadCollectionPickerCards({ force = false } = {}) {
        if (!isWatchlistAccountSignedIn()) {
          state.collectionPickerCards = [];
          state.collectionPickerById = {};
          state.collectionPickerLoaded = true;
          return;
        }
        if (state.collectionPickerLoaded && !force) return;
        try {
          const response = await fetch("/api/items?type=single&syncPrices=0", {
            credentials: "same-origin",
            cache: "no-store"
          });
          if (!response.ok) {
            state.collectionPickerCards = [];
            state.collectionPickerById = {};
            return;
          }
          const payload = await response.json().catch(() => ({}));
          const items = Array.isArray(payload?.items) ? payload.items : [];
          const byId = {};
          const cards = [];
          for (const item of items) {
            const card = collectionItemToPickerCard(item);
            if (!card || byId[card.id]) continue;
            byId[card.id] = card;
            cards.push(card);
          }
          cards.sort(
            (a, b) =>
              a.card.localeCompare(b.card) ||
              a.setCode.localeCompare(b.setCode) ||
              a.cardNo.localeCompare(b.cardNo)
          );
          state.collectionPickerCards = cards;
          state.collectionPickerById = byId;
        } catch {
          state.collectionPickerCards = [];
          state.collectionPickerById = {};
        } finally {
          state.collectionPickerLoaded = true;
        }
      }

      function filterCollectionPickerCards(query) {
        const cards = state.collectionPickerCards || [];
        if (!cards.length) return [];
        const q = String(query || "").trim();
        if (!q) return cards.slice(0, 120);
        const queryKey = toQueryText(q);
        return cards
          .filter((item) =>
            toQueryText(`${item.card} ${item.setCode} ${item.cardNo} ${item.setName || ""}`).includes(queryKey)
          )
          .slice(0, 120);
      }

      function bindPickerTileImageFallback(root) {
        if (!root) return;
        root.querySelectorAll("img").forEach((img) => {
          img.addEventListener(
            "error",
            () => {
              const wrap = img.closest(".watchlist-card-tile-visual");
              const tile = img.closest(".watchlist-card-tile");
              const id = tile ? tile.getAttribute("data-id") : "";
              const item = id ? getPickerCardById(id) : null;
              const ph = document.createElement("div");
              ph.className = "watchlist-card-tile-ph";
              ph.textContent =
                item && item.card ? `${item.card.slice(0, 22)}${item.card.length > 22 ? "…" : ""}` : "Card";
              img.remove();
              if (wrap) wrap.appendChild(ph);
            },
            { once: true }
          );
        });
      }

      function renderPickerTilesHtml(cards) {
        return cards
          .map((item) => {
            const sel = item.id === state.watchlistPickerSelectedId ? " selected" : "";
            const imgUrl = String(item.imageUrl || "").trim();
            const shortName = `${item.card.slice(0, 18)}${item.card.length > 18 ? "…" : ""}`;
            const visual = imgUrl
              ? `<img src="${escapeHtml(imgUrl)}" alt="" loading="eager" decoding="async" />`
              : `<div class="watchlist-card-tile-ph">${escapeHtml(shortName)}</div>`;
            return `<button type="button" class="watchlist-card-tile${sel}" data-id="${escapeHtml(item.id)}" role="option" aria-selected="${item.id === state.watchlistPickerSelectedId ? "true" : "false"}">
              <div class="watchlist-card-tile-visual">${visual}</div>
              <div class="watchlist-card-tile-label">${escapeHtml(item.label)}</div>
            </button>`;
          })
          .join("");
      }

      function syncPickerSelectionUi() {
        const selectedId = state.watchlistPickerSelectedId;
        if (!watchlistCardGrid) return;
        watchlistCardGrid.querySelectorAll(".watchlist-card-tile").forEach((node) => {
          const on = node.getAttribute("data-id") === selectedId;
          node.classList.toggle("selected", on);
          node.setAttribute("aria-selected", on ? "true" : "false");
        });
      }

      function selectPickerCard(id) {
        if (!id || !getPickerCardById(id)) return;
        state.watchlistPickerSelectedId = id;
        syncPickerSelectionUi();
      }

      function syncWatchlistSourceTabsUi() {
        const signedIn = isWatchlistAccountSignedIn();
        const source = state.watchlistPickerSource === "collection" && signedIn ? "collection" : "catalog";
        state.watchlistPickerSource = source;
        if (watchlistSourceTabs) {
          watchlistSourceTabs.classList.toggle("visible", signedIn);
        }
        [watchlistSourceCatalogBtn, watchlistSourceCollectionBtn].forEach((btn) => {
          if (!btn) return;
          const on = btn.getAttribute("data-source") === source;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-selected", on ? "true" : "false");
        });
        if (watchlistModalSub) {
          watchlistModalSub.textContent =
            source === "collection"
              ? "Browse singles from your personal collection"
              : "Click a card to select, double-click or use Add Card";
        }
        if (watchlistSearchInput) {
          watchlistSearchInput.placeholder =
            source === "collection"
              ? "Search your collection..."
              : "Search card name, set code, or nickname...";
        }
        if (watchlistCardGrid) {
          watchlistCardGrid.setAttribute(
            "aria-label",
            source === "collection" ? "Choose a card from your collection" : "Choose a card from Sets"
          );
        }
      }

      function setWatchlistPickerSource(source) {
        const next = source === "collection" && isWatchlistAccountSignedIn() ? "collection" : "catalog";
        state.watchlistPickerSource = next;
        state.watchlistPickerSelectedId = null;
        syncWatchlistSourceTabsUi();
        renderCardPickerOptions();
      }

      function renderCardPickerOptions() {
        if (!watchlistCardGrid) return;
        syncWatchlistSourceTabsUi();
        const query = watchlistSearchInput ? watchlistSearchInput.value : "";
        const usingCollection = state.watchlistPickerSource === "collection" && isWatchlistAccountSignedIn();
        const filtered = usingCollection ? filterCollectionPickerCards(query) : filterWatchlistCards(query);

        if (!filtered.length) {
          state.watchlistPickerSelectedId = null;
          const emptyMsg = usingCollection
            ? state.collectionPickerCards.length
              ? "No matching collection cards."
              : "No singles in your collection yet."
            : "No matching cards.";
          watchlistCardGrid.innerHTML = `<div class="watchlist-card-grid-empty" role="option">${emptyMsg}</div>`;
          return;
        }

        if (!filtered.some((item) => item.id === state.watchlistPickerSelectedId)) {
          state.watchlistPickerSelectedId = filtered[0].id;
        }

        watchlistCardGrid.innerHTML = renderPickerTilesHtml(filtered);
        bindPickerTileImageFallback(watchlistCardGrid);
        syncPickerSelectionUi();
      }

      function openWatchlistModal() {
        if (!watchlistModal) return;
        if (!isWatchlistAccountSignedIn()) state.watchlistPickerSource = "catalog";
        syncWatchlistSourceTabsUi();
        watchlistModal.classList.add("open");
        watchlistModal.setAttribute("aria-hidden", "false");
        if (watchlistSearchInput) watchlistSearchInput.focus();
      }

      function closeWatchlistModal() {
        if (!watchlistModal) return;
        watchlistModal.classList.remove("open");
        watchlistModal.setAttribute("aria-hidden", "true");
        state.watchlistPickerSelectedId = null;
        state.watchlistPickerSource = "catalog";
        if (watchlistSearchInput) watchlistSearchInput.value = "";
      }

      function formatWatchlistMoveClass(change) {
        const hasChange = Number.isFinite(change);
        return hasChange ? (change >= 0 ? "up" : "down") : "muted";
      }

      function formatWatchlistMoveText(change, digits = 2) {
        const hasChange = Number.isFinite(change);
        if (!hasChange) return "--";
        const sign = change >= 0 ? "+" : "";
        return `${sign}${formatNumber(change, digits)}`;
      }

      function formatWatchlistPctText(changePct) {
        const hasChange = Number.isFinite(changePct);
        if (!hasChange) return "--";
        const sign = changePct >= 0 ? "+" : "";
        return `${sign}${formatNumber(changePct, 2)}%`;
      }

      function renderWatchlist() {
        if (!watchlistBody) return;
        if (!state.watchlist.length) {
          watchlistBody.innerHTML = `<tr><td colspan="4" class="muted" style="text-align:center; padding:12px;">No cards yet. Click + to add one.</td></tr>`;
          return;
        }
        const showPsa = state.showPsa10Overlay;
        watchlistBody.innerHTML = state.watchlist.map((item) => {
          const hasChange = Number.isFinite(item.change);
          const moveClass = formatWatchlistMoveClass(item.change);
          const sign = hasChange && item.change >= 0 ? "+" : "";
          const activeClass = item.id === state.selectedWatchlistId ? "active" : "";
          const lastCell = showPsa
            ? `<div class="watch-metrics-stack">
                <div class="watch-metric-line">${Number.isFinite(item.last) ? formatNumber(item.last, 2) : "--"}</div>
                <div class="watch-metric-line watch-metric-psa">${Number.isFinite(item.psaLast) ? formatNumber(item.psaLast, 2) : "--"}</div>
              </div>`
            : `${Number.isFinite(item.last) ? formatNumber(item.last, 2) : "--"}`;
          const changeCell = showPsa
            ? `<div class="watch-metrics-stack">
                <div class="watch-metric-line ${moveClass}">${hasChange ? `${sign}${formatNumber(item.change, 2)}` : "--"}</div>
                <div class="watch-metric-line watch-metric-psa ${formatWatchlistMoveClass(item.psaChange)}">${formatWatchlistMoveText(item.psaChange)}</div>
              </div>`
            : `<span class="${moveClass}">${hasChange ? `${sign}${formatNumber(item.change, 2)}` : "--"}</span>`;
          const pctCell = showPsa
            ? `<div class="watch-metrics-stack">
                <div class="watch-metric-line ${moveClass}">${hasChange ? `${sign}${formatNumber(item.changePct, 2)}%` : "--"}</div>
                <div class="watch-metric-line watch-metric-psa ${formatWatchlistMoveClass(item.psaChangePct)}">${formatWatchlistPctText(item.psaChangePct)}</div>
              </div>`
            : `<span class="${moveClass}">${hasChange ? `${sign}${formatNumber(item.changePct, 2)}%` : "--"}</span>`;
          return `
            <tr class="${activeClass}" data-watch-id="${escapeHtml(item.id)}">
              <td title="${escapeHtml(item.card)}"><span class="watch-card">${escapeHtml(item.card)}</span></td>
              <td>${lastCell}</td>
              <td>${changeCell}</td>
              <td>${pctCell}</td>
            </tr>
          `;
        }).join("");
        watchlistBody.querySelectorAll("tr[data-watch-id]").forEach((row) => {
          row.addEventListener("click", () => {
            const id = row.getAttribute("data-watch-id");
            if (id) selectWatchlistCard(id);
          });
        });
      }

      function addWatchlistCard() {
        const selectedId = state.watchlistPickerSelectedId;
        const selected = selectedId ? getPickerCardById(selectedId) : null;
        if (!selected) return;
        const id = selected.id;
        if (!state.watchlist.some((item) => item.id === id)) {
          state.watchlist.push({
            id,
            card: selected.label,
            cardName: selected.card,
            setCode: selected.setCode,
            cardNo: selected.cardNo,
            setName: selected.setName || "",
            language: selected.language || "english",
            last: null,
            change: null,
            changePct: null,
            psaLast: null,
            psaChange: null,
            psaChangePct: null
          });
        }
        renderWatchlist();
        closeWatchlistModal();
        scheduleSaveWatchlist({ immediate: true });
        selectWatchlistCard(id);
      }

      function removeSelectedWatchlistCard() {
        if (!state.watchlist.length) return;
        if (!state.selectedWatchlistId) {
          window.alert("Select a card in the watchlist first.");
          return;
        }

        const currentIndex = state.watchlist.findIndex((item) => item.id === state.selectedWatchlistId);
        if (currentIndex === -1) {
          stopLivePolling();
          state.selectedWatchlistId = null;
          resetChartHistoryState();
          state.chartMessage = "Select a card from the watchlist to load its chart";
          renderWatchlist();
          drawChart();
          return;
        }

        state.watchlist.splice(currentIndex, 1);
        scheduleSaveWatchlist({ immediate: true });
        if (!state.watchlist.length) {
          stopLivePolling();
          state.selectedWatchlistId = null;
          resetChartHistoryState();
          state.chartMessage = "Select a card from the watchlist to load its chart";
          renderWatchlist();
          drawChart();
          return;
        }

        const fallback = state.watchlist[Math.max(0, currentIndex - 1)];
        selectWatchlistCard(fallback.id);
      }

      function stopLivePolling() {
        if (state.livePollTimer) {
          clearInterval(state.livePollTimer);
          state.livePollTimer = null;
        }
      }

      function getWatchlistItem(id) {
        return state.watchlist.find((item) => item.id === id) || null;
      }

      function isWatchlistAccountSignedIn() {
        return Boolean(window.InfinityAccount && window.InfinityAccount.isSignedIn());
      }

      function toWatchlistMetric(value) {
        if (value === null || value === undefined || value === "") return null;
        const n = Number(value);
        return Number.isFinite(n) ? n : null;
      }

      function serializeWatchlistEntry(item) {
        return {
          id: String(item?.id || "").trim(),
          card: String(item?.card || "").trim(),
          cardName: String(item?.cardName || "").trim(),
          setCode: String(item?.setCode || "").trim().toUpperCase(),
          cardNo: String(item?.cardNo || "").trim(),
          setName: String(item?.setName || "").trim(),
          language: String(item?.language || "english").trim().toLowerCase() || "english",
          last: toWatchlistMetric(item?.last),
          change: toWatchlistMetric(item?.change),
          changePct: toWatchlistMetric(item?.changePct),
          psaLast: toWatchlistMetric(item?.psaLast),
          psaChange: toWatchlistMetric(item?.psaChange),
          psaChangePct: toWatchlistMetric(item?.psaChangePct)
        };
      }

      function hydrateWatchlistEntry(saved) {
        return serializeWatchlistEntry(saved);
      }

      function scheduleSaveWatchlist({ immediate = false } = {}) {
        if (!isWatchlistAccountSignedIn()) return;
        if (watchlistSaveTimer) {
          clearTimeout(watchlistSaveTimer);
          watchlistSaveTimer = null;
        }
        if (immediate) {
          void persistWatchlist();
          return;
        }
        watchlistSaveTimer = setTimeout(() => {
          watchlistSaveTimer = null;
          void persistWatchlist();
        }, 400);
      }

      async function persistWatchlist() {
        if (!isWatchlistAccountSignedIn()) return false;
        if (watchlistSaveInFlight) return watchlistSaveInFlight;
        watchlistSaveInFlight = (async () => {
          try {
            const response = await fetch("/api/poke-view/watchlist", {
              method: "PUT",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ cards: state.watchlist.map(serializeWatchlistEntry) })
            });
            if (!response.ok) return false;
            const payload = await response.json().catch(() => null);
            return Boolean(payload?.ok);
          } catch {
            return false;
          } finally {
            watchlistSaveInFlight = null;
          }
        })();
        return watchlistSaveInFlight;
      }

      function mergeWatchlistEntries(serverCards, localCards) {
        const byId = new Map();
        for (const raw of Array.isArray(serverCards) ? serverCards : []) {
          const row = hydrateWatchlistEntry(raw);
          if (row.id) byId.set(row.id, row);
        }
        for (const raw of Array.isArray(localCards) ? localCards : []) {
          const row = hydrateWatchlistEntry(raw);
          if (!row.id) continue;
          const existing = byId.get(row.id);
          if (!existing) {
            byId.set(row.id, row);
            continue;
          }
          byId.set(row.id, {
            ...existing,
            card: row.card || existing.card,
            cardName: row.cardName || existing.cardName,
            setName: row.setName || existing.setName,
            last: row.last != null ? row.last : existing.last,
            change: row.change != null ? row.change : existing.change,
            changePct: row.changePct != null ? row.changePct : existing.changePct,
            psaLast: row.psaLast != null ? row.psaLast : existing.psaLast,
            psaChange: row.psaChange != null ? row.psaChange : existing.psaChange,
            psaChangePct: row.psaChangePct != null ? row.psaChangePct : existing.psaChangePct
          });
        }
        return [...byId.values()];
      }

      async function loadSavedWatchlist({ mergeLocal = false } = {}) {
        if (!isWatchlistAccountSignedIn()) return false;
        try {
          const response = await fetch("/api/poke-view/watchlist", {
            credentials: "same-origin",
            cache: "no-store"
          });
          if (!response.ok) return false;
          const payload = await response.json();
          if (!payload?.ok || !Array.isArray(payload.cards)) return false;

          const localSnapshot = state.watchlist.map(serializeWatchlistEntry);
          stopLivePolling();
          state.watchlist = mergeLocal
            ? mergeWatchlistEntries(payload.cards, localSnapshot)
            : payload.cards.map(hydrateWatchlistEntry);

          if (mergeLocal && state.watchlist.length) {
            await persistWatchlist();
          }

          const keepSelected =
            state.selectedWatchlistId && state.watchlist.some((item) => item.id === state.selectedWatchlistId);
          if (!keepSelected) {
            state.selectedWatchlistId = state.watchlist[0]?.id || null;
          }
          renderWatchlist();
          updatePsa10ToggleUi();

          if (state.selectedWatchlistId) {
            selectWatchlistCard(state.selectedWatchlistId);
          } else {
            resetChartHistoryState();
            state.chartMessage = "Select a card from the watchlist to load its chart";
            syncChartSymbolHeader();
            drawChart();
          }
          return true;
        } catch {
          return false;
        }
      }

      async function handleWatchlistAuthChange({ signedIn } = {}) {
        if (signedIn) {
          watchlistEverSignedIn = true;
          state.collectionPickerLoaded = false;
          const hadLocalCards = state.watchlist.length > 0;
          await loadSavedWatchlist({ mergeLocal: hadLocalCards });
          return;
        }
        if (!watchlistEverSignedIn) return;
        watchlistEverSignedIn = false;
        if (watchlistSaveTimer) {
          clearTimeout(watchlistSaveTimer);
          watchlistSaveTimer = null;
        }
        await persistWatchlist();
        stopLivePolling();
        state.watchlist = [];
        state.selectedWatchlistId = null;
        state.collectionPickerCards = [];
        state.collectionPickerById = {};
        state.collectionPickerLoaded = false;
        state.watchlistPickerSource = "catalog";
        resetChartHistoryState();
        state.chartMessage = "Select a card from the watchlist to load its chart";
        syncChartSymbolHeader();
        renderWatchlist();
        updatePsa10ToggleUi();
        drawChart();
      }

      function bootWatchlistAuthSync() {
        if (watchlistAuthBooted) return;
        watchlistAuthBooted = true;
        if (window.InfinityAccount) {
          window.InfinityAccount.onChange((detail) => {
            void handleWatchlistAuthChange(detail || {});
          });
        }
      }

      function flushWatchlistOnUnload() {
        if (!isWatchlistAccountSignedIn() || !state.watchlist.length) return;
        try {
          const body = JSON.stringify({ cards: state.watchlist.map(serializeWatchlistEntry) });
          fetch("/api/poke-view/watchlist", {
            method: "PUT",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body,
            keepalive: true
          });
        } catch {
          /* ignore */
        }
      }

      function seedFromText(text) {
        let hash = 2166136261;
        const value = String(text || "");
        for (let i = 0; i < value.length; i += 1) {
          hash ^= value.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return Math.abs(hash >>> 0);
      }

      function desiredHistoryBarsForPreset(key, stepMs) {
        const s = Math.max(1, Number(stepMs) || barDurationMs());
        if (key === "1D") return Math.ceil((24 * 60 * 60 * 1000) / s) + 1;
        if (key === "1W") return Math.ceil((7 * 24 * 60 * 60 * 1000) / s) + 1;
        if (key === "1M") return Math.ceil((30 * 24 * 60 * 60 * 1000) / s) + 1;
        if (key === "3M") return Math.ceil((90 * 24 * 60 * 60 * 1000) / s) + 1;
        if (key === "6M") return Math.ceil((180 * 24 * 60 * 60 * 1000) / s) + 1;
        // For longer presets we keep existing history size (we don't want huge arrays at minute bars).
        return 0;
      }

      function desiredHistoryBars() {
        const cfg = TIMEFRAME_CONFIG[state.timeframe] || TIMEFRAME_CONFIG["3m"];
        const stepMs = cfg.seed * 60 * 1000;
        return Math.max(cfg.count, desiredHistoryBarsForPreset(state.activeRangePreset, stepMs) || 0);
      }

      function generateCandlesFromPrice(seedInput, basePrice, options = null) {
        const cfg = TIMEFRAME_CONFIG[state.timeframe] || TIMEFRAME_CONFIG["3m"];
        const cardSeed = seedFromText(seedInput);
        const rand = mulberry32(cfg.seed + cardSeed);
        const candles = [];
        const stepMs = Math.max(1, Number(options?.stepMs) || barDurationMs());
        const totalBars = Math.max(10, Math.floor(Number(options?.count) || desiredHistoryBars()));
        const startTs = Number.isFinite(Number(options?.startTs))
          ? Number(options.startTs)
          : Date.now() - (totalBars - 1) * stepMs;
        let close = Math.max(2, Number(basePrice) || 40 + (cardSeed % 240));

        for (let i = 0; i < totalBars; i += 1) {
          const open = close;
          const move = (rand() - 0.5 + cfg.drift) * cfg.volatility;
          close = Math.max(2, open * (1 + move));
          const high = Math.max(open, close) * (1 + rand() * cfg.volatility * 0.5);
          const low = Math.min(open, close) * (1 - rand() * cfg.volatility * 0.5);
          const volume = 500 + rand() * 1800 + Math.abs(close - open) * 2;
          candles.push({ open, high, low, close, volume, ts: startTs + i * stepMs });
        }

        // Anchor the tail close near live price.
        if (candles.length) {
          const lastIndex = candles.length - 1;
          const prevClose = candles[lastIndex].open;
          candles[lastIndex].close = Math.max(2, Number(basePrice) || prevClose);
          candles[lastIndex].high = Math.max(candles[lastIndex].high, prevClose, candles[lastIndex].close);
          candles[lastIndex].low = Math.min(candles[lastIndex].low, prevClose, candles[lastIndex].close);
        }

        return candles;
      }

      function appendLivePoint(price) {
        const n = Number(price);
        if (!Number.isFinite(n) || n <= 0) return;
        const nextClose = Math.max(2, n);
        if (!state.candles.length) {
          state.candles = generateCandlesFromPrice(state.selectedWatchlistId || "live", nextClose);
          return;
        }
        const prev = state.candles[state.candles.length - 1];
        const open = Number.isFinite(prev?.close) ? prev.close : nextClose;
        const wiggle = Math.max(0.01, nextClose * 0.006);
        const high = Math.max(open, nextClose) + Math.random() * wiggle;
        const low = Math.max(0.5, Math.min(open, nextClose) - Math.random() * wiggle);
        const volume = 600 + Math.random() * 1600 + Math.abs(nextClose - open) * 8;
        const nextTsRaw = Number(prev?.ts);
        const nextTs = Number.isFinite(nextTsRaw) ? nextTsRaw + barDurationMs() : Date.now();
        state.candles.push({ open, high, low, close: nextClose, volume, ts: nextTs });

        const maxPoints = desiredHistoryBars();
        if (state.candles.length > maxPoints) {
          state.candles = state.candles.slice(state.candles.length - maxPoints);
        }
        if (state.chartVisibleCount != null) {
          const n = state.candles.length;
          state.chartScroll = Math.max(0, n - state.chartVisibleCount);
        }
      }

      async function fetchLiveCardSnapshot(watchItem) {
        const params = new URLSearchParams({
          card: watchItem.cardName || watchItem.card || "",
          cardName: watchItem.cardName || watchItem.card || "",
          setCode: watchItem.setCode || "",
          cardNo: watchItem.cardNo || ""
        });
        const setName = String(watchItem.setName || "").trim();
        if (setName) params.set("setName", setName);
        const response = await fetch(`/api/providers/pricecharting/live-card?${params.toString()}`);
        const payload = response.ok ? await response.json() : null;
        if (!response.ok || !payload?.ok || !payload.live) {
          throw new Error(payload?.error || "Could not fetch PriceCharting live data");
        }
        return payload.live;
      }

      function pickPrimaryPriceChartingSeries(series) {
        const pcSeries = (Array.isArray(series) ? series : []).filter(
          (row) => String(row?.source || "").trim() === "pricecharting"
        );
        if (!pcSeries.length) return null;
        const preferKeys = ["used", "manualonly"];
        for (const key of preferKeys) {
          const row = pcSeries.find(
            (entry) =>
              String(entry?.variantKey || "").trim() === key &&
              Array.isArray(entry.points) &&
              entry.points.length
          );
          if (row) return row;
        }
        const preferLabels = ["Ungraded"];
        for (const label of preferLabels) {
          const row = pcSeries.find((entry) => {
            const text = String(entry?.label || "").trim().toLowerCase();
            return text.includes(label.toLowerCase()) && Array.isArray(entry.points) && entry.points.length;
          });
          if (row) return row;
        }
        return (
          pcSeries
            .slice()
            .sort(
              (a, b) =>
                (Array.isArray(b.points) ? b.points.length : 0) - (Array.isArray(a.points) ? a.points.length : 0)
            )[0] || null
        );
      }

      function pickPsa10PriceChartingSeries(series) {
        const pcSeries = (Array.isArray(series) ? series : []).filter(
          (row) => String(row?.source || "").trim() === "pricecharting"
        );
        if (!pcSeries.length) return null;
        const preferKeys = ["manualonly", "graded"];
        for (const key of preferKeys) {
          const row = pcSeries.find(
            (entry) =>
              String(entry?.variantKey || "").trim() === key &&
              Array.isArray(entry.points) &&
              entry.points.length
          );
          if (row) return row;
        }
        return (
          pcSeries.find((entry) => {
            const text = String(entry?.label || "").trim().toLowerCase();
            return text === "psa 10" && Array.isArray(entry.points) && entry.points.length;
          }) || null
        );
      }

      function marketHistoryPointsToCandles(points) {
        const sorted = (Array.isArray(points) ? points : [])
          .filter((p) => Number.isFinite(Number(p?.ts)) && Number(p?.price) > 0)
          .sort((a, b) => Number(a.ts) - Number(b.ts));
        return sorted.map((p, i) => {
          const price = Number(p.price);
          const prev = i > 0 ? Number(sorted[i - 1].price) : price;
          const open = prev;
          const close = price;
          const high = Math.max(open, close) * 1.002;
          const low = Math.max(0, Math.min(open, close) * 0.998);
          return { open, high, low, close, volume: 1, ts: Number(p.ts) };
        });
      }

      function startOfUtcDayMs(ms) {
        const d = new Date(Number(ms) || Date.now());
        return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      }

      function presetRangeBoundsMs(key, candles) {
        const now = Date.now();
        if (!Array.isArray(candles) || !candles.length || key === "ALL") {
          const lastTs = Number(candles?.[candles.length - 1]?.ts) || now;
          const firstTs = Number(candles?.[0]?.ts) || lastTs;
          return { startMs: firstTs, endMs: lastTs };
        }
        const endMs = now;
        let startMs = presetStartMs(key, endMs);
        if (key !== "YTD") startMs = startOfUtcDayMs(startMs);
        return { startMs, endMs };
      }

      function filterCandlesByPreset(candles, key) {
        if (!Array.isArray(candles) || !candles.length) return [];
        if (key === "ALL") return candles.slice();
        const { startMs, endMs } = presetRangeBoundsMs(key, candles);
        return candles.filter((c) => {
          const ts = Number(c.ts);
          return Number.isFinite(ts) && ts >= startMs && ts <= endMs;
        });
      }

      function computeRangeChange(candles) {
        if (!Array.isArray(candles) || !candles.length) {
          return { last: null, change: null, changePct: null };
        }
        const first = Number(candles[0].close);
        const last = Number(candles[candles.length - 1].close);
        if (!Number.isFinite(last) || last <= 0) {
          return { last: null, change: null, changePct: null };
        }
        if (!Number.isFinite(first) || candles.length < 2) {
          return { last, change: 0, changePct: 0 };
        }
        const change = last - first;
        const changePct = first > 0 ? (change / first) * 100 : 0;
        return { last, change, changePct };
      }

      function syncSelectedWatchlistMetrics() {
        const item = getWatchlistItem(state.selectedWatchlistId);
        if (!item || !state.historyCandlesFull.length) return;
        const rangeCandles = filterCandlesByPreset(state.historyCandlesFull, state.activeRangePreset);
        const metrics = computeRangeChange(rangeCandles);
        if (metrics.last != null) item.last = metrics.last;
        item.change = metrics.change;
        item.changePct = metrics.changePct;

        if (state.historyCandlesPsa10Full.length) {
          const psaRange = filterCandlesByPreset(state.historyCandlesPsa10Full, state.activeRangePreset);
          const psaMetrics = computeRangeChange(psaRange);
          if (psaMetrics.last != null) item.psaLast = psaMetrics.last;
          item.psaChange = psaMetrics.change;
          item.psaChangePct = psaMetrics.changePct;
        } else {
          item.psaLast = null;
          item.psaChange = null;
          item.psaChangePct = null;
        }
        scheduleSaveWatchlist();
      }

      function resetChartHistoryState() {
        state.candles = [];
        state.historyCandlesFull = [];
        state.historyCandlesPsa10Full = [];
        state.hasPsa10History = false;
        updatePsa10ToggleUi();
      }

      function applyHistoryToChart(fullCandles, psa10Candles = []) {
        state.historyCandlesFull = Array.isArray(fullCandles) ? fullCandles.slice() : [];
        state.historyCandlesPsa10Full = Array.isArray(psa10Candles) ? psa10Candles.slice() : [];
        state.hasPsa10History = state.historyCandlesPsa10Full.length > 0;
        if (!state.hasPsa10History) state.showPsa10Overlay = false;
        state.candles = state.historyCandlesFull.slice();
        syncSelectedWatchlistMetrics();
        state.applyChartViewportOnNextDraw = true;
        state.applyChartPriceScaleOnNextDraw = true;
        updatePsa10ToggleUi();
      }

      function updatePsa10ToggleUi() {
        if (!watchlistPsa10Btn) return;
        const available = state.hasPsa10History;
        watchlistPsa10Btn.disabled = !available;
        watchlistPsa10Btn.setAttribute("aria-pressed", state.showPsa10Overlay ? "true" : "false");
        watchlistPsa10Btn.classList.toggle("active", state.showPsa10Overlay);
        watchlistPsa10Btn.title = available
          ? state.showPsa10Overlay
            ? "Hide PSA 10 prices on chart"
            : "Show PSA 10 prices on chart"
          : "No PSA 10 price history for this card";
      }

      function togglePsa10Overlay() {
        if (!state.hasPsa10History) return;
        state.showPsa10Overlay = !state.showPsa10Overlay;
        if (state.showPsa10Overlay) {
          state.applyChartPriceScaleOnNextDraw = true;
        }
        updatePsa10ToggleUi();
        renderWatchlist();
        drawChart();
      }

      async function loadMarketHistoryCandles(item) {
        const params = new URLSearchParams({
          setCode: String(item.setCode || "").trim().toUpperCase(),
          cardNo: String(item.cardNo || "").trim(),
          cardName: String(item.cardName || item.card || "").trim(),
          range: "all",
          source: "pricecharting"
        });
        const setName = String(item.setName || "").trim();
        if (setName) params.set("setName", setName);

        const response = await fetch(`/api/sets/market-history?${params.toString()}`);
        const payload = response.ok ? await response.json() : null;
        if (!payload?.ok || !Array.isArray(payload.series) || !payload.series.length) {
          throw new Error(payload?.error || "No PriceCharting market history for this card");
        }
        const primary = pickPrimaryPriceChartingSeries(payload.series);
        if (!primary || !Array.isArray(primary.points) || !primary.points.length) {
          throw new Error("No PriceCharting price history points for this card");
        }
        const psa10Series = pickPsa10PriceChartingSeries(payload.series);
        item.historyLabel = String(primary.label || "Ungraded").trim();
        const productUrl = String(primary.productUrl || item.priceChartingUrl || "").trim();
        if (productUrl) item.priceChartingUrl = productUrl;
        return {
          raw: marketHistoryPointsToCandles(primary.points),
          psa10:
            psa10Series && Array.isArray(psa10Series.points) && psa10Series.points.length
              ? marketHistoryPointsToCandles(psa10Series.points)
              : []
        };
      }

      function updateLivePriceOnCandles(price) {
        const n = Number(price);
        if (!Number.isFinite(n) || n <= 0) return;
        const touch = (bar) => {
          if (!bar) return;
          const open = Number(bar.open);
          bar.close = n;
          bar.high = Math.max(Number(bar.high), open, n);
          bar.low = Math.min(Number(bar.low), open, n);
        };
        if (state.candles.length) touch(state.candles[state.candles.length - 1]);
        if (state.historyCandlesFull.length) touch(state.historyCandlesFull[state.historyCandlesFull.length - 1]);
      }

      function updateChartOverlay() {
        if (!chartOverlay) return;
        const msg = String(state.chartMessage || "").trim();
        chartOverlay.textContent = msg;
        chartOverlay.hidden = !msg;
      }

      async function refreshLivePriceOnly() {
        const item = getWatchlistItem(state.selectedWatchlistId);
        if (!item || !state.historyCandlesFull.length) return;
        try {
          const live = await fetchLiveCardSnapshot(item);
          updateLivePriceOnCandles(Number(live.marketPrice || 0));
          syncSelectedWatchlistMetrics();
          renderWatchlist();
          drawChart();
        } catch {
          /* polling should not clear the chart */
        }
      }

      function mulberry32(seed) {
        return function () {
          let t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function movingAverage(data, windowSize) {
        const result = [];
        let running = 0;
        for (let i = 0; i < data.length; i += 1) {
          running += data[i].close;
          if (i >= windowSize) running -= data[i - windowSize].close;
          if (i >= windowSize - 1) result.push(running / windowSize);
          else result.push(null);
        }
        return result;
      }

      const CHART_PAD = { top: 24, left: 10, right: 78, bottom: 28 };

      const CHART_THEME = {
        bg: "#131722",
        scaleBg: "#131722",
        grid: "rgba(42, 46, 57, 0.55)",
        border: "#2a2e39",
        tick: "rgba(54, 58, 69, 0.95)",
        text: "#d1d4dc",
        textMuted: "#787b86",
        up: "#089981",
        down: "#f23645",
        ma: "#ff9800",
        crosshair: "rgba(235, 237, 240, 0.4)",
        drawing: "rgba(41, 98, 255, 0.82)",
        volumeUp: "rgba(8, 153, 129, 0.45)",
        volumeDown: "rgba(242, 54, 69, 0.45)",
        placeholderVol: "rgba(42, 46, 57, 0.35)",
        chipBg: "#363a45",
        chipBorder: "#4e535c",
        chipText: "#f0f3f6",
        draft: "rgba(255, 152, 0, 0.9)",
        zoomBox: "rgba(41, 98, 255, 0.75)"
      };

      function resetChartView() {
        state.chartScroll = 0;
        state.chartVisibleCount = null;
        state.priceExpand = 0.07;
        state.priceScaleManual = null;
        state.activeRangePreset = "ALL";
        state.timeScaleOverrideMs = null;
        updateRangeTabButtons();
      }

      function clampPriceAxisMinZero(minV, maxV) {
        let lo = Number(minV);
        let hi = Number(maxV);
        if (!Number.isFinite(lo) || !Number.isFinite(hi)) return { min: minV, max: maxV };
        if (lo < 0) lo = 0;
        if (hi <= lo) {
          const prevSpan = Math.max(1e-9, Number(maxV) - Number(minV));
          hi = lo + Math.max(1e-6, prevSpan);
        }
        return { min: lo, max: hi };
      }

      function clampChartPrice(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return 0;
        return Math.max(0, n);
      }

      function zoomPriceRangeAroundAnchor(minV, maxV, anchor, factor) {
        const span = maxV - minV || 1;
        let newSpan = span * factor;
        const minSpan = Math.max(1e-9, span * 0.04);
        const maxSpan = Math.max(span, Math.abs(maxV - minV)) * 80;
        newSpan = Math.max(minSpan, Math.min(maxSpan, newSpan));
        const t = Math.max(0, Math.min(1, (anchor - minV) / span));
        const rawMin = anchor - t * newSpan;
        const rawMax = anchor + (1 - t) * newSpan;
        const c = clampPriceAxisMinZero(rawMin, rawMax);
        return { min: c.min, max: c.max };
      }

      function visibleBarRange(totalBars) {
        const n = Math.max(0, Math.floor(totalBars));
        if (!n) return { from: 0, count: 0 };
        let count = state.chartVisibleCount;
        if (count == null || count > n) count = n;
        count = Math.max(1, Math.floor(count));
        let from = Math.floor(state.chartScroll);
        from = Math.max(0, Math.min(from, Math.max(0, n - count)));
        return { from, count };
      }

      function ensureScrollableTimeWindow(layoutLike) {
        const n = chartBarTotal();
        if (n <= 1) return;
        const current = state.chartVisibleCount == null ? n : Math.max(1, Math.floor(state.chartVisibleCount));
        if (current < n) return;
        const base = Math.max(10, Math.floor((layoutLike?.count || n) * 0.9));
        const next = Math.max(10, Math.min(n - 1, base));
        state.chartVisibleCount = next;
        state.chartScroll = Math.max(0, n - next);
      }
