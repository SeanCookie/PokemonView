      function getVisibleWindow(candles) {
        const n = candles.length;
        if (!n) return { from: 0, count: 0, slice: [], total: 0 };
        const { from, count } = visibleBarRange(n);
        return { from, count, slice: candles.slice(from, from + count), total: n };
      }

      const EMPTY_CHART_PLACEHOLDER_BARS = 120;
      const EMPTY_SHELL_PRICE_LO = 48;
      const EMPTY_SHELL_PRICE_HI = 212;

      function chartBarTotal() {
        return state.candles.length || EMPTY_CHART_PLACEHOLDER_BARS;
      }

      function updateRangeTabButtons() {
        document.querySelectorAll(".chart-range-btn").forEach((btn) => {
          const k = btn.getAttribute("data-range");
          const on = state.activeRangePreset === k;
          btn.classList.toggle("active", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      function applyChartRangePreset(key) {
        const n0 = chartBarTotal();
        if (!n0) return;
        state.activeRangePreset = key;

        const endTs = getBarTimestamp(n0 - 1, n0);
        let startTs = null;
        let spanMs = null;
        if (key === "1D") {
          spanMs = 24 * 60 * 60 * 1000;
          startTs = endTs - spanMs;
        } else if (key === "1W") {
          spanMs = 7 * 24 * 60 * 60 * 1000;
          startTs = endTs - spanMs;
        } else if (key === "1M") {
          spanMs = 30 * 24 * 60 * 60 * 1000;
          startTs = endTs - spanMs;
        } else if (key === "YTD") {
          startTs = new Date(2026, 0, 1).getTime();
          spanMs = Math.max(0, endTs - startTs);
        } else if (key === "1Y") {
          spanMs = 365 * 24 * 60 * 60 * 1000;
          startTs = endTs - spanMs;
        }

        // Force each preset to span the exact requested calendar range on the x-axis.
        if (spanMs != null && spanMs > 0) {
          const sourceCount = state.candles.length || n0;
          const targetCount = Math.max(60, Math.min(900, sourceCount));
          const stepMs = Math.max(60 * 1000, Math.floor(spanMs / Math.max(1, targetCount - 1)));
          state.timeScaleOverrideMs = stepMs;

          if (state.candles.length) {
            const lastClose = Number(state.candles[state.candles.length - 1]?.close) || 0;
            state.candles = generateCandlesFromPrice(state.selectedWatchlistId || "live", lastClose, {
              count: targetCount,
              stepMs,
              startTs: endTs - (targetCount - 1) * stepMs
            });
          }
        } else {
          state.timeScaleOverrideMs = null;
        }

        const n = chartBarTotal();
        if (startTs != null) {
          if (state.candles.length) {
            let idx = 0;
            for (let i = 0; i < state.candles.length; i += 1) {
              const ts = Number(state.candles[i]?.ts);
              if (Number.isFinite(ts) && ts >= startTs) {
                idx = i;
                break;
              }
            }
            const nn = state.candles.length;
            const cnt = Math.max(10, Math.min(nn, nn - idx));
            state.chartVisibleCount = cnt >= nn ? null : cnt;
            state.chartScroll = cnt >= nn ? 0 : Math.max(0, nn - cnt);
          } else {
            const stepMs = barDurationMs();
            const bars = Math.max(10, Math.min(n, Math.ceil((endTs - startTs) / Math.max(1, stepMs)) + 1));
            state.chartVisibleCount = bars >= n ? null : bars;
            state.chartScroll = bars >= n ? 0 : Math.max(0, n - bars);
          }
        } else {
          state.chartVisibleCount = null;
          state.chartScroll = 0;
        }

        updateRangeTabButtons();
        drawChart();
      }

      function emptyShellPriceRange() {
        const br = EMPTY_SHELL_PRICE_HI - EMPTY_SHELL_PRICE_LO || 1;
        const ex = Math.max(0.02, Math.min(0.48, state.priceExpand));
        const pm = state.priceScaleManual;
        if (pm && Number.isFinite(pm.min) && Number.isFinite(pm.max) && pm.max > pm.min) {
          const c = clampPriceAxisMinZero(pm.min, pm.max);
          if (c.min !== pm.min || c.max !== pm.max) {
            state.priceScaleManual = { min: c.min, max: c.max };
          }
          return { minPrice: c.min, maxPrice: c.max };
        }
        const c = clampPriceAxisMinZero(EMPTY_SHELL_PRICE_LO - br * ex, EMPTY_SHELL_PRICE_HI + br * ex);
        return { minPrice: c.min, maxPrice: c.max };
      }

      function computeChartLayout(width, height) {
        const padTop = CHART_PAD.top;
        const padLeft = CHART_PAD.left;
        const padRight = CHART_PAD.right;
        const padBottom = CHART_PAD.bottom;
        const volumeHeight = 0;
        const priceHeight = height - padTop - padBottom;
        const priceBottom = padTop + priceHeight;
        const chartLeft = padLeft;
        const chartWidth = width - padLeft - padRight;
        return {
          width,
          height,
          padTop,
          padLeft,
          padRight,
          padBottom,
          volumeHeight,
          priceHeight,
          priceBottom,
          chartLeft,
          chartWidth,
          volumeTop: priceBottom
        };
      }

      function barToX(barIdx, layout, from, count) {
        if (count <= 0) return layout.chartLeft;
        const step = layout.chartWidth / count;
        return layout.chartLeft + (barIdx - from + 0.5) * step;
      }

      function xToBarIndex(x, layout, from, count) {
        if (count <= 0) return from;
        const step = layout.chartWidth / count;
        return from + (x - layout.chartLeft) / step - 0.5;
      }

      function hitChartZone(lx, ly, layout) {
        const { width, height, padTop, padLeft, padRight, padBottom, priceBottom } = layout;
        const chartBottom = height - padBottom;
        if (ly >= priceBottom && ly < chartBottom && lx >= padLeft && lx < width - padRight) return "time";
        if (lx >= width - padRight + 1 && lx < width - 1 && ly >= padTop && ly <= chartBottom) return "price";
        if (lx >= padLeft && lx < width - padRight && ly >= padTop && ly <= priceBottom) return "main";
        return "none";
      }

      function barDurationMs() {
        if (Number.isFinite(state.timeScaleOverrideMs) && state.timeScaleOverrideMs > 0) return state.timeScaleOverrideMs;
        const cfg = TIMEFRAME_CONFIG[state.timeframe] || TIMEFRAME_CONFIG["3m"];
        return cfg.seed * 60 * 1000;
      }

      function getBarTimestamp(globalBarIndex, totalBars) {
        const n = Math.max(1, Math.floor(totalBars));
        const clamped = Math.max(0, Math.min(n - 1, Math.round(globalBarIndex)));
        const ts = Number(state.candles?.[clamped]?.ts);
        if (Number.isFinite(ts)) return ts;
        return Date.now() - (n - 1 - clamped) * barDurationMs();
      }

      function formatCalendarAxisLabel(ts, visibleSpanMs) {
        const d = new Date(ts);
        if (visibleSpanMs > 1000 * 60 * 60 * 24 * 365 * 2) {
          return d.getFullYear().toString();
        }
        if (visibleSpanMs > 1000 * 60 * 60 * 24 * 90) {
          return d.toLocaleDateString(undefined, { month: "short", year: "numeric" });
        }
        if (visibleSpanMs > 1000 * 60 * 60 * 24 * 2) {
          return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
        }
        return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }

      function formatCrosshairTimeLabel(ts) {
        const d = new Date(ts);
        return d.toLocaleString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function buildTimeAxisTicks(from, count, totalBars) {
        const ticks = [];
        if (count <= 0) return ticks;
        const minGapBars = Math.max(1, Math.floor(count / 10));
        for (let i = 0; i < count; i += minGapBars) {
          ticks.push(from + i);
        }
        const end = from + count - 1;
        if (!ticks.length || ticks[ticks.length - 1] !== end) ticks.push(end);
        return ticks.map((bi) => {
          const ts = getBarTimestamp(bi, totalBars);
          const span = (count - 1) * barDurationMs();
          return { bi, ts, label: formatCalendarAxisLabel(ts, span) };
        });
      }

      function formatTimeAxisLabelForBar(globalBarIndex, totalBars) {
        const ts = getBarTimestamp(globalBarIndex, totalBars);
        const span = (Math.max(1, totalBars) - 1) * barDurationMs();
        return formatCalendarAxisLabel(ts, span);
      }

      function formatTimeAxisLabel(globalBarIndex) {
        return formatTimeAxisLabelForBar(globalBarIndex, state.candles.length);
      }

      function formatPriceAxisLabel(price) {
        const n = Number(price);
        if (!Number.isFinite(n)) return "—";
        if (n < 0) return "";
        if (n === 0) return "0";
        const a = Math.abs(n);
        if (a >= 10000) return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        if (a >= 100) return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        if (a >= 1) return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return n.toFixed(4);
      }

      function drawAxisLabelChip(ctx, text, cx, cy, align) {
        const T = CHART_THEME;
        ctx.font = "11px ui-monospace, Consolas, 'Segoe UI', monospace";
        const padX = 6;
        const w = ctx.measureText(text).width + padX * 2;
        const h = 18;
        let x = cx;
        if (align === "right") x = cx - w;
        else if (align === "center") x = cx - w / 2;
        ctx.fillStyle = T.chipBg;
        ctx.strokeStyle = T.chipBorder;
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (typeof ctx.roundRect === "function") ctx.roundRect(x, cy - h / 2, w, h, 2);
        else ctx.rect(x, cy - h / 2, w, h);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = T.chipText;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, x + w / 2, cy);
      }

      function drawChartEmptyShell(ctx, width, height) {
        const layout = computeChartLayout(width, height);
        const padTop = layout.padTop;
        const padLeft = layout.padLeft;
        const padRight = layout.padRight;
        const padBottom = layout.padBottom;
        const priceBottom = layout.priceBottom;
        const priceHeight = layout.priceHeight;
        const chartWidth = layout.chartWidth;
        const volumeHeight = layout.volumeHeight;
        const chartBottom = height - padBottom;
        const nVirt = EMPTY_CHART_PLACEHOLDER_BARS;
        const { from, count } = visibleBarRange(nVirt);
        const fake = generateCandlesFromPrice("__empty__", 120, { count: nVirt });
        let dataMin = Infinity;
        let dataMax = -Infinity;
        for (const c of fake) {
          dataMin = Math.min(dataMin, c.low);
          dataMax = Math.max(dataMax, c.high);
        }
        const range = dataMax - dataMin || 1;
        const ex = Math.max(0.02, Math.min(0.48, state.priceExpand));
        let minPrice = dataMin - range * ex;
        let maxPrice = dataMax + range * ex;
        const pm = state.priceScaleManual;
        if (pm && Number.isFinite(pm.min) && Number.isFinite(pm.max) && pm.max > pm.min) {
          minPrice = pm.min;
          maxPrice = pm.max;
        }
        const cc = clampPriceAxisMinZero(minPrice, maxPrice);
        minPrice = cc.min;
        maxPrice = cc.max;
        const xStep = count > 0 ? chartWidth / count : chartWidth;
        const candleWidth = Math.max(2, xStep * 0.65);

        state._lastLayout = {
          ...layout,
          from,
          count,
          minPrice,
          maxPrice,
          emptyShell: true,
          xStep,
          candleWidth,
          maxVolume: 1
        };

        const T = CHART_THEME;
        ctx.fillStyle = T.bg;
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = T.grid;
        ctx.lineWidth = 1;
        for (let i = 0; i <= 6; i += 1) {
          const y = padTop + (priceHeight / 6) * i;
          ctx.beginPath();
          ctx.moveTo(padLeft, y);
          ctx.lineTo(width - padRight, y);
          ctx.stroke();
        }
        for (let i = 0; i <= 8; i += 1) {
          const x = padLeft + (chartWidth / 8) * i;
          ctx.beginPath();
          ctx.moveTo(x, padTop);
          ctx.lineTo(x, priceBottom);
          ctx.stroke();
        }

        // Fake candles in empty state.
        for (let i = 0; i < count; i += 1) {
          const c = fake[from + i];
          if (!c) continue;
          const g = from + i;
          const x = barToX(g, layout, from, count);
          const openY = priceBottom - ((c.open - minPrice) / (maxPrice - minPrice || 1)) * priceHeight;
          const closeY = priceBottom - ((c.close - minPrice) / (maxPrice - minPrice || 1)) * priceHeight;
          const highY = priceBottom - ((c.high - minPrice) / (maxPrice - minPrice || 1)) * priceHeight;
          const lowY = priceBottom - ((c.low - minPrice) / (maxPrice - minPrice || 1)) * priceHeight;
          const up = c.close >= c.open;
          const color = up ? T.up : T.down;
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, highY);
          ctx.lineTo(x, lowY);
          ctx.stroke();
          ctx.fillStyle = color;
          const bodyTop = Math.min(openY, closeY);
          const bodyHeight = Math.max(1, Math.abs(closeY - openY));
          ctx.fillRect(x - candleWidth / 2, bodyTop, candleWidth, bodyHeight);
        }

        ctx.fillStyle = T.scaleBg;
        ctx.fillRect(width - padRight, padTop, padRight, chartBottom - padTop);
        ctx.fillRect(0, layout.volumeTop, width - padRight, chartBottom - layout.volumeTop);

        ctx.strokeStyle = T.border;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(width - padRight + 0.5, padTop);
        ctx.lineTo(width - padRight + 0.5, chartBottom);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padLeft, priceBottom + 0.5);
        ctx.lineTo(width - padRight, priceBottom + 0.5);
        ctx.stroke();

        ctx.font = "11px ui-monospace, Consolas, 'Segoe UI', monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = T.text;
        for (let i = 0; i <= 6; i += 1) {
          const ratio = 1 - i / 6;
          const price = minPrice + (maxPrice - minPrice) * ratio;
          const yy = padTop + (priceHeight / 6) * i;
          ctx.strokeStyle = T.tick;
          ctx.beginPath();
          ctx.moveTo(width - padRight - 6, yy);
          ctx.lineTo(width - padRight, yy);
          ctx.stroke();
          ctx.fillText(formatPriceAxisLabel(price), width - 5, yy);
        }

        ctx.fillStyle = T.textMuted;
        ctx.font = "10px Inter, Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        const timeTicks = buildTimeAxisTicks(from, count, nVirt);
        for (const tick of timeTicks) {
          const bi = tick.bi;
          const x = barToX(bi, layout, from, count);
          const lab = tick.label;
          ctx.strokeStyle = T.tick;
          ctx.beginPath();
          ctx.moveTo(x, chartBottom - 16);
          ctx.lineTo(x, chartBottom - 22);
          ctx.stroke();
          ctx.fillText(lab, x, chartBottom - 8);
        }

        if (volumeHeight > 4) {
          ctx.fillStyle = T.placeholderVol;
          for (let i = 0; i < count; i += 3) {
            const g = from + i;
            const x = barToX(g, layout, from, count);
            ctx.fillRect(x - candleWidth / 2, layout.volumeTop + 2, candleWidth, volumeHeight - 4);
          }
        }

        ctx.fillStyle = T.textMuted;
        ctx.font = "13px Inter, Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
          state.chartMessage || "Select a card from the watchlist to load its chart",
          padLeft + chartWidth / 2,
          padTop + priceHeight / 2
        );
      }

      function drawChart() {
        if (!canvas) return;
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(320, Math.floor(rect.width));
        const height = Math.max(280, Math.floor(rect.height));
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);

        const ctx = canvas.getContext("2d");
        if (!ctx) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        const { candles } = state;
        if (!candles.length) {
          drawChartEmptyShell(ctx, width, height);
          return;
        }

        const layout = computeChartLayout(width, height);
        const { from, count, slice } = getVisibleWindow(candles);
        const padTop = layout.padTop;
        const padLeft = layout.padLeft;
        const padRight = layout.padRight;
        const priceBottom = layout.priceBottom;
        const priceHeight = layout.priceHeight;
        const chartWidth = layout.chartWidth;
        const volumeHeight = layout.volumeHeight;

        let dataMin = Infinity;
        let dataMax = -Infinity;
        let maxVolume = 0;
        for (const c of slice) {
          dataMin = Math.min(dataMin, c.low);
          dataMax = Math.max(dataMax, c.high);
          maxVolume = Math.max(maxVolume, c.volume);
        }
        const dataRange = dataMax - dataMin || 1;
        const ex = Math.max(0.02, Math.min(0.48, state.priceExpand));
        let minPrice;
        let maxPrice;
        const pm = state.priceScaleManual;
        if (
          pm &&
          Number.isFinite(pm.min) &&
          Number.isFinite(pm.max) &&
          pm.max > pm.min
        ) {
          minPrice = pm.min;
          maxPrice = pm.max;
        } else {
          minPrice = dataMin - dataRange * ex;
          maxPrice = dataMax + dataRange * ex;
        }
        {
          const c = clampPriceAxisMinZero(minPrice, maxPrice);
          minPrice = c.min;
          maxPrice = c.max;
          if (
            pm &&
            Number.isFinite(pm.min) &&
            Number.isFinite(pm.max) &&
            (c.min !== pm.min || c.max !== pm.max)
          ) {
            state.priceScaleManual = { min: c.min, max: c.max };
          }
        }

        const xStep = count > 0 ? chartWidth / count : chartWidth;
        const candleWidth = Math.max(2, xStep * 0.68);

        const yForPrice = (price) => {
          const ratio = (price - minPrice) / (maxPrice - minPrice || 1);
          return priceBottom - ratio * priceHeight;
        };

        state._lastLayout = {
          ...layout,
          from,
          count,
          minPrice,
          maxPrice,
          yForPrice,
          xStep,
          candleWidth,
          maxVolume
        };

        const T = CHART_THEME;
        ctx.fillStyle = T.bg;
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = T.grid;
        ctx.lineWidth = 1;
        for (let i = 0; i <= 6; i += 1) {
          const y = padTop + (priceHeight / 6) * i;
          ctx.beginPath();
          ctx.moveTo(padLeft, y);
          ctx.lineTo(width - padRight, y);
          ctx.stroke();
        }
        for (let i = 0; i <= 8; i += 1) {
          const x = padLeft + (chartWidth / 8) * i;
          ctx.beginPath();
          ctx.moveTo(x, padTop);
          ctx.lineTo(x, priceBottom);
          ctx.stroke();
        }

        for (let i = 0; i < count; i += 1) {
          const c = slice[i];
          const g = from + i;
          const x = barToX(g, layout, from, count);
          const openY = yForPrice(c.open);
          const closeY = yForPrice(c.close);
          const highY = yForPrice(c.high);
          const lowY = yForPrice(c.low);
          const up = c.close >= c.open;
          const color = up ? T.up : T.down;

          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, highY);
          ctx.lineTo(x, lowY);
          ctx.stroke();

          ctx.fillStyle = color;
          const bodyTop = Math.min(openY, closeY);
          const bodyHeight = Math.max(1, Math.abs(closeY - openY));
          ctx.fillRect(x - candleWidth / 2, bodyTop, candleWidth, bodyHeight);

          if (volumeHeight > 4) {
            const barX = x - candleWidth / 2;
            const barY = layout.volumeTop + (1 - c.volume / (maxVolume || 1)) * (volumeHeight - 2);
            const barH = (c.volume / (maxVolume || 1)) * (volumeHeight - 2);
            ctx.fillStyle = up ? T.volumeUp : T.volumeDown;
            ctx.fillRect(barX, barY, candleWidth, barH);
          }
        }

        const ma = movingAverage(candles, 20);
        ctx.strokeStyle = T.ma;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        let started = false;
        for (let i = 0; i < count; i += 1) {
          const g = from + i;
          const v = ma[g];
          if (v == null) continue;
          const x = barToX(g, layout, from, count);
          const y = yForPrice(v);
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.stroke();

        const drawSeg = (i0, p0, i1, p1, dash, extendRay) => {
          let x0 = barToX(i0, layout, from, count);
          let y0 = yForPrice(p0);
          let x1 = barToX(i1, layout, from, count);
          let y1 = yForPrice(p1);
          const dx = x1 - x0;
          const dy = y1 - y0;
          if (extendRay && (Math.abs(dx) > 1e-6 || Math.abs(dy) > 1e-6)) {
            const big = 4000;
            if (Math.abs(dx) > 1e-6) {
              const tR = (width - padRight - x0) / dx;
              const tL = (padLeft - x0) / dx;
              const tMax = Math.max(tR, tL, 0) + big / Math.abs(dx);
              const tMin = Math.min(tR, tL, 0) - big / Math.abs(dx);
              x1 = x0 + tMax * dx;
              y1 = y0 + tMax * dy;
              x0 = x0 + tMin * dx;
              y0 = y0 + tMin * dy;
            }
          }
          ctx.beginPath();
          ctx.setLineDash(dash || []);
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
          ctx.setLineDash([]);
        };

        ctx.strokeStyle = T.drawing;
        ctx.lineWidth = 1.25;
        for (const d of state.chartDrawings) {
          ctx.strokeStyle = T.drawing;
          if (d.type === "trendline") drawSeg(d.i0, d.p0, d.i1, d.p1, [], false);
          else if (d.type === "ray") drawSeg(d.i0, d.p0, d.i1, d.p1, [], true);
          else if (d.type === "hline") {
            const y = yForPrice(d.price);
            ctx.beginPath();
            ctx.moveTo(padLeft, y);
            ctx.lineTo(width - padRight, y);
            ctx.stroke();
          } else if (d.type === "vline") {
            const x = barToX(d.i, layout, from, count);
            ctx.beginPath();
            ctx.moveTo(x, padTop);
            ctx.lineTo(x, priceBottom);
            ctx.stroke();
          } else if (d.type === "brush" && d.points && d.points.length > 1) {
            ctx.beginPath();
            const p0 = d.points[0];
            ctx.moveTo(barToX(p0.i, layout, from, count), yForPrice(p0.p));
            for (let k = 1; k < d.points.length; k += 1) {
              const p = d.points[k];
              ctx.lineTo(barToX(p.i, layout, from, count), yForPrice(p.p));
            }
            ctx.stroke();
          } else if (d.type === "text") {
            ctx.fillStyle = T.text;
            ctx.font = "12px Inter, Segoe UI, Arial, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(d.text || "Text", barToX(d.i, layout, from, count) + 4, yForPrice(d.p));
          } else if (d.type === "measure") {
            drawSeg(d.i0, d.p0, d.i1, d.p1, [4, 3], false);
            const xm = (barToX(d.i0, layout, from, count) + barToX(d.i1, layout, from, count)) / 2;
            const ym = (yForPrice(d.p0) + yForPrice(d.p1)) / 2;
            const bars = Math.abs(d.i1 - d.i0);
            const pct = Number(d.p0) !== 0 ? ((d.p1 - d.p0) / Math.abs(d.p0)) * 100 : 0;
            ctx.fillStyle = T.textMuted;
            ctx.font = "10px Inter, Segoe UI, Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`${bars.toFixed(1)} bars · ${pct.toFixed(2)}%`, xm, ym - 6);
          } else if (d.type === "channel") {
            const off = d.offset || (maxPrice - minPrice) * 0.04;
            drawSeg(d.i0, d.p0, d.i1, d.p1, [], false);
            drawSeg(d.i0, d.p0 + off, d.i1, d.p1 + off, [3, 3], false);
          } else if (d.type === "fib" && d.i0 != null && d.i1 != null) {
            const lo = Math.min(d.p0, d.p1);
            const hi = Math.max(d.p0, d.p1);
            const diff = hi - lo || 1;
            const levels = [0, 0.382, 0.5, 0.618, 1];
            ctx.setLineDash([3, 3]);
            levels.forEach((lv) => {
              const pr = hi - diff * lv;
              const y = yForPrice(pr);
              ctx.strokeStyle =
                lv === 0 || lv === 1 ? "rgba(209, 212, 220, 0.35)" : "rgba(120, 123, 134, 0.28)";
              ctx.beginPath();
              ctx.moveTo(padLeft, y);
              ctx.lineTo(width - padRight, y);
              ctx.stroke();
            });
            ctx.setLineDash([]);
          }
        }

        if (state.chartDraft) {
          ctx.strokeStyle = T.draft;
          ctx.lineWidth = 1.25;
          const d = state.chartDraft;
          if (d.type === "trendline" || d.type === "ray") drawSeg(d.i0, d.p0, d.i1, d.p1, [5, 4], d.type === "ray");
          else if (d.type === "brush" && d.points && d.points.length) {
            ctx.beginPath();
            ctx.moveTo(barToX(d.points[0].i, layout, from, count), yForPrice(d.points[0].p));
            for (let k = 1; k < d.points.length; k += 1) {
              const p = d.points[k];
              ctx.lineTo(barToX(p.i, layout, from, count), yForPrice(p.p));
            }
            ctx.stroke();
          } else if (d.type === "zoombox") {
            ctx.strokeStyle = T.zoomBox;
            ctx.setLineDash([4, 3]);
            ctx.strokeRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
            ctx.setLineDash([]);
          }
        }

        if (state.chartDraft && state.chartDraft.type === "measure" && state.hoverChart) {
          const hz = hitChartZone(state.hoverChart.x, state.hoverChart.y, layout);
          if (hz === "main") {
            const biM = xToBarIndex(state.hoverChart.x, layout, from, count);
            const prM =
              minPrice +
              ((priceBottom - state.hoverChart.y) / (priceHeight || 1)) * (maxPrice - minPrice);
            ctx.strokeStyle = T.draft;
            ctx.globalAlpha = 0.65;
            drawSeg(state.chartDraft.i0, state.chartDraft.p0, biM, prM, [4, 3], false);
            ctx.globalAlpha = 1;
          }
        }

        const chartBottom = height - layout.padBottom;
        let crosshairMain = null;
        if (state.hoverChart && hitChartZone(state.hoverChart.x, state.hoverChart.y, layout) === "main") {
          crosshairMain = state.hoverChart;
        }

        ctx.fillStyle = T.scaleBg;
        ctx.fillRect(width - padRight, padTop, padRight, chartBottom - padTop);
        ctx.fillRect(0, layout.volumeTop, width - padRight, chartBottom - layout.volumeTop);

        ctx.strokeStyle = T.border;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(width - padRight + 0.5, padTop);
        ctx.lineTo(width - padRight + 0.5, chartBottom);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(padLeft, priceBottom + 0.5);
        ctx.lineTo(width - padRight, priceBottom + 0.5);
        ctx.stroke();

        ctx.font = "11px ui-monospace, Consolas, 'Segoe UI', monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = T.text;
        for (let i = 0; i <= 6; i += 1) {
          const ratio = 1 - i / 6;
          const price = minPrice + (maxPrice - minPrice) * ratio;
          const yy = padTop + (priceHeight / 6) * i;
          ctx.strokeStyle = T.tick;
          ctx.beginPath();
          ctx.moveTo(width - padRight - 6, yy);
          ctx.lineTo(width - padRight, yy);
          ctx.stroke();
          ctx.fillText(formatPriceAxisLabel(price), width - 5, yy);
        }

        ctx.fillStyle = T.textMuted;
        ctx.font = "10px Inter, Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        const timeTicks = buildTimeAxisTicks(from, count, candles.length);
        for (const tick of timeTicks) {
          const bi = tick.bi;
          const x = barToX(bi, layout, from, count);
          const lab = tick.label;
          ctx.strokeStyle = T.tick;
          ctx.beginPath();
          ctx.moveTo(x, chartBottom - 16);
          ctx.lineTo(x, chartBottom - 22);
          ctx.stroke();
          ctx.fillText(lab, x, chartBottom - 8);
        }

        if (crosshairMain) {
          const biC = Math.max(
            0,
            Math.min(candles.length - 1, Math.round(xToBarIndex(crosshairMain.x, layout, from, count)))
          );
          const prC =
            minPrice + ((priceBottom - crosshairMain.y) / (priceHeight || 1)) * (maxPrice - minPrice);
          const chipX = Math.max(padLeft + 48, Math.min(width - padRight - 48, crosshairMain.x));
          drawAxisLabelChip(ctx, formatCrosshairTimeLabel(getBarTimestamp(biC, candles.length)), chipX, chartBottom - 10, "center");
          drawAxisLabelChip(ctx, formatPriceAxisLabel(prC), width - 5, crosshairMain.y, "right");
        }
      }

      async function refreshSelectedCardLiveData({ requestId = null, showLoading = false } = {}) {
        const selectedId = state.selectedWatchlistId;
        if (!selectedId) return;
        const item = getWatchlistItem(selectedId);
        if (!item) return;

        if (USE_FAKE_CHART_DATA) {
          const base = Number(item.last) > 0 ? Number(item.last) : 120;
          state.candles = generateCandlesFromPrice(item.id || selectedId, base);
          state.chartMessage = "";
          applyChartRangePreset(state.activeRangePreset);
          renderWatchlist();
          return;
        }

        try {
          if (showLoading || !state.historyCandlesFull.length) {
            state.chartMessage = "Loading Price History";
            resetChartHistoryState();
            updateChartOverlay();
            drawChart();
            const loaded = await loadMarketHistoryCandles(item);
            if (requestId != null && requestId !== state.activeRequestId) return;
            applyHistoryToChart(loaded.raw, loaded.psa10);
            if (!state.candles.length) {
              throw new Error("No chart data in the selected time range");
            }
          }

          try {
            const live = await fetchLiveCardSnapshot(item);
            if (requestId != null && requestId !== state.activeRequestId) return;
            updateLivePriceOnCandles(Number(live.marketPrice || 0));
            if (live.productUrl) item.priceChartingUrl = live.productUrl;
            if (live.setName && item.cardName) {
              item.card = `${item.cardName} (${live.setName}${item.cardNo ? ` #${item.cardNo}` : ""})`;
              syncChartSymbolHeader();
            }
          } catch (liveErr) {
            if (!state.candles.length) throw liveErr;
          }

          syncSelectedWatchlistMetrics();
          state.chartMessage = "";
          renderWatchlist();
          drawChart();
        } catch (err) {
          if (requestId != null && requestId !== state.activeRequestId) return;
          state.chartMessage = err.message || "PriceCharting chart data unavailable";
          resetChartHistoryState();
          drawChart();
        }
      }

        state.applyChartPriceScaleOnNextDraw = true;

        renderWatchlist();

          state.livePollTimer = setInterval(() => {

            refreshLivePriceOnly();
          }, 30000);
        }

      if (chartResizer && terminalMain) {

          const onMove = (moveEvent) => {

            chartResizer.removeEventListener("pointerup", onUp);
            chartResizer.removeEventListener("pointercancel", onUp);

          chartResizer.addEventListener("pointermove", onMove);
          chartResizer.addEventListener("pointerup", onUp);
          chartResizer.addEventListener("pointercancel", onUp);
        });

      function normalizeLwTime(time) {
        if (time == null) return null;
        if (typeof time === "number" && Number.isFinite(time)) return time;
        if (typeof time === "object" && time.year) {
          return Math.floor(Date.UTC(time.year, time.month - 1, time.day) / 1000);
        }
        return null;
      }

      function candleAtLwTime(time) {
        const tSec = normalizeLwTime(time);
        if (tSec == null) return null;
        return nearestCandleAtLwTime(getDisplayCandles(), tSec);
      }

      function psa10CandleAtLwTime(time) {
        const tSec = normalizeLwTime(time);
        if (tSec == null || !state.showPsa10Overlay || !state.historyCandlesPsa10Full.length) return null;
        return nearestCandleAtLwTime(state.historyCandlesPsa10Full, tSec);
      }

      function nearestCandleAtLwTime(candles, tSec) {
        const arr = Array.isArray(candles) ? candles : [];
        if (!arr.length || tSec == null) return null;
        let best = null;
        let bestD = Infinity;
        for (const c of arr) {
          const d = Math.abs(toLwTimeSec(c) - tSec);
          if (d < bestD) {
            bestD = d;
            best = c;
          }
        }
        return best;
      }

      function selectedChartDisplayName() {
        const item = getWatchlistItem(state.selectedWatchlistId);
        if (!item) return "";
        return String(item.card || item.cardName || "").trim();

        if (!chartSymbolHeader || !chartSymbolTitle) return;

        if (!name) {
          chartSymbolHeader.hidden = true;

          if (chartSymbolStats) chartSymbolStats.hidden = true;

      function updateChartSymbolHover({ high, low, price, psaHigh = null, psaLow = null }) {
        syncChartSymbolHeader();
        if (!chartSymbolStats) return;
        if (!Number.isFinite(high) || !Number.isFinite(low) || !Number.isFinite(price) || price < 0) {
          chartSymbolStats.hidden = true;
          return;
        }
        const showPsa =
          state.showPsa10Overlay &&
          Number.isFinite(psaHigh) &&
          Number.isFinite(psaLow) &&
          psaHigh >= 0 &&
          psaLow >= 0;
        const hiNode = chartSymbolStats.querySelector(".chart-stat-h .chart-stat-v");
        const loNode = chartSymbolStats.querySelector(".chart-stat-l .chart-stat-v");
        const hiPsaWrap = chartSymbolStats.querySelector(".chart-stat-h .chart-stat-psa");
        const loPsaWrap = chartSymbolStats.querySelector(".chart-stat-l .chart-stat-psa");
        const hiPsaNode = chartSymbolStats.querySelector(".chart-stat-h .chart-stat-psa-v");
        const loPsaNode = chartSymbolStats.querySelector(".chart-stat-l .chart-stat-psa-v");
        const hoverNode = chartSymbolStats.querySelector(".chart-stat-hover .chart-stat-v");
        if (hiNode) hiNode.textContent = formatPriceAxisLabel(high);
        if (loNode) loNode.textContent = formatPriceAxisLabel(low);
        if (hiPsaNode) hiPsaNode.textContent = formatPriceAxisLabel(psaHigh);
        if (loPsaNode) loPsaNode.textContent = formatPriceAxisLabel(psaLow);
        if (hiPsaWrap) hiPsaWrap.hidden = !showPsa;
        if (loPsaWrap) loPsaWrap.hidden = !showPsa;
        if (hoverNode) hoverNode.textContent = formatPriceAxisLabel(price);
        chartSymbolStats.hidden = false;
      }

      function inferChartCandleStepMs(candles) {
        const arr = Array.isArray(candles) ? candles : [];
        if (arr.length < 2) return null;
        const sampleCount = Math.min(arr.length - 1, 24);
        const deltas = [];
        for (let i = arr.length - sampleCount; i < arr.length; i += 1) {
          const dt = Number(arr[i].ts) - Number(arr[i - 1].ts);
          if (Number.isFinite(dt) && dt > 0) deltas.push(dt);
        }
        if (!deltas.length) return null;
        deltas.sort((a, b) => a - b);
        return deltas[Math.floor(deltas.length / 2)];
      }

      function isMonthlyChartGranularity(stepMs) {
        const dayMs = 24 * 60 * 60 * 1000;
        return Number.isFinite(stepMs) && stepMs >= 20 * dayMs;
      }

      function formatChartDateLabel(time) {
        const tSec = normalizeLwTime(time);
        if (tSec == null) return "";
        const d = new Date(tSec * 1000);
        const stepMs = inferChartCandleStepMs(getDisplayCandles());
        if (isMonthlyChartGranularity(stepMs)) {
          const month = d.toLocaleDateString(undefined, { month: "short" });
          const year = String(d.getFullYear()).slice(-2);
          return `${month} '${year}`;
        }
        return d.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
          year: "numeric"
        });
      }

      function formatChartHoverDate(time) {
        return formatChartDateLabel(time);
      }

      function hideChartHoverLegend() {
        state.hoverPrice = null;
        if (chartSymbolStats) chartSymbolStats.hidden = true;
        if (chartHoverDate) chartHoverDate.hidden = true;

        if (!chartHoverDate) return;
        const label = formatChartHoverDate(time);
        if (!label) {
          chartHoverDate.hidden = true;
          chartHoverDate.textContent = "";
          return;
        }
        chartHoverDate.textContent = label;
        chartHoverDate.hidden = false;
      }

      function lwCrosshairModeId(enabled) {
        const modes = window.LightweightCharts?.CrosshairMode;
        if (enabled) return modes?.Normal ?? 0;
        return modes?.Hidden ?? 2;
      }

      function syncCursorCrosshairMode() {
        const crosshairOn = state.chartTool === "cursor" && state.cursorCrosshairEnabled;
        if (lwChart && typeof lwChart.applyOptions === "function") {
          try {
            lwChart.applyOptions({ crosshair: { mode: lwCrosshairModeId(crosshairOn) } });
          } catch {
            /* ignore */
          }
        }
        const cursorBtn = document.getElementById("chartCursorBtn");
        if (cursorBtn) {
          cursorBtn.classList.toggle("cursor-crosshair-on", crosshairOn);
          cursorBtn.textContent = crosshairOn ? "✛" : "↖";
          cursorBtn.title = crosshairOn
            ? "Crosshair mode (click for pan cursor)"
            : "Pan cursor (click for crosshair mode)";
        }
        if (chartWrap && state.chartTool === "cursor") {
          chartWrap.style.cursor = crosshairOn ? "crosshair" : "default";
        }
      }

      function bindChartCrosshairHover(chart) {
        if (!chart || lwCrosshairHoverBound) return;

        const processChartHover = (x, y, time) => {
          if (state.chartTool !== "cursor") {
            hideChartHoverLegend();
            return;
          }
          const tSec = normalizeLwTime(time);
          if (tSec == null) {
            hideChartHoverLegend();
            return;
          }
          applyCrosshairAtPoint({ x, y, t: tSec }, time);
          renderChartDrawingsOverlay();
        };

        chart.subscribeCrosshairMove((param) => {
          if (state.chartTool !== "cursor" || !state.cursorCrosshairEnabled) return;
          if (!param?.time || param.point == null) {
            hideChartHoverLegend();
            renderChartDrawingsOverlay();
            return;
          }
          processChartHover(param.point.x, param.point.y, param.time);
        });

        if (chartContainer) {
          chartContainer.addEventListener("mousemove", (ev) => {
            if (state.chartTool !== "cursor" || state.cursorCrosshairEnabled) return;
            const rect = chartContainer.getBoundingClientRect();
            const x = ev.clientX - rect.left;
            const y = ev.clientY - rect.top;
            const t = xToLwTime(x);
            if (t == null) {
              hideChartHoverLegend();
              return;
            }
            processChartHover(x, y, t);
          });
          chartContainer.addEventListener("mouseleave", () => {
            if (state.chartTool === "cursor") hideChartHoverLegend();
          });
        }

        lwCrosshairHoverBound = true;
      }

      function lwTimeToX(tSec) {
        if (!lwChart || tSec == null) return null;
        const coord = lwChart.timeScale().timeToCoordinate(tSec);
        return coord == null ? null : Number(coord);
      }

      function xToLwTime(x) {
        if (!lwChart) return null;
        const direct = normalizeLwTime(lwChart.timeScale().coordinateToTime(x));
        if (direct != null) return direct;
        return nearestTimeForX(x);
      }

      function nearestTimeForX(x) {
        if (!state.candles.length) return null;
        let best = null;
        let bestDist = Infinity;
        for (const c of state.candles) {
          const ts = toLwTimeSec(c);
          const cx = lwTimeToX(ts);
          if (cx == null) continue;
          const d = Math.abs(cx - x);
          if (d < bestDist) {
            bestDist = d;
            best = ts;
          }
        }
        return best;
      }

      function yToLwPriceSafe(y, height) {
        let p = yToLwPrice(y);
        if (p != null) return p;
        if (!lwCandleSeries || !Number.isFinite(height)) return null;
        const clamped = Math.max(0, Math.min(height - 1, y));
        p = yToLwPrice(clamped);
        if (p != null) return p;
        return yToLwPrice(Math.max(0, height * 0.5));
      }

      function chartInteractionRect() {
        const surface = chartContainer || drawCanvas || chartWrap;
        return surface ? surface.getBoundingClientRect() : null;
      }

      function chartPointFromEvent(ev) {
        const rect = chartInteractionRect();
        if (!rect || !lwChart || rect.width < 1 || rect.height < 1) return null;
        const x = ev.clientX - rect.left;
        const y = ev.clientY - rect.top;
        const t = xToLwTime(x);
        const rawP = yToLwPriceSafe(y, rect.height);
        if (t == null || rawP == null) return null;
        return { x, y, t, p: magnetPriceAtTime(t, rawP) };
      }

      function applyCrosshairAtPoint(pt, time) {
        if (!pt) return;
        const tSec = time != null ? normalizeLwTime(time) : pt.t;
        if (tSec == null) return;
        updateChartHoverDate(tSec);
        const rawPrice = yToLwPriceSafe(pt.y, chartInteractionRect()?.height || 0);
        if (!Number.isFinite(rawPrice)) {
          hideChartHoverLegend();
          return;
        }
        const price =
          state.chartMagnet ? magnetPriceAtTime(tSec, rawPrice) : clampChartPrice(rawPrice);
        const fromState = candleAtLwTime(tSec);
        const high = Number(fromState?.high);
        const low = Number(fromState?.low);
        if (price < 0 || !Number.isFinite(high) || !Number.isFinite(low)) {
          state.hoverPrice = null;
          if (chartSymbolStats) chartSymbolStats.hidden = true;
          return;
        }
        const psaState = psa10CandleAtLwTime(tSec);
        const psaHigh = psaState ? Number(psaState.high) : null;
        const psaLow = psaState ? Number(psaState.low) : null;
        state.hoverPrice = { price, y: pt.y, x: pt.x, high, low };
        updateChartSymbolHover({ high, low, price, psaHigh, psaLow });
      }

      function lwPriceToY(price) {
        if (!lwCandleSeries) return null;
        const coord = lwCandleSeries.priceToCoordinate(price);
        return coord == null ? null : Number(coord);
      }

      function yToLwPrice(y) {
        if (!lwCandleSeries) return null;
        const p = lwCandleSeries.coordinateToPrice(y);
        return p == null ? null : Number(p);
      }

      function drawingTimeFromLegacy(d, keyI, keyT) {
        if (Number.isFinite(d[keyT])) return d[keyT];
        if (Number.isFinite(d[keyI]) && state.candles.length) {
          const idx = Math.max(0, Math.min(state.candles.length - 1, Math.round(d[keyI])));
          return toLwTimeSec(state.candles[idx]);
        }
        return null;
      }

      function magnetPriceAtTime(tSec, price) {
        if (!state.chartMagnet || !state.candles.length) return clampChartPrice(price);
        let best = null;
        let bestD = Infinity;
        for (const c of state.candles) {
          const ts = toLwTimeSec(c);
          const d = Math.abs(ts - tSec);
          if (d < bestD) {
            bestD = d;
            best = c;
          }
        }
        if (!best) return clampChartPrice(price);
        const snaps = [best.open, best.high, best.low, best.close];
        let nearest = price;
        let nearestD = Infinity;
        for (const s of snaps) {
          const n = Number(s);
          if (!Number.isFinite(n)) continue;
          const dd = Math.abs(n - price);
          if (dd < nearestD) {
            nearestD = dd;
            nearest = n;
          }
        }
        return clampChartPrice(nearest);
      }

      function setChartTool(tool) {
        state.chartTool = tool || "cursor";
        state.chartDraft = null;
        state.axisDrag = null;
        hideChartHoverLegend();
        updateChartToolUi();
        syncCursorCrosshairMode();
        renderChartDrawingsOverlay();
      }

      function toggleCursorCrosshairMode() {
        state.cursorCrosshairEnabled = !state.cursorCrosshairEnabled;
        hideChartHoverLegend();
        syncCursorCrosshairMode();
        updateChartToolUi();
        renderChartDrawingsOverlay();
      }

      function updateChartToolUi() {
        document.querySelectorAll("[data-chart-tool]").forEach((btn) => {
          const tool = btn.getAttribute("data-chart-tool");
          btn.classList.toggle("active", tool === state.chartTool);
        });
        const magnetBtn = document.getElementById("chartMagnetBtn");
        if (magnetBtn) magnetBtn.classList.toggle("magnet-on", Boolean(state.chartMagnet));
        const drawMode = state.chartTool !== "cursor";
        if (drawCanvas) {
          drawCanvas.style.pointerEvents = drawMode ? "auto" : "none";
        }
        if (chartContainer) {
          chartContainer.style.pointerEvents = drawMode ? "none" : "auto";
        }
        if (chartWrap) {
          if (drawMode) chartWrap.style.cursor = "crosshair";
          else if (state.cursorCrosshairEnabled) chartWrap.style.cursor = "crosshair";
          else chartWrap.style.cursor = "default";
        }
        syncCursorCrosshairMode();
      }

      function drawOverlaySegment(ctx, t0, p0, t1, p1, dash, extendRay, width) {
        let x0 = lwTimeToX(t0);
        let y0 = lwPriceToY(p0);
        let x1 = lwTimeToX(t1);
        let y1 = lwPriceToY(p1);
        if (x0 == null || y0 == null || x1 == null || y1 == null) return;
        const dx = x1 - x0;
        const dy = y1 - y0;
        if (extendRay && (Math.abs(dx) > 1e-6 || Math.abs(dy) > 1e-6)) {
          const big = 4000;
          if (Math.abs(dx) > 1e-6) {
            const tR = (width - x0) / dx;
            const tL = (0 - x0) / dx;
            const tMax = Math.max(tR, tL, 0) + big / Math.abs(dx);
            const tMin = Math.min(tR, tL, 0) - big / Math.abs(dx);
            x1 = x0 + tMax * dx;
            y1 = y0 + tMax * dy;
            x0 = x0 + tMin * dx;
            y0 = y0 + tMin * dy;
          }
        }
        ctx.beginPath();
        ctx.setLineDash(dash || []);
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function renderChartDrawingsOverlay() {
        if (!drawCanvas) return;
        const rect = drawCanvas.getBoundingClientRect();
        const width = Math.max(1, Math.floor(rect.width));
        const height = Math.max(1, Math.floor(rect.height));
        const dpr = window.devicePixelRatio || 1;
        drawCanvas.width = Math.floor(width * dpr);
        drawCanvas.height = Math.floor(height * dpr);
        const ctx = drawCanvas.getContext("2d");
        if (!ctx) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        if (!lwChart || !lwCandleSeries || !state.candles.length) return;

        const T = CHART_THEME;
        ctx.lineWidth = 1.25;
        const drawings = activeDrawingList();
        for (const d of drawings) {
          ctx.strokeStyle = T.drawing;
          ctx.fillStyle = T.text;
          if (d.type === "trendline") {
            const t0 = drawingTimeFromLegacy(d, "i0", "t0");
            const t1 = drawingTimeFromLegacy(d, "i1", "t1");
            if (t0 != null && t1 != null) drawOverlaySegment(ctx, t0, d.p0, t1, d.p1, [], false, width);
          } else if (d.type === "ray") {
            const t0 = drawingTimeFromLegacy(d, "i0", "t0");
            const t1 = drawingTimeFromLegacy(d, "i1", "t1");
            if (t0 != null && t1 != null) drawOverlaySegment(ctx, t0, d.p0, t1, d.p1, [], true, width);
          } else if (d.type === "hline") {
            const y = lwPriceToY(d.price);
            if (y == null) continue;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          } else if (d.type === "vline") {
            const t = drawingTimeFromLegacy(d, "i", "t");
            const x = t != null ? lwTimeToX(t) : null;
            if (x == null) continue;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          } else if (d.type === "brush" && Array.isArray(d.points) && d.points.length > 1) {
            ctx.beginPath();
            d.points.forEach((pt, idx) => {
              const t = drawingTimeFromLegacy(pt, "i", "t");
              const x = t != null ? lwTimeToX(t) : null;
              const y = lwPriceToY(pt.p);
              if (x == null || y == null) return;
              if (idx === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();
          } else if (d.type === "text") {
            const t = drawingTimeFromLegacy(d, "i", "t");
            const x = t != null ? lwTimeToX(t) : null;
            const y = lwPriceToY(d.p);
            if (x == null || y == null) continue;
            ctx.font = "12px Inter, Segoe UI, Arial, sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(d.text || "Text", x + 4, y);
          } else if (d.type === "measure") {
            const t0 = drawingTimeFromLegacy(d, "i0", "t0");
            const t1 = drawingTimeFromLegacy(d, "i1", "t1");
            if (t0 == null || t1 == null) continue;
            drawOverlaySegment(ctx, t0, d.p0, t1, d.p1, [4, 3], false, width);
            const x0 = lwTimeToX(t0);
            const x1 = lwTimeToX(t1);
            const y0 = lwPriceToY(d.p0);
            const y1 = lwPriceToY(d.p1);
            if (x0 == null || x1 == null || y0 == null || y1 == null) continue;
            const days = Math.abs(t1 - t0) / 86400;
            const pct = Number(d.p0) !== 0 ? ((d.p1 - d.p0) / Math.abs(d.p0)) * 100 : 0;
            ctx.fillStyle = T.textMuted;
            ctx.font = "10px Inter, Segoe UI, Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`${days.toFixed(1)}d · ${pct.toFixed(2)}%`, (x0 + x1) / 2, (y0 + y1) / 2 - 6);
          } else if (d.type === "channel") {
            const t0 = drawingTimeFromLegacy(d, "i0", "t0");
            const t1 = drawingTimeFromLegacy(d, "i1", "t1");
            const off = Number(d.offset) || 0;
            if (t0 == null || t1 == null) continue;
            drawOverlaySegment(ctx, t0, d.p0, t1, d.p1, [], false, width);
            drawOverlaySegment(ctx, t0, d.p0 + off, t1, d.p1 + off, [3, 3], false, width);
          } else if (d.type === "fib") {
            const t0 = drawingTimeFromLegacy(d, "i0", "t0");
            const t1 = drawingTimeFromLegacy(d, "i1", "t1");
            if (t0 == null || t1 == null) continue;
            const lo = Math.min(d.p0, d.p1);
            const hi = Math.max(d.p0, d.p1);
            const diff = hi - lo || 1;
            const levels = [0, 0.382, 0.5, 0.618, 1];
            ctx.setLineDash([3, 3]);
            levels.forEach((lv) => {
              const pr = hi - diff * lv;
              const y = lwPriceToY(pr);
              if (y == null) return;
              ctx.strokeStyle = lv === 0 || lv === 1 ? "rgba(209, 212, 220, 0.35)" : "rgba(120, 123, 134, 0.28)";
              ctx.beginPath();
              ctx.moveTo(0, y);
              ctx.lineTo(width, y);
              ctx.stroke();
            });
            ctx.setLineDash([]);
          }
        }

        if (state.chartDraft) {
          ctx.strokeStyle = T.draft;
          const d = state.chartDraft;
          if (d.type === "trendline" || d.type === "ray") {
            drawOverlaySegment(ctx, d.t0, d.p0, d.t1, d.p1, [5, 4], d.type === "ray", width);
          } else if (d.type === "brush" && d.points && d.points.length) {
            ctx.beginPath();
            d.points.forEach((pt, idx) => {
              const x = lwTimeToX(pt.t);
              const y = lwPriceToY(pt.p);
              if (x == null || y == null) return;
              if (idx === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();
          } else if (d.type === "zoombox") {
            ctx.strokeStyle = T.zoomBox;
            ctx.setLineDash([4, 3]);
            ctx.strokeRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
            ctx.setLineDash([]);
          } else if (d.type === "measure" && state.hoverDrawPoint) {
            ctx.globalAlpha = 0.65;
            drawOverlaySegment(ctx, d.t0, d.p0, state.hoverDrawPoint.t, state.hoverDrawPoint.p, [4, 3], false, width);
            ctx.globalAlpha = 1;
          }
        }
      }

      function initChartDrawingLayer() {
        document.querySelectorAll("[data-chart-tool]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const tool = btn.getAttribute("data-chart-tool") || "cursor";
            if (tool === "cursor" && state.chartTool === "cursor") {
              toggleCursorCrosshairMode();
              return;
            }
            setChartTool(tool);
          });
        });
        const magnetBtn = document.getElementById("chartMagnetBtn");
        if (magnetBtn) {
          magnetBtn.addEventListener("click", () => {
            state.chartMagnet = !state.chartMagnet;
            updateChartToolUi();
          });
        }
        const undoBtn = document.getElementById("chartUndoBtn");
        if (undoBtn) {
          undoBtn.addEventListener("click", () => {
            const list = activeDrawingList();
            if (list.length) list.pop();
            renderChartDrawingsOverlay();
          });
        }
        const clearBtn = document.getElementById("chartClearBtn");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            const list = activeDrawingList();
            list.length = 0;
            state.chartDraft = null;
            renderChartDrawingsOverlay();
          });
        }
        if (!drawCanvas) return;

        drawCanvas.addEventListener("pointermove", (ev) => {
          const pt = chartPointFromEvent(ev);
          if (pt) state.hoverDrawPoint = pt;
          if (state.axisDrag && state.axisDrag.kind === "draw" && state.chartDraft && pt) {
            const d = state.chartDraft;
            if (d.type === "brush" && d.points) {
              const last = d.points[d.points.length - 1];
              if (!last || Math.hypot(pt.t - last.t, pt.p - last.p) > 0.001) {
                d.points.push({ t: pt.t, p: pt.p });
              }
            } else if (d.type === "zoombox") {
              d.x1 = pt.x;
              d.y1 = pt.y;
            } else if (d.type === "trendline" || d.type === "ray") {
              d.t1 = pt.t;
              d.p1 = pt.p;
            }
          }
          renderChartDrawingsOverlay();
        });

        drawCanvas.addEventListener("pointerleave", () => {
          state.hoverDrawPoint = null;
          hideChartHoverLegend();
          renderChartDrawingsOverlay();
        });

        drawCanvas.addEventListener("pointerdown", (ev) => {
          if (state.chartTool === "cursor") return;
          ev.preventDefault();
          ev.stopPropagation();
          if (!state.candles.length) return;
          const pt = chartPointFromEvent(ev);
          if (!pt) return;
          const tool = state.chartTool;

          if (tool === "hline") {
            activeDrawingList().push({ type: "hline", price: pt.p });
            renderChartDrawingsOverlay();
            return;
          }
          if (tool === "vline") {
            activeDrawingList().push({ type: "vline", t: pt.t });
            renderChartDrawingsOverlay();
            return;
          }
          if (tool === "text") {
            const t = window.prompt("Label", "Note");
            if (t) activeDrawingList().push({ type: "text", t: pt.t, p: pt.p, text: t });
            renderChartDrawingsOverlay();
            return;
          }
          if (tool === "measure") {
            const d = state.chartDraft;
            if (!d || d.type !== "measure") {
              state.chartDraft = { type: "measure", t0: pt.t, p0: pt.p };
            } else {
              activeDrawingList().push({ type: "measure", t0: d.t0, p0: d.p0, t1: pt.t, p1: pt.p });
              state.chartDraft = null;
            }
            renderChartDrawingsOverlay();
            return;
          }
          if (tool === "trendline" || tool === "ray" || tool === "channel" || tool === "fib") {
            state.axisDrag = { kind: "draw", drawTool: tool };
            state.chartDraft = {
              type: tool === "ray" ? "ray" : "trendline",
              t0: pt.t,
              p0: pt.p,
              t1: pt.t,
              p1: pt.p
            };
            drawCanvas.setPointerCapture(ev.pointerId);
            renderChartDrawingsOverlay();
            return;
          }
          if (tool === "brush") {
            state.axisDrag = { kind: "draw", drawTool: "brush" };
            state.chartDraft = { type: "brush", points: [{ t: pt.t, p: pt.p }] };
            drawCanvas.setPointerCapture(ev.pointerId);
            renderChartDrawingsOverlay();
            return;
          }
          if (tool === "zoom") {
            state.axisDrag = { kind: "draw", drawTool: "zoom" };
            state.chartDraft = { type: "zoombox", x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y };
            drawCanvas.setPointerCapture(ev.pointerId);
            renderChartDrawingsOverlay();
          }
        });

        const finishDraw = (ev) => {
          if (!state.axisDrag || state.axisDrag.kind !== "draw") return;
          const d = state.chartDraft;
          const dt = state.axisDrag.drawTool;
          const list = activeDrawingList();
          if (d && (d.type === "trendline" || d.type === "ray")) {
            if (dt === "fib") list.push({ type: "fib", t0: d.t0, p0: d.p0, t1: d.t1, p1: d.p1 });
            else if (dt === "channel") {
              const span = Math.abs(d.p1 - d.p0) * 0.35 || 1;
              list.push({ type: "channel", t0: d.t0, p0: d.p0, t1: d.t1, p1: d.p1, offset: span });
            } else if (dt === "ray") list.push({ type: "ray", t0: d.t0, p0: d.p0, t1: d.t1, p1: d.p1 });
            else list.push({ type: "trendline", t0: d.t0, p0: d.p0, t1: d.t1, p1: d.p1 });
          } else if (d && d.type === "brush" && d.points && d.points.length > 1) {
            list.push({ type: "brush", points: d.points.slice() });
          } else if (d && d.type === "zoombox" && lwChart) {
            const x0 = Math.min(d.x0, d.x1);
            const x1 = Math.max(d.x0, d.x1);
            if (x1 - x0 > 12) {
              const tA = xToLwTime(x0);
              const tB = xToLwTime(x1);
              if (tA != null && tB != null) {
                lwChart.timeScale().setVisibleRange({ from: Math.min(tA, tB), to: Math.max(tA, tB) });
              }
            }
          }
          state.chartDraft = null;
          state.axisDrag = null;
          try {
            drawCanvas.releasePointerCapture(ev.pointerId);
          } catch {
            /* ignore */
          }
          renderChartDrawingsOverlay();
        };

        drawCanvas.addEventListener("pointerup", finishDraw);
        drawCanvas.addEventListener("pointercancel", finishDraw);
        updateChartToolUi();
      }

      function getDisplayCandles() {
        if (state.historyCandlesFull.length) return state.historyCandlesFull;
        if (state.candles.length) return state.candles;
        if (!USE_FAKE_CHART_DATA) return [];
        if (!state.placeholderCandles || !state.placeholderCandles.length) {
          state.placeholderCandles = generateCandlesFromPrice("__placeholder__", 120, { count: 280 });
        }
        return state.placeholderCandles;
      }

      function ensureLightweightChart() {
        if (!chartContainer || !window.LightweightCharts) return null;
        if (lwChart) return lwChart;

        lwChart = window.LightweightCharts.createChart(chartContainer, {
          width: chartContainer.clientWidth || 300,
          height: chartContainer.clientHeight || 300,
          layout: {
            background: { color: "#131722" },
            textColor: "#d1d4dc",
            fontSize: 11,
            attributionLogo: false
          },
          grid: {
            vertLines: { color: "rgba(42, 46, 57, 0.55)" },
            horzLines: { color: "rgba(42, 46, 57, 0.55)" }
          },
          rightPriceScale: {
            borderColor: "#2a2e39",
            scaleMargins: { top: 0.08, bottom: 0 }
          },
          timeScale: {
            borderColor: "#2a2e39",
            timeVisible: true,
            secondsVisible: false
          },
          crosshair: {
            mode: 2
          },
          localization: {
            priceFormatter: (price) => formatPriceAxisLabel(Number(price)),
            timeFormatter: (time) => formatChartDateLabel(time)
          }
        });

        const candleOpts = {
          upColor: "#089981",
          downColor: "#f23645",
          borderUpColor: "#089981",
          borderDownColor: "#f23645",
          wickUpColor: "#089981",
          wickDownColor: "#f23645",
          priceLineVisible: false,
          autoscaleInfoProvider: lwCandleAutoscaleInfoProvider
        };

        // v4/v5 compatibility for Lightweight Charts series API.
        if (typeof lwChart.addCandlestickSeries === "function") {
          lwCandleSeries = lwChart.addCandlestickSeries(candleOpts);
        } else if (typeof lwChart.addSeries === "function" && window.LightweightCharts.CandlestickSeries) {
          lwCandleSeries = lwChart.addSeries(window.LightweightCharts.CandlestickSeries, candleOpts);
        } else {
          return null;
        }

        try {
          lwChart.priceScale("right").applyOptions({
            scaleMargins: { top: 0.08, bottom: 0 },
            autoScale: true
          });
        } catch {
          /* ignore */
        }

        lwVolumeSeries = null;

        bindPriceScaleRedraw(lwChart);
        bindChartCrosshairHover(lwChart);

        if (!lwDrawingRedrawBound) {
          try {
            lwChart.timeScale().subscribeVisibleTimeRangeChange(() => {
              renderChartDrawingsOverlay();
            });
            lwDrawingRedrawBound = true;
          } catch {
            /* ignore */
          }
        }

        if (typeof ResizeObserver !== "undefined") {
          lwResizeObserver = new ResizeObserver(() => {
            if (!lwChart || !chartContainer) return;
            lwChart.applyOptions({
              width: chartContainer.clientWidth || 300,
              height: chartContainer.clientHeight || 300
            });
          });
          lwResizeObserver.observe(chartContainer);
        }
        syncCursorCrosshairMode();
        return lwChart;
      }

      function lwCandleAutoscaleInfoProvider(original) {
        const info = typeof original === "function" ? original() : null;
        const rawMin = Number(info?.priceRange?.minValue);
        const rawMax = Number(info?.priceRange?.maxValue);
        const minValue = Math.max(0, Number.isFinite(rawMin) ? rawMin : 0);
        const maxValue = Math.max(minValue + 1e-6, Number.isFinite(rawMax) ? rawMax : minValue + 1);
        return {
          priceRange: { minValue, maxValue },
          margins: info?.margins
        };
      }

      function destroyPsa10CandleSeries(chart) {
        if (!lwPsa10CandleSeries || !chart) return;
        try {
          chart.removeSeries(lwPsa10CandleSeries);
        } catch {
          /* ignore */
        }
        lwPsa10CandleSeries = null;
      }

      function hidePsa10CandleSeries() {
        if (!lwPsa10CandleSeries) return false;
        try {
          lwPsa10CandleSeries.applyOptions({ visible: false });
        } catch {
          /* ignore */
        }
        return true;
      }

      function ensurePsa10CandleSeries(chart) {
        if (lwPsa10CandleSeries) return lwPsa10CandleSeries;
        if (!chart) return null;
        const psa10Opts = {
          upColor: "rgba(8, 153, 129, 0.5)",
          downColor: "rgba(242, 54, 69, 0.5)",
          borderUpColor: "#42a5f5",
          borderDownColor: "#42a5f5",
          wickUpColor: "#42a5f5",
          wickDownColor: "#42a5f5",
          priceLineVisible: false,
          autoscaleInfoProvider: lwCandleAutoscaleInfoProvider
        };
        if (typeof chart.addCandlestickSeries === "function") {
          lwPsa10CandleSeries = chart.addCandlestickSeries(psa10Opts);
        } else if (typeof chart.addSeries === "function" && window.LightweightCharts.CandlestickSeries) {
          lwPsa10CandleSeries = chart.addSeries(window.LightweightCharts.CandlestickSeries, psa10Opts);
        }
        return lwPsa10CandleSeries;
      }

      function syncPsa10Overlay(chart) {
        if (!chart) return;
        const shouldShow = state.showPsa10Overlay && state.historyCandlesPsa10Full.length > 0;
        if (!shouldShow) {
          hidePsa10CandleSeries();
          return;
        }
        const psa10Series = ensurePsa10CandleSeries(chart);
        if (!psa10Series) return;
        const psa10Data = candlesToLwData(state.historyCandlesPsa10Full);
        psa10Series.applyOptions({ visible: true });
        psa10Series.setData(psa10Data);
      }

      function refreshChartSeriesData(chart, candleData) {
        if (!chart || !lwCandleSeries) return;
        lwCandleSeries.setData(candleData);
        syncPsa10Overlay(chart);
      }

      function candlesToLwData(bars) {
        return bars.map((c) => ({
          time: toLwTimeSec(c),
          open: clampChartPrice(c.open),
          high: clampChartPrice(c.high),
          low: clampChartPrice(c.low),
          close: clampChartPrice(c.close)
        }));
      }

      function syncLightweightChartSize() {
        if (!lwChart || !chartContainer) return;
        const width = Math.max(300, chartContainer.clientWidth || 300);
        const height = Math.max(280, chartContainer.clientHeight || 280);
        if (typeof lwChart.resize === "function") {
          lwChart.resize(width, height);
        } else {
          lwChart.applyOptions({ width, height });
        }
      }

      function toLwTimeSec(c) {
        const ts = Number(c?.ts);
        return Math.floor((Number.isFinite(ts) ? ts : Date.now()) / 1000);
      }

      function rangeStartEpochSec(key, endSec) {
        if (key === "1D") return endSec - 24 * 60 * 60;
        if (key === "1W") return endSec - 7 * 24 * 60 * 60;
        if (key === "1M") return endSec - 30 * 24 * 60 * 60;
        if (key === "3M") return endSec - 90 * 24 * 60 * 60;
        if (key === "6M") return endSec - 180 * 24 * 60 * 60;
        if (key === "YTD") return Math.floor(Date.UTC(2026, 0, 1) / 1000);
        if (key === "1Y") return endSec - 365 * 24 * 60 * 60;
        return endSec - 24 * 60 * 60;
      }

      function presetStartMs(key, endMs) {
        if (key === "ALL") return 0;
        if (key === "1D") return endMs - 24 * 60 * 60 * 1000;
        if (key === "1W") return endMs - 7 * 24 * 60 * 60 * 1000;
        if (key === "1M") return endMs - 30 * 24 * 60 * 60 * 1000;
        if (key === "3M") return endMs - 90 * 24 * 60 * 60 * 1000;
        if (key === "6M") return endMs - 180 * 24 * 60 * 60 * 1000;
        if (key === "YTD") return Date.UTC(2026, 0, 1);
        if (key === "1Y") return endMs - 365 * 24 * 60 * 60 * 1000;
        return endMs - 24 * 60 * 60 * 1000;
      }

      function rebuildCandlesForPreset(key) {
        const hasLive = state.candles.length > 0;
        const endMsRaw = hasLive ? Number(state.candles[state.candles.length - 1]?.ts) : Date.now();
        const endMs = Number.isFinite(endMsRaw) ? endMsRaw : Date.now();
        let startMs = presetStartMs(key, endMs);
        if (!Number.isFinite(startMs) || startMs >= endMs) startMs = endMs - 24 * 60 * 60 * 1000;
        const spanMs = Math.max(1, endMs - startMs);
        const count = key === "YTD" || key === "1Y" ? 320 : 240;
        const stepMs = Math.max(60 * 1000, Math.floor(spanMs / Math.max(1, count - 1)));
        const basePrice = hasLive
          ? Number(state.candles[state.candles.length - 1]?.close) || 120
          : 120;
        const seed = hasLive ? (state.selectedWatchlistId || "live") : "__placeholder__";
        const built = generateCandlesFromPrice(seed, basePrice, { count, stepMs, startTs: startMs });
        if (hasLive) state.candles = built;
        else state.placeholderCandles = built;
      }

      function applyChartRangePreset(key) {
        state.activeRangePreset = key;
        if (state.historyCandlesFull.length) {
          state.candles = state.historyCandlesFull.slice();
        } else if (USE_FAKE_CHART_DATA) {
          rebuildCandlesForPreset(key);
        }
        syncSelectedWatchlistMetrics();
        updateRangeTabButtons();
        state.applyChartViewportOnNextDraw = true;
        drawChart();
        renderWatchlist();
      }

      function bindPriceScaleRedraw(chart) {
        if (!chart || lwPriceScaleRedrawBound || typeof chart.priceScale !== "function") return;
        let priceScale;
        try {
          priceScale = chart.priceScale("right");
        } catch {
          return;
        }
        if (priceScale && typeof priceScale.subscribeVisiblePriceRangeChange === "function") {
          priceScale.subscribeVisiblePriceRangeChange(() => {
            renderChartDrawingsOverlay();
          });
        }
        lwPriceScaleRedrawBound = true;
      }

      function applyChartTimeScaleForPreset(chart, key, candles) {
        if (!chart || typeof chart.timeScale !== "function") return;
        const bars = Array.isArray(candles) ? candles : [];
        if (!bars.length) return;

        const timeScale = chart.timeScale();

        if (key === "ALL") {
          if (typeof timeScale.fitContent === "function") timeScale.fitContent();
          return;
        }

        const inWindow = filterCandlesByPreset(bars, key);
        const count = Math.max(1, inWindow.length);
        const chartWidth = chartContainer?.clientWidth || 300;
        const plotWidth = Math.max(100, chartWidth - 90);
        const barSpacing = Math.min(56, Math.max(8, Math.floor(plotWidth / count) - 1));
        try {
          timeScale.applyOptions({
            barSpacing,
            minBarSpacing: 4,
            rightOffset: 6
          });
        } catch {
          /* ignore */
        }

        const { startMs, endMs } = presetRangeBoundsMs(key, bars);
        const fromSec = Math.floor(startMs / 1000);
        const toSec = Math.floor(endMs / 1000);
        if (typeof timeScale.setVisibleRange === "function") {
          try {
            timeScale.setVisibleRange({ from: fromSec, to: toSec });
          } catch {
            if (typeof timeScale.fitContent === "function") timeScale.fitContent();
          }
        } else if (typeof timeScale.fitContent === "function") {
          timeScale.fitContent();
        }
      }

      function resetLightweightPriceScale(chart) {
        if (!chart || typeof chart.priceScale !== "function") return;
        try {
          const priceScale = chart.priceScale("right");
          if (!priceScale) return;
          if (typeof priceScale.setAutoScale === "function") {
            priceScale.setAutoScale(true);
          } else if (typeof priceScale.applyOptions === "function") {
            priceScale.applyOptions({
              autoScale: true,
              scaleMargins: { top: 0.08, bottom: 0 }
            });
          }
        } catch {
          /* ignore */
        }
      }

      function drawChart() {
        const chart = ensureLightweightChart();
        if (!chart || !lwCandleSeries) return;
        syncLightweightChartSize();

        const bars = getDisplayCandles();
        if (!bars.length) {
          lwCandleSeries.setData([]);
          destroyPsa10CandleSeries(chart);
          hideChartHoverLegend();
          syncChartSymbolHeader();
          updateChartOverlay();
          renderChartDrawingsOverlay();
          return;
        }

        const candleData = candlesToLwData(bars);
        const needsScaleReset = state.applyChartPriceScaleOnNextDraw;

        if (needsScaleReset) {
          resetLightweightPriceScale(chart);
        }

        refreshChartSeriesData(chart, candleData);

        if (needsScaleReset) {
          resetLightweightPriceScale(chart);
          refreshChartSeriesData(chart, candleData);
          state.applyChartPriceScaleOnNextDraw = false;
        }

        if (state.applyChartViewportOnNextDraw) {
          applyChartTimeScaleForPreset(chart, state.activeRangePreset, bars);
          state.applyChartViewportOnNextDraw = false;
        }
        updateChartOverlay();
        renderChartDrawingsOverlay();
      }

      if (resetLayoutBtn) {
        resetLayoutBtn.addEventListener("click", () => {
          state.watchlistWidth = 320;
          resetChartView();
          applyPanelWidths();
          updateResetButtonVisibility();
          drawChart();
        });
      }
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeWatchlistModal();
          state.chartDraft = null;
          state.axisDrag = null;
          setChartTool("cursor");
        }
      });

      window.addEventListener("resize", () => {
        applyPanelWidths();
        drawChart();
      });
      applyPanelWidths();
      updateResetButtonVisibility();
      document.querySelectorAll(".chart-range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const r = btn.getAttribute("data-range");
          if (r) applyChartRangePreset(r);
        });
      });
      updateRangeTabButtons();
      updatePsa10ToggleUi();
      renderWatchlist();
      initChartDrawingLayer();
      syncChartSymbolHeader();
      applyChartRangePreset(state.activeRangePreset);
      startFooterLocalClock();
      window.__pokeViewBootWatchlistAuth = bootWatchlistAuthSync;
      window.addEventListener("beforeunload", flushWatchlistOnUnload);
    })();
  </script>
  <script src="/account-ui.js?v=4"></script>
  <script>
    queueMicrotask(() => {
      window.__pokeViewBootWatchlistAuth?.();
    });
  </script>
</body>
