<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinity Cards Sets</title>
  <link rel="preload" href="/api/pokesymbols/manifest" as="fetch" crossorigin="anonymous" />
  <link rel="preload" href="/api/sets/images" as="fetch" crossorigin="anonymous" />
  <link rel="preload" href="/api/sets/card-sky-urls?limit=500&localOnly=1" as="fetch" crossorigin="anonymous" />
  <link rel="stylesheet" href="/card-sky.css?v=8" />
  <link rel="stylesheet" href="/brand-logo.css" />
  <script src="/card-sky.js?v=8" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f18;
      --panel: #101825;
      --panel-2: #151f2f;
      --border: #26364f;
      --text: #e9f1ff;
      --muted: #93a8c7;
      --accent: #ff4d5f;
      --chip-active: #20324c;
      --glow-warm: rgba(255, 200, 80, 0.14);
      --glow-cool: rgba(60, 150, 255, 0.16);
      --nav-bg: rgba(10, 15, 24, 0.92);
      --input-bg: #0e1623;
      --toggle-inactive-bg: #111b2a;
      --era-btn-bg: #101a2a;
      --era-btn-active-bg: #1d2a3f;
      --card-surface: #0f1726;
      --thumb-bg: #0c1421;
      --placeholder-grad-1: #16243a;
      --placeholder-grad-2: #0f1726;
      --set-symbol-border: #35517a;
      --set-symbol-bg: #13233a;
      --set-symbol-text: #d7e6ff;
      --set-banner-border: #22334a;
      --set-banner-grad: linear-gradient(180deg, rgba(25, 39, 60, 0.9), rgba(11, 18, 30, 0.95));
      --stat-label: #8ea4c5;
      --stat-value: #e8f1ff;
      --stat-accent: #36d18d;
      --filter-border: #2b3d55;
      --filter-input-bg: #0d1727;
      --placeholder-text: #7087a7;
      --filter-tab-bg: #18283f;
      --filter-tab-text: #c7d7ef;
      --mini-btn-bg: #152339;
      --mini-btn-text: #d9e6fa;
      --btn-bg: #121d2d;
      --detail-select-bg: #0e1623;
      --media-well: #0b1320;
      --image-frame-border: #30435e;
      --zoom-overlay: rgba(6, 10, 16, 0.86);
      --card-page-panel-grad: linear-gradient(180deg, #101a2a, #0d1624);
      --meta-chip-bg: #111b2a;
      --meta-chip-label: #c9daf5;
      --set-stat-rule: rgba(147, 168, 199, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .top-nav {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: var(--nav-bg);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 4;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-link {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .nav-link.active,
    .nav-link:hover {
      color: var(--text);
    }

    .nav-search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search {
      width: 240px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      padding: 0 10px;
      font-size: 13px;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 18px auto;
      padding: 0 14px 28px;
      display: grid;
      gap: 14px;
    }

    .page.focused .toolbar {
      display: none;
    }

    .heading-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
      padding: 14px;
    }

    .title {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.2px;
    }

    .sub {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar.focused .toggle {
      display: none;
    }

    .toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .toggle button {
      border: 0;
      background: var(--toggle-inactive-bg);
      color: var(--muted);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
    }

    .toggle button.active {
      background: var(--chip-active);
      color: var(--text);
    }

    .filter-search {
      width: 260px;
      min-width: 180px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      padding: 0 10px;
      font-size: 13px;
    }

    .toolbar-search-cluster {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search-controls-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-controls-left[hidden] {
      display: none !important;
    }

    .catalog-number-sort-btn {
      height: 34px;
      padding: 0 12px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid var(--filter-border);
      background: var(--filter-tab-bg);
      color: var(--filter-tab-text);
      cursor: pointer;
      white-space: nowrap;
    }

    .catalog-number-sort-btn:hover {
      color: var(--text);
    }

    .catalog-artist-select {
      height: 34px;
      min-width: 140px;
      max-width: 220px;
      padding: 0 8px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid var(--filter-border);
      background: var(--filter-input-bg);
      color: var(--text);
    }

    .global-artist-select {
      max-width: 280px;
    }

    .set-filter-tabs--set-toolbar {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      max-width: 100%;
    }

    .set-filter-artist-select {
      height: 36px;
      min-width: 100px;
      max-width: 200px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9px;
      border: 1px solid var(--filter-border);
      background: var(--filter-input-bg);
      color: var(--text);
      cursor: pointer;
    }

    .set-filter-artist-select:focus {
      outline: none;
      border-color: var(--border);
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 14px;
      align-items: start;
    }

    .layout.focused {
      grid-template-columns: 1fr;
    }

    .layout.focused .sidebar {
      display: none;
    }

    .sidebar {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
      padding: 12px;
      position: sticky;
      top: 72px;
    }

    .sidebar h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .era-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 7px;
    }

    .era-list button {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--era-btn-bg);
      color: var(--muted);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .era-list button.active {
      color: var(--text);
      background: var(--era-btn-active-bg);
    }

    .content {
      display: grid;
      gap: 12px;
    }

    .era-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
      padding: 12px;
    }

    .era-title {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .sets-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .set-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-surface);
      padding: 10px;
      min-height: 150px;
      display: grid;
      align-content: start;
      gap: 4px;
      text-decoration: none;
    }

    .set-image {
      width: 100%;
      height: 82px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--thumb-bg);
      object-fit: contain;
      object-position: center;
      padding: 4px;
      display: block;
      margin-bottom: 6px;
    }

    .set-image.placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      background: linear-gradient(135deg, var(--placeholder-grad-1), var(--placeholder-grad-2));
    }

    .set-name {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    .set-meta {
      color: var(--muted);
      font-size: 11px;
    }

    .set-symbol-row {
      margin-top: 2px;
      min-height: 22px;
      display: flex;
      align-items: center;
    }

    .set-symbol-image {
      width: 24px;
      height: 24px;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }

    .set-symbol-badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--set-symbol-border);
      background: var(--set-symbol-bg);
      color: var(--set-symbol-text);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 10px;
      letter-spacing: 0.35px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .set-detail {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
      padding: 12px;
      display: grid;
      gap: 12px;
    }

    .set-banner {
      border: 1px solid var(--set-banner-border);
      border-radius: 11px;
      background: var(--set-banner-grad);
      padding: 10px;
      display: grid;
      gap: 10px;
    }

    .set-stats-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .set-stat {
      padding: 4px 6px;
      border-left: 1px solid var(--set-stat-rule);
    }

    .set-stat:first-child {
      border-left: none;
    }

    .set-stat-label {
      font-size: 11px;
      color: var(--stat-label);
      margin-bottom: 3px;
    }

    .set-stat-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--stat-value);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .set-stat-sub-link {
      margin-top: 4px;
      display: inline-block;
      font-size: 12px;
      color: #9fd1ff;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      font-weight: 500;
      text-align: left;
    }

    .set-stat-sub-link:hover {
      color: #c7e4ff;
    }

    .set-stat-value.accent {
      color: var(--stat-accent);
    }

    .set-stat--cover {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 58px;
    }

    .set-detail-cover {
      display: block;
      max-height: 72px;
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: left center;
    }

    /* Base Set Unlimited: menu-toned backdrop, logo scaled down to fit frame */
    .set-image.set-image--zoom-cover {
      object-fit: contain;
      object-position: center;
      background: #0c1421;
      padding: 10px 14px;
    }

    /* Promo logos on solid black art: keep tile backdrop neutral */
    .set-image.set-image--blank-bg {
      background: var(--bg);
    }

    .set-detail-cover.set-detail-cover--zoom-cover {
      width: 100%;
      height: 72px;
      max-height: none;
      max-width: 100%;
      box-sizing: border-box;
      object-fit: contain;
      object-position: left center;
      background-color: #0c1421;
      padding: 6px 12px;
    }

    .set-detail-cover.set-detail-cover--blank-bg {
      background-color: var(--bg);
      padding: 6px 12px;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .set-filter-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    .set-filter-tabs {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .artist-menu-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .artist-filter-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 240px;
      z-index: 7;
      height: auto;
      min-height: 180px;
      max-height: 380px;
      overflow-y: auto;
      padding: 6px 10px;
      line-height: 1.4;
    }

    .meta-chip-value-btn {
      display: inline;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .meta-chip-value-btn:hover {
      opacity: 0.92;
    }

    .set-filter-tab {
      height: 36px;
      border: 1px solid var(--filter-border);
      border-radius: 9px;
      background: var(--filter-tab-bg);
      color: var(--filter-tab-text);
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .set-filter-tab.active {
      background: #f5d951;
      border-color: #f5d951;
      color: #1d2430;
    }

    .set-filter-tab.disabled {
      cursor: default;
      opacity: 0.72;
    }

    .set-detail-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .set-detail-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .set-detail-select {
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--detail-select-bg);
      color: var(--text);
      padding: 0 10px;
      font-size: 12px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .card-tile-shell {
      position: relative;
      display: block;
    }

    .card-tile {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-surface);
      padding: 8px;
      text-decoration: none;
      color: var(--text);
      display: grid;
      gap: 6px;
      cursor: pointer;
      position: relative;
      width: 100%;
      font: inherit;
      text-align: left;
    }

    .card-tile-shell--owned .card-tile {
      border-color: rgba(51, 209, 143, 0.55);
      box-shadow: 0 0 0 1px rgba(51, 209, 143, 0.25);
    }

    .card-tile-shell--owned:hover .card-tile {
      border-color: rgba(51, 209, 143, 0.85);
      box-shadow: 0 0 12px rgba(51, 209, 143, 0.2);
    }

    .card-add-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 3;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid rgba(147, 168, 199, 0.55);
      background: rgba(16, 24, 37, 0.94);
      color: #e9f1ff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .card-add-btn:hover:not(:disabled) {
      border-color: rgba(51, 209, 143, 0.85);
      color: #9ef0c8;
      background: rgba(18, 36, 28, 0.96);
    }

    .card-add-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .card-owned-chip {
      display: none;
      position: absolute;
      top: 6px;
      left: 6px;
      right: 36px;
      z-index: 2;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(12, 24, 18, 0.92);
      border: 1px solid rgba(51, 209, 143, 0.65);
      color: #9ef0c8;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
    }

    .card-tile-shell--owned:hover .card-owned-chip {
      display: block;
    }

    .collection-owned-banner {
      margin: 0 0 12px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(51, 209, 143, 0.45);
      background: linear-gradient(90deg, rgba(51, 209, 143, 0.14), rgba(51, 209, 143, 0.06));
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
    }

    .collection-owned-banner strong {
      color: #9ef0c8;
      font-weight: 700;
    }

    .collection-owned-banner .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 63 / 88;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--thumb-bg);
    }

    .card-thumb.placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      object-fit: unset;
    }

    .card-meta {
      font-size: 11px;
      color: var(--muted);
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-price-inline {
      color: #8fd3ff;
      font-weight: 600;
      white-space: nowrap;
    }

    .card-page {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--panel);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .card-page-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-page-body {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      align-items: start;
    }

    .card-page-media {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--media-well);
      padding: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .card-page-image {
      width: 100%;
      display: block;
      border: 1px solid var(--image-frame-border);
      border-radius: 14px;
      background: var(--thumb-bg);
    }

    .card-page-image.placeholder {
      aspect-ratio: 63 / 88;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .zoomable {
      cursor: zoom-in;
    }

    .image-zoom-overlay {
      position: fixed;
      inset: 0;
      background: var(--zoom-overlay);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 200;
    }

    .image-zoom-overlay.open {
      display: flex;
    }

    .image-zoom-inner {
      max-width: min(95vw, 900px);
      max-height: 92vh;
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .image-zoom-crop {
      border-radius: 30px;
      overflow: hidden;
      background: var(--thumb-bg);
      border: 1px solid var(--border);
    }

    .image-zoom-full {
      max-width: 100%;
      max-height: calc(92vh - 40px);
      display: block;
      border-radius: 0;
      border: 0;
      background: var(--thumb-bg);
      object-fit: contain;
    }

    .card-page-panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-page-panel-grad);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .card-page-pricing {
      margin-top: 12px;
    }

    .card-page-pricing .card-price-panel {
      margin-top: 0;
    }

    .card-price-panel {
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(17, 27, 42, 0.75);
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .card-price-panel h4,
    .card-price-condition-heading {
      margin: 0;

    async function openSetView(code, name = "", options = {}) {
      const setCode = String(code || "").trim().toUpperCase();
      const setName = String(name || "").trim();
      if (!setCode || !canOpenSet(setCode)) return;

      state.selectedSetCode = setCode;
      state.selectedSetName = setName;
      if (Object.prototype.hasOwnProperty.call(options, "cardNumber")) {
        state.selectedCardNumber = options.cardNumber;
      } else if (!options.keepCardNumber) {
        state.selectedCardNumber = null;
      }
      if (Object.prototype.hasOwnProperty.call(options, "setCardQuery")) {
        state.setCardQuery = options.setCardQuery;
      } else if (!options.keepSetCardQuery) {
        state.setCardQuery = "";
      }
      if (Object.prototype.hasOwnProperty.call(options, "savedSetGridScrollY")) {
        state.savedSetGridScrollY = options.savedSetGridScrollY;
      } else if (!options.keepSetGridScroll) {
        state.savedSetGridScrollY = null;
      }

      primeActiveSetPrices(setCode, setName);
      try {
        await Promise.all([
          ensureSetCardsLoaded(setCode),
          ensureSetCardDetailsLoaded(setCode)
        ]);
      } catch {
        /* ignore */
      }
      if (String(state.selectedSetCode || "").toUpperCase() !== setCode) return;
      scrollToPageTop();
      renderAll();
    }

      const code = String(setCode || "").trim().toUpperCase();

      const cached = state.cardPricingBySetCode[code];
      const hasVariants = Object.prototype.hasOwnProperty.call(state.cardVariantsBySetCode, code);

        if (state.setLinkPricesHydratedBySetCode[code]) return;
        void hydrateSetLinkPricesFromCache(code, setName);
        return;
      }
      primeActiveSetPrices(setCode, setName);
    }

    function updateCardDetailTcgPanelPrices() {
      if (!state.selectedSetCode || !state.selectedCardNumber) return;
      const selectedSet = getSetByCode(state.selectedSetCode);
      if (!selectedSet) return;
      const setConfig = detailedSetConfigs[selectedSet.code] || null;
      const cards = getSetCards(selectedSet, setConfig);
      const card = findCardInSet(cards, state.selectedCardNumber);
      if (!card) return;
      const pricingInfo = getCardPricingInfo(card);
      const variants = resolveTcgPrintVariantsForDisplay(card, pricingInfo);
      const rowEls = document.querySelectorAll(".card-price-panel-tcg .card-price-print-row");
      rowEls.forEach((rowEl, idx) => {
        const variant = variants[idx];
        if (!variant) return;
        const priceEl = rowEl.querySelector(".card-price-value");
        if (priceEl) {
          priceEl.textContent = resolveTcgRowListingPriceText(variant, pricingInfo);
        }
      });
    }

    function scheduleSetPriceRerender() {
      if (setPriceRerenderTimer) {
        clearTimeout(setPriceRerenderTimer);
        setPriceRerenderTimer = null;
      }
      setPriceRerenderTimer = setTimeout(() => {
        setPriceRerenderTimer = null;
        if (state.selectedSetCode && state.selectedCardNumber) {
          updateCardDetailTcgPanelPrices();
          return;
        }
        if (state.selectedSetCode && !state.selectedCardNumber) {
          updateSetDetailInlinePrices();
        }
      }, 0);

    function updateSetDetailInlinePrices() {
      if (!state.selectedSetCode || state.selectedCardNumber) return;
      const selectedSet = getSetByCode(state.selectedSetCode);
      const setConfig = selectedSet ? detailedSetConfigs[selectedSet.code] : null;
      if (!selectedSet) return;
      const content = document.getElementById("content");
      if (!content) return;
      const allCards = getSetCards(selectedSet, setConfig);
      const cardByNo = new Map(allCards.map((card) => [String(card.cardNo), card]));
      content.querySelectorAll(".card-tile-shell[data-card-number]").forEach((shell) => {
        const cardNo = shell.getAttribute("data-card-number");
        const card = cardByNo.get(String(cardNo || ""));
        const priceEl = shell.querySelector(".card-price-inline");
        if (!priceEl || !card) return;
        priceEl.textContent = formatCardPriceInline(card) || "—";
      });
      const mostExpensive = getMostExpensiveCardInSet(allCards);
      const statBlocks = content.querySelectorAll(".set-stat");
      for (const block of statBlocks) {
        const label = block.querySelector(".set-stat-label");
        if (label && label.textContent === "Most Expensive Card") {
          const valueEl = block.querySelector(".set-stat-value");

      const fullSetValue = getFullSetMarketValue(allCards);

          break;
        }
      }
    }

      if (!nextKey) return false;
      if (prevKey && prevKey !== nextKey) return true;
      if (Number(nextPriced) > Number(prevPriced)) return true;
      return false;
    }

    async function syncTcgLinkCacheGeneration() {
      try {
        const response = await fetch("/api/tcgplayer/link-cache-meta");
        if (!response.ok) return;
        const meta = await response.json();
        const nextKey = String(
          meta.cacheGenerationKey ||
            `${meta.logicVersion || ""}:${meta.cacheSavedAt || ""}:${meta.pricedInCacheCount ?? ""}`
        ).trim();
        const nextPriced = Number(meta.pricedInCacheCount ?? meta.cacheEntryCount) || 0;
        const prevKey = String(state.tcgLinkCacheGenerationKey || "").trim();
        const prevPriced = Number(state.tcgLinkCachePricedCount) || 0;
        const shouldRefresh = tcgLinkCacheNeedsClientRefresh(prevKey, nextKey, prevPriced, nextPriced);

        if (shouldRefresh) {
          state.cardPricingByTcgUrl = {};
          invalidateSetLinkPriceHydration();
          if (state.selectedSetCode && state.language === "english") {
            await hydrateSetLinkPricesFromCache(state.selectedSetCode, state.selectedSetName, {
              force: true
            });
          }
        } else if (nextKey && !prevKey && state.selectedSetCode && state.language === "english") {
          scheduleSetLinkPriceWarmup(state.selectedSetCode, state.selectedSetName);
        }

        if (nextKey) state.tcgLinkCacheGenerationKey = nextKey;
        state.tcgLinkCachePricedCount = nextPriced;
        purgeStaleTcgLinkPricesFromClient();
      } catch {
        // best effort
      }
    }

              era,
              _haystack: normalize(
                `${getCardDisplayName(card)} ${card.label} ${card.cardNo} ${getCardIllustrator(card)} ${card.setName} ${card.setCode}`
              )
            });
          }
        }
      }
      catalogSearchIndex = { language: lang, revision: catalogSearchIndexRevision, cards };
      catalogSearchCache = { key: "", matches: [] };
    }

    function getCatalogSearchCacheKey(query) {
      return [
        String(query || "").trim(),
        state.language,
        state.eraFilter,
        state.catalogArtistFilter
      ].join("\u0001");
    }

    function getCatalogSearchMatches(query) {
      const cacheKey = getCatalogSearchCacheKey(query);
      if (catalogSearchCache.key !== cacheKey) {
        const baseMatches = collectGlobalCardMatches(query);
        catalogSearchCache = {
          key: cacheKey,
          matches: applyCatalogSearchFilters(baseMatches)
        };
      }
      const sorted = catalogSearchCache.matches.slice();
      sortGlobalSearchMatches(sorted);
      return sorted;
    }

    function clearCatalogSearchTimers() {
      if (catalogSearchRenderTimer) {
        clearTimeout(catalogSearchRenderTimer);
        catalogSearchRenderTimer = null;
      }
      if (catalogSearchSkyTimer) {
        clearTimeout(catalogSearchSkyTimer);
        catalogSearchSkyTimer = null;
      }
    }

    function setCatalogSearchSkyFrozen(frozen) {
      const sky = document.getElementById("cardSky");
      if (sky) sky.classList.toggle("card-sky-frozen", Boolean(frozen));
    }

    function scheduleCatalogSearchSkyUpdate() {
      if (catalogSearchSkyTimer) clearTimeout(catalogSearchSkyTimer);
      catalogSearchSkyTimer = setTimeout(() => {
        catalogSearchSkyTimer = null;
        updateSetsCardSkyNow();
      }, CATALOG_SEARCH_SKY_DEBOUNCE_MS);
    }

    function scheduleCatalogSearchUpdate() {
      setCatalogSearchSkyFrozen(true);
      if (catalogSearchRenderTimer) clearTimeout(catalogSearchRenderTimer);
      catalogSearchRenderTimer = setTimeout(() => {
        catalogSearchRenderTimer = null;
        setCatalogSearchSkyFrozen(false);
        renderContent();
        updateCatalogSearchControls();
        scheduleCatalogSearchSkyUpdate();
      }, CATALOG_SEARCH_DEBOUNCE_MS);
    }

    function onCatalogSearchInput(value) {
      state.query = value || "";
      syncSearchInputsFromState();
      if (!String(state.query || "").trim()) {
        clearCatalogSearchTimers();
        setCatalogSearchSkyFrozen(false);
        catalogSearchCache = { key: "", matches: [] };
        renderContent();
        updateCatalogSearchControls();
        updateSetsCardSky();
        return;
      }
      void ensureCatalogManifestLoaded().then(() => {
        scheduleCatalogSearchUpdate();
      });
    }

    function slugify(text) {
      return String(text || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeCardNumberToken(raw) {
      const token = String(raw || "")
        .trim()
        .toUpperCase()
        .replace(/^#+/, "")
        .trim();
      if (!token) return "";
      if (/^\d+$/.test(token)) return String(Number(token));
      return token;
    }

    function formatUsd(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return "";
      return `$${n.toFixed(2)}`;
    }

    function formatTcgLinkShippingDisplay(listingPrice, shippingPrice) {
      const listing = Number(listingPrice);
      const shipping = Number(shippingPrice);
      if (!Number.isFinite(listing) || listing <= 0) return "";
      if (!Number.isFinite(shipping) || shipping < 0) return "";
      return shipping === 0
        ? `$${listing.toFixed(2)} + Free Shipping`
        : `$${listing.toFixed(2)} + $${shipping.toFixed(2)} Shipping`;
    }

    function normalizeTcgLinkPriceNode(raw) {
      if (!raw || typeof raw !== "object") return null;
      const totalPrice = Number(raw.totalPrice);
      const nearMintPrice = Number(raw.nearMintPrice);
      const shippingPrice = Number(raw.shippingPrice);
      const listingCondition = String(raw.listingCondition || "").trim() || "Near Mint";
      let nearMintWithShipping = String(raw.nearMintWithShipping || "").trim();
      if (!nearMintWithShipping) {
        nearMintWithShipping = formatTcgLinkShippingDisplay(nearMintPrice, shippingPrice);
      }
      const hasPrice =
        (nearMintWithShipping && nearMintWithShipping.length > 0) ||
        (Number.isFinite(totalPrice) && totalPrice > 0);
      if (!hasPrice) return null;
      return {
        totalPrice: Number.isFinite(totalPrice) && totalPrice > 0 ? totalPrice : null,
        nearMintPrice: Number.isFinite(nearMintPrice) && nearMintPrice > 0 ? nearMintPrice : null,
        shippingPrice: Number.isFinite(shippingPrice) && shippingPrice >= 0 ? shippingPrice : null,
        listingCondition,
        nearMintWithShipping,
        sellerName: raw.sellerName ? String(raw.sellerName) : "",
        pricingLogicVersion: Number(raw.pricingLogicVersion) || 0,
        fetchedAtMs: Number(raw.fetchedAtMs || 0) || Date.now()
      };
    }

    function getTcgListingConditionBase(node) {
      const raw = String((node && node.listingCondition) || "Near Mint").trim();
      const conditions = [
        "Near Mint",
        "Lightly Played",
        "Moderately Played",
        "Heavily Played",
        "Damaged"
      ];
      for (const label of conditions) {
        if (raw.toLowerCase().startsWith(label.toLowerCase())) return label;
      }
      return raw || "Near Mint";
    }

    function getTcgLinkPriceHeading(card, node) {
      const base = getTcgListingConditionBase(node);
      return `${base} + Shipping`;
    }

    const TCG_PRINT_FINISHES = new Set([
      "Normal",
      "Holofoil",
      "Reverse Holofoil",
      "1st Edition",
      "1st Edition Holofoil",
      "Unlimited"
    ]);

    const TCG_PRINT_SORT = [
      "Normal",
      "Holofoil",
      "Reverse Holofoil",
      "1st Edition",
      "1st Edition Holofoil",
      "Unlimited"
    ];

    function tcgPrintSortRank(printing) {
      const key = String(printing || "").trim();
      const idx = TCG_PRINT_SORT.indexOf(key);
      return idx === -1 ? TCG_PRINT_SORT.length + 1 : idx;
    }

    function extractTcgProductSlugFromUrl(url) {
      try {
        const parts = new URL(String(url || "").trim()).pathname.split("/").filter(Boolean);
        if (parts[0] === "product" && parts[2]) return decodeURIComponent(parts[2]);
      } catch {
        // ignore
      }
      return "";
    }

    function stripTcgplayerListingParams(url) {
      try {
        const parsed = new URL(String(url || "").trim());
        parsed.searchParams.delete("Language");
        parsed.searchParams.delete("Printing");
        parsed.searchParams.delete("Condition");
        const out = parsed.toString();
        return out.endsWith("?") ? out.slice(0, -1) : out;
      } catch {
        return String(url || "")
          .trim()
          .replace(/([?&])(Language|Printing|Condition)=[^&]*/gi, "")
          .replace(/[?&]$/, "");
      }
    }

    function stripCollectorNumberFromTcgSlug(slug, card) {
      let s = String(slug || "").trim();
      const label = String(card?.label || "").trim().replace(/\//g, " ");
      if (label) {
        const lower = s.toLowerCase();
        const tail = label.toLowerCase();
        if (lower.endsWith(` ${tail}`)) {
          s = s.slice(0, -(tail.length + 1)).trim();
        } else if (lower.endsWith(tail)) {
          s = s.slice(0, -tail.length).trim();
        }
      }
      return s.replace(/\s+\d{1,4}\s+\d{1,4}$/i, "").trim();
    }

    function canonicalTcgplayerProductUrl(pricingInfo, card, fallbackUrl = "") {
      const raw = String(fallbackUrl || pricingInfo?.tcgplayerUrl || "").trim();
      if (!raw) return "";
      try {
        const parsed = new URL(stripTcgplayerListingParams(raw));
        const parts = parsed.pathname.split("/").filter(Boolean);
        if (parts[0] === "product" && parts[1]) {
          let slug = parts[2] ? decodeURIComponent(parts[2]) : "";
          if (slug) slug = stripCollectorNumberFromTcgSlug(slug, card);
          return slug
            ? `https://www.tcgplayer.com/product/${parts[1]}/${encodeURIComponent(slug)}`
            : `https://www.tcgplayer.com/product/${parts[1]}`;
        }
      } catch {
        // ignore
      }
      return stripTcgplayerListingParams(raw);
    }

    function extractTcgPrintingFromUrl(url) {
      try {
        return String(new URL(String(url || "").trim()).searchParams.get("Printing") || "").trim();
      } catch {
        return "";
      }
    }

    function extractTcgProductIdFromUrl(url) {
      const text = String(url || "").trim();
      const match = text.match(/\/product\/(\d+)(?:[/?#]|$)/i);
      if (!match) return null;
      const id = Number(match[1]);
      return Number.isFinite(id) && id > 0 ? id : null;
    }

    function normalizeTcgLinkLookupUrl(url) {
      const raw = String(url || "").trim();
      if (!raw) return "";
      try {
        const parsed = new URL(raw);
        const printing = String(parsed.searchParams.get("Printing") || "")
          .trim()
          .replace(/\+/g, " ");
        parsed.searchParams.delete("Language");
        parsed.searchParams.delete("Printing");
        parsed.searchParams.delete("Condition");
        if (printing) {
          parsed.searchParams.set("Language", "English");
          parsed.searchParams.set("Printing", printing);
        }
        return parsed.toString();
      } catch {
        return raw;
      }
    }

    function storeTcgLinkPriceForUrl(url, normalized) {
      if (!normalized) return;
      const keys = new Set([String(url || "").trim(), normalizeTcgLinkLookupUrl(url)].filter(Boolean));
      for (const key of keys) {
        state.cardPricingByTcgUrl[key] = normalized;
      }
    }

    function getTcgLinkPriceForUrl(url) {
      const raw = String(url || "").trim();
      if (!raw) return null;
      const candidates = [raw, normalizeTcgLinkLookupUrl(raw)];
      for (const key of candidates) {
        const hit = state.cardPricingByTcgUrl[key];
        if (hit && !isTcgLinkPriceNodeStale(hit)) return hit;
      }
      const productId = extractTcgProductIdFromUrl(raw);
      if (!productId) return null;
      const printing = extractTcgPrintingFromUrl(raw).toLowerCase();
      if (printing) {
        for (const [key, hit] of Object.entries(state.cardPricingByTcgUrl)) {
          if (isTcgLinkPriceNodeStale(hit)) continue;
          if (extractTcgProductIdFromUrl(key) !== productId) continue;
          if (extractTcgPrintingFromUrl(key).toLowerCase() !== printing) continue;
          return hit;
        }
      }
      for (const [key, hit] of Object.entries(state.cardPricingByTcgUrl)) {
        if (isTcgLinkPriceNodeStale(hit)) continue;
        if (extractTcgProductIdFromUrl(key) === productId) return hit;
      }
      return null;
    }

    function getTcgLinkPriceDisplayText(node) {
      if (!node || typeof node !== "object" || isTcgLinkPriceNodeStale(node)) return "";
      const labeled = String(node.nearMintWithShipping || "").trim();
      if (labeled) return labeled;
      const built = formatTcgLinkShippingDisplay(node.nearMintPrice, node.shippingPrice);
      if (built) return built;
      const total = Number(node.totalPrice);
      if (Number.isFinite(total) && total > 0) return formatUsd(total);
      return "";
    }

    function resolveTcgRowListingPriceText(row, pricingInfo = null) {
      const seed = String(row?.nearMintWithShipping || "").trim();
      const lookupUrl = normalizeTcgLinkLookupUrl(row?.priceLookupUrl || row?.tcgplayerUrl || "");
      const resolved = lookupUrl ? getTcgLinkPriceForUrl(lookupUrl) : null;
      const fromCache = getTcgLinkPriceDisplayText(resolved);
      if (fromCache) return fromCache;
      if (seed) return seed;
      const manifestShip = String(pricingInfo?.nearMintWithShipping || "").trim();
      if (manifestShip) return manifestShip;
      const manifestBuilt = formatTcgLinkShippingDisplay(
        pricingInfo?.nearMintPrice ?? pricingInfo?.nearMintAddToCartPrice,
        pricingInfo?.shippingPrice
      );
      if (manifestBuilt) return manifestBuilt;
      const manifestTotal = Number(pricingInfo?.tcgplayerPrice);
      if (Number.isFinite(manifestTotal) && manifestTotal > 0) return formatUsd(manifestTotal);
      return "—";
    }

    function ensureCardTcgVariantPricesLoaded(card, pricingInfo) {
      const variants = resolveTcgPrintVariantsForDisplay(card, pricingInfo);
      for (const row of variants) {
        const lookupUrl = row.priceLookupUrl || row.tcgplayerUrl;
        if (lookupUrl) ensureTcgLinkPriceLoaded(lookupUrl, card);
      }
    }

    function buildTcgplayerUrlWithPrinting(baseUrl, printing) {
      const url = canonicalTcgplayerProductUrl(null, null, baseUrl) || String(baseUrl || "").trim();
      const finish = String(printing || "").trim();
      if (!url) return "";
      if (!finish) return url;
      try {
        const parsed = new URL(url);
        parsed.searchParams.set("Language", "English");
        parsed.searchParams.set("Printing", finish);
        return parsed.toString();
      } catch {
        const joiner = url.includes("?") ? "&" : "?";
        return `${url}${joiner}Language=English&Printing=${encodeURIComponent(finish)}`;
      }
    }

    function isTcgPrintFinishLabel(label) {
      return TCG_PRINT_FINISHES.has(String(label || "").trim());
    }

    function isHoloOnlyRarity(rarity) {
      const value = String(rarity || "").trim();
      if (!value || isTcgPrintFinishLabel(value)) return false;
      if (/^(common|uncommon|rare)$/i.test(value)) return false;
      return true;
    }

    function getTcgVariantDisplayLabel(printing, cardRarity, pricingRarity = "") {
      const finish = String(printing || "").trim();
      const rarity = String(cardRarity || pricingRarity || "").trim();
      if (!finish || finish.toLowerCase() === "normal") {
        return rarity || "Normal";
      }
      if (finish === "Holofoil" && isHoloOnlyRarity(rarity)) {
        return rarity;
      }
      return finish;
    }

    function getSingleTcgVariantDisplayLabel(card, pricingInfo) {
      const pricingRarity = String((pricingInfo && pricingInfo.rarity) || "").trim();
      const detailRarity = getCardRarity(card);
      if (pricingRarity && !isTcgPrintFinishLabel(pricingRarity)) return pricingRarity;
      if (detailRarity) return detailRarity;
      return pricingRarity || "Normal";
    }

    function shouldShowMultiTcgPrintRows(variants) {
      const list = Array.isArray(variants) ? variants : [];
      if (list.some((v) => v.printing === "Reverse Holofoil")) return true;
      const printings = new Set(list.map((v) => String(v.printing || "").trim()).filter(Boolean));
      return printings.size >= 2;
    }

    function ensureMultiTcgPrintRows(card, pricingInfo, variants) {
      const baseUrl = String(pricingInfo?.tcgplayerUrl || "").trim();
      const cardRarity = getCardRarity(card);
      const pricingRarity = String(pricingInfo?.rarity || "").trim();
      let list = finalizeTcgPrintVariants(variants || [], cardRarity, pricingRarity);
      const hasReverse = list.some((v) => v.printing === "Reverse Holofoil");
      const hasNormal = list.some((v) => v.printing === "Normal");
      if (hasReverse && !hasNormal && baseUrl) {
        list.unshift({
          printing: "Normal",
          label: getTcgVariantDisplayLabel("Normal", cardRarity, pricingRarity),
          tcgplayerUrl: buildTcgplayerUrlWithPrinting(baseUrl, "Normal"),
          priceLookupUrl: normalizeTcgLinkLookupUrl(buildTcgplayerUrlWithPrinting(baseUrl, "Normal")),
          nearMintWithShipping: "",
          listingCondition: ""
        });
      }
      return list.sort((a, b) => {
        const rank = tcgPrintSortRank(a.printing) - tcgPrintSortRank(b.printing);
        return rank !== 0 ? rank : a.label.localeCompare(b.label);
      });
    }

    function tcgMarketHistoryHasVariant(series, variantKey) {
      const key = String(variantKey || "").trim();
      return (Array.isArray(series) ? series : []).some((row) => {
        const rowKey = String(row.variantKey || row.printing || "").trim();
        if (rowKey !== key) return false;
        return (Array.isArray(row.points) ? row.points : []).some(
          (point) => Number(point.price) > 0
        );
      });
    }

    function augmentTcgVariantsFromMarketHistory(card, pricingInfo, variants) {
      const list = Array.isArray(variants) ? [...variants] : [];
      const cacheKey = getMarketHistoryCacheKey(card);
      const rawSeries = state.marketHistoryByKey[cacheKey]?.series;
      if (!Array.isArray(rawSeries) || !rawSeries.length) return list;

      const historyPrintings = [];
      for (const row of rawSeries) {
        const finish = normalizeTcgPrintingFinish(String(row.variantKey || row.printing || "").trim());
        if (!finish || !TCG_PRINT_FINISHES.has(finish)) continue;
        if (!tcgMarketHistoryHasVariant(rawSeries, finish)) continue;
        if (!historyPrintings.includes(finish)) historyPrintings.push(finish);
      }
      if (historyPrintings.length < 2) return list;

      const existing = new Set(list.map((v) => v.printing));
      const baseCanonical = canonicalTcgplayerProductUrl(pricingInfo, card);
      const rawBase = String(pricingInfo?.tcgplayerUrl || "").trim();
      if (!baseCanonical) return list;

      const cardRarity = getCardRarity(card);
      const pricingRarity = String(pricingInfo?.rarity || "").trim();
      for (const printing of historyPrintings) {
        if (existing.has(printing)) continue;
        list.push({
          printing,
          label: getTcgVariantDisplayLabel(printing, cardRarity, pricingRarity),
          tcgplayerUrl: buildTcgplayerUrlWithPrinting(baseCanonical, printing),
          priceLookupUrl: buildTcgplayerUrlWithPrinting(rawBase || baseCanonical, printing),
          nearMintWithShipping: "",
          listingCondition: ""
        });
        existing.add(printing);
      }
      return list;
    }

    function getTcgPrintVariantsForCard(card, pricingInfo) {
      const cardRarity = getCardRarity(card);
      const pricingRarity = String(pricingInfo?.rarity || "").trim();
      const indexed = collectTcgVariantsFromVariantsIndex(card, pricingInfo);
      return finalizeTcgPrintVariants(
        augmentTcgVariantsFromMarketHistory(card, pricingInfo, indexed),
        cardRarity,
        pricingRarity
      );
    }

    function resolveTcgPrintVariantsForDisplay(card, pricingInfo) {
      const baseCanonical = canonicalTcgplayerProductUrl(pricingInfo, card);
      const rawBase = String(pricingInfo?.tcgplayerUrl || "").trim();
      let indexed = getTcgPrintVariantsForCard(card, pricingInfo);

      if (indexed.length >= 2 && shouldShowMultiTcgPrintRows(indexed)) {
        return ensureMultiTcgPrintRows(card, pricingInfo, indexed).map((row) => {
          const priceLookupUrl = normalizeTcgLinkLookupUrl(
            row.priceLookupUrl ||
              buildTcgplayerUrlWithPrinting(rawBase || row.tcgplayerUrl, row.printing)
          );
          return {
            ...row,
            tcgplayerUrl: buildTcgplayerUrlWithPrinting(baseCanonical || rawBase, row.printing),
            priceLookupUrl
          };
        });
      }

      const label = getSingleTcgVariantDisplayLabel(card, pricingInfo);
      const priceLookupUrl = rawBase || indexed[0]?.priceLookupUrl || indexed[0]?.tcgplayerUrl || "";
      const url =
        baseCanonical || canonicalTcgplayerProductUrl(pricingInfo, card, priceLookupUrl);
      if (!url) return [];
      return [{ printing: "Normal", label, tcgplayerUrl: url, priceLookupUrl }];
    }

    function normalizeTcgPrintingFinish(printing) {
      const raw = String(printing || "").trim();
      if (!raw) return "Normal";
      if (TCG_PRINT_FINISHES.has(raw)) return raw;
      const decoded = raw.replace(/\+/g, " ").trim();
      if (TCG_PRINT_FINISHES.has(decoded)) return decoded;
      const lower = decoded.toLowerCase();
      if (lower === "normal") return "Normal";
      if (lower.includes("reverse") && lower.includes("holo")) return "Reverse Holofoil";
      if (lower.includes("holofoil")) return "Holofoil";
      return "Normal";
    }

    function finalizeTcgPrintVariants(variants, cardRarity = "", pricingRarity = "") {
      let list = Array.isArray(variants) ? [...variants] : [];
      if (list.some((row) => row.printing === "Reverse Holofoil")) {
        list = list.filter((row) => row.printing !== "Holofoil");
      }

      const rarity = String(cardRarity || pricingRarity || "").trim();
      if (!isHoloOnlyRarity(rarity)) return list;

      const holoRow = list.find((row) => row.printing === "Holofoil");
      const normalRow = list.find((row) => row.printing === "Normal");
      const others = list.filter((row) => row.printing !== "Holofoil" && row.printing !== "Normal");

      if (holoRow && normalRow) {
        list = [
          {
            ...holoRow,
            printing: "Normal",
            label: rarity,
            priceLookupUrl: holoRow.priceLookupUrl || normalRow.priceLookupUrl,
            tcgplayerUrl: holoRow.tcgplayerUrl || normalRow.tcgplayerUrl,
            nearMintWithShipping: holoRow.nearMintWithShipping || normalRow.nearMintWithShipping,
            listingCondition: holoRow.listingCondition || normalRow.listingCondition
          },
          ...others
        ];
      } else if (holoRow) {
        list = [{ ...holoRow, printing: "Normal", label: rarity }, ...others];
      } else {
        list = list.map((row) =>
          row.printing === "Normal" && (!row.label || isTcgPrintFinishLabel(row.label))
            ? { ...row, label: rarity }
            : row
        );
      }

      const byLabel = new Map();
      for (const row of list) {
        const labelKey = String(row.label || "").trim().toLowerCase();
        if (!labelKey) continue;
        const existing = byLabel.get(labelKey);
        if (!existing) {
          byLabel.set(labelKey, row);
          continue;
        }
        const existingHasPrice = String(existing.nearMintWithShipping || "").trim();
        const rowHasPrice = String(row.nearMintWithShipping || "").trim();
        if (!existingHasPrice && rowHasPrice) byLabel.set(labelKey, row);
      }
      if (byLabel.size && byLabel.size < list.length) {
        list = [...byLabel.values()].sort(
          (a, b) => tcgPrintSortRank(a.printing) - tcgPrintSortRank(b.printing)
        );
      }
      return list;
    }

    function collectTcgVariantsFromVariantsIndex(card, pricingInfo) {
      const baseUrl = pricingInfo && pricingInfo.tcgplayerUrl ? String(pricingInfo.tcgplayerUrl) : "";
      if (!baseUrl) return [];
      const cardRarity = getCardRarity(card);
      const pricingRarity = String(pricingInfo?.rarity || "").trim();
      const seen = new Map();

      function addVariant(printing, labelOverride, rowUrlOverride = "", variantRow = null) {
        const finish = normalizeTcgPrintingFinish(printing);
        const dedupeKey = finish.toLowerCase();
        if (seen.has(dedupeKey)) return;
        const label =
          String(labelOverride || "").trim() ||
          getTcgVariantDisplayLabel(finish, cardRarity, pricingRarity);
        const rowUrl = String(rowUrlOverride || "").trim();
        const priceLookupUrl = normalizeTcgLinkLookupUrl(
          rowUrl || buildTcgplayerUrlWithPrinting(baseUrl, finish)
        );
        if (!priceLookupUrl) return;
        const source = variantRow && typeof variantRow === "object" ? variantRow : {};
        seen.set(dedupeKey, {
          printing: finish,
          label,
          tcgplayerUrl: priceLookupUrl,
          priceLookupUrl,
          nearMintWithShipping: String(source.nearMintWithShipping || "").trim(),
          listingCondition: String(source.listingCondition || "").trim()
        });
      }

      const code = String(card?.setCode || "").trim().toUpperCase();
      const variantsByCardNo = state.cardVariantsBySetCode[code];
      if (variantsByCardNo && typeof variantsByCardNo === "object") {
        const rawCardNo = String(card?.cardNo || "").trim();
        const trailingDigitsMatch = rawCardNo.match(/(\d{1,4})$/);
        const trailingDigits = trailingDigitsMatch ? trailingDigitsMatch[1] : "";
        const numericTail = trailingDigits ? String(Number(trailingDigits)) : "";
        const keys = [
          rawCardNo.toUpperCase(),
          normalizeCardNumberToken(card?.cardNo),
          normalizeCardNumberToken(card?.label),
          normalizeCardNumberToken(String(card?.cardNo || "").replace(/^0+/, "")),
          trailingDigits,
          numericTail
        ].filter(Boolean);
        for (const key of keys) {
          const list = variantsByCardNo[key];
          if (!Array.isArray(list) || !list.length) continue;
          for (const row of list) {
            const rowUrl = String(row.tcgplayerUrl || "").trim();
            let printing = String(row.printing || row.label || "").trim();
            if (rowUrl) {
              try {
                const fromUrl = new URL(rowUrl).searchParams.get("Printing");
                if (fromUrl) printing = fromUrl;
              } catch {
                // ignore
              }
            }
            if (!printing) continue;
            const rowLabel = String(row.label || row.printing || "").trim();
            const displayLabel =
              rowLabel && !isTcgPrintFinishLabel(rowLabel) ? rowLabel : null;
            const finish = normalizeTcgPrintingFinish(printing);
            addVariant(
              finish,
              displayLabel || getTcgVariantDisplayLabel(finish, cardRarity, pricingRarity),
              rowUrl,
              row
            );
          }
          break;
        }
      }

      return [...seen.values()].sort((a, b) => {
        const rank = tcgPrintSortRank(a.printing) - tcgPrintSortRank(b.printing);
        return rank !== 0 ? rank : a.label.localeCompare(b.label);
      });
    }

      const variants = getTcgPrintVariantsForCard(card, pricingInfo);
      if (variants.length) return variants;
      const baseUrl = pricingInfo && pricingInfo.tcgplayerUrl ? String(pricingInfo.tcgplayerUrl) : "";
      if (!baseUrl) return [];
      const canonical = canonicalTcgplayerProductUrl(pricingInfo, card, baseUrl);
      return [
        {
          printing: "Normal",
          label: getSingleTcgVariantDisplayLabel(card, pricingInfo),
          tcgplayerUrl: canonical || stripTcgplayerListingParams(baseUrl),
          priceLookupUrl: baseUrl

    function formatEbayCardNumberQuery(card) {
      const label = String(card?.label || "")
        .trim()
        .replace(/^#/, "");
      const cardNo = String(card?.cardNo || "").trim();
      const slashPattern = /^\d+\s*\/\s*\d+$/;
      if (slashPattern.test(label)) return label.replace(/\s+/g, "");
      if (slashPattern.test(cardNo)) return cardNo.replace(/\s+/g, "");

      const detail = getCardDetailForCard(card);
      let num = String(detail?.number || "").trim();
      let total = String(detail?.total || "").trim();
      if (!num) num = primaryCardNumberToken(cardNo || label);
      if (!num) return "";

      if (total) {
        const padLen = Math.max(num.length, total.length, 3);
        return `${num.padStart(padLen, "0")}/${total.padStart(padLen, "0")}`;
      }
      return num;
    }

    function buildEbaySearchUrlForCard(card, options = {}) {
      const row = options.row || null;
      const printing = String(row?.printing || options.printing || "").trim();
      const isReverseHolo =
        printing === "Reverse Holofoil" ||
        /reverse\s*holo/i.test(String(row?.label || ""));

      const name = getCardDisplayName(card).toLowerCase();
      const terms = [];
      if (name) terms.push(...name.split(/\s+/).filter(Boolean));

      const numberQuery = formatEbayCardNumberQuery(card);
      if (numberQuery) terms.push(numberQuery);

      if (isReverseHolo) {
        terms.push("reverse", "holofoil");
      }

      if (!terms.length) return "";
      return `https://www.ebay.com/sch/i.html?_nkw=${terms.map(encodeURIComponent).join("+")}`;
    }

    function refreshCardDetailPricingExtra() {
      if (!state.selectedCardNumber) {
        renderAll();
        return;
      }
      const host = document.getElementById("cardPagePricingExtra");
      if (!host) {
        renderAll();
        return;
      }
      const run = () => {
        cardDetailExtraRenderQueued = false;
        const card = getActiveCardDetailCard();
        const extraHost = document.getElementById("cardPagePricingExtra");
        const root = document.getElementById("content");
        if (!card || !extraHost || !root) return;
        if (Date.now() < cardDetailExtraRenderBlockedUntil) {
          cardDetailExtraRenderQueued = true;
          setTimeout(run, 100);
          return;
        }
        extraHost.innerHTML = buildCardDetailPricingExtraHtml(card);
        wireMarketPriceHistoryPanel(root, card);
        wirePriceChartingSoldListingsPanel(root);
      };
      if (Date.now() < cardDetailExtraRenderBlockedUntil) {
        if (!cardDetailExtraRenderQueued) {
          cardDetailExtraRenderQueued = true;
          setTimeout(run, 100);
        }
        return;
      }
      run();
    }

      const baseUrl = pricingInfo && pricingInfo.tcgplayerUrl ? String(pricingInfo.tcgplayerUrl) : "";

      let printVariants = resolveTcgPrintVariantsForDisplay(card, pricingInfo);
      if (!printVariants.length) {

    const ENERGY_DETAIL_MARK = { C: "\uE000", R: "\uE001", W: "\uE002", G: "\uE003", L: "\uE004", P: "\uE005", F: "\uE006", M: "\uE007", D: "\uE008" };
    const ENERGY_DETAIL_ICON_HTML = {
      [ENERGY_DETAIL_MARK.C]: colorlessEnergyIconHtml,
      [ENERGY_DETAIL_MARK.R]: fireEnergyIconHtml,
      [ENERGY_DETAIL_MARK.W]: waterEnergyIconHtml,
      [ENERGY_DETAIL_MARK.G]: grassEnergyIconHtml,

    /**
     * Escape card detail text but render energy tags as icons: `{C}` / `{ C }` (Colorless), `{R}` / `{ R }` (Fire),
     * `{W}` / `{ W }` (Water), `{G}` / `{ G }` (Grass), `{L}` / `{ L }` (Lightning), `{P}` / `{ P }` (Psychic),
     * `{F}` / `{ F }` (Fighting), `{M}` / `{ M }` (Metal), `{D}` / `{ D }` (Dark). Matches PkmnCards-style abbreviations.
     */
    function formatCardDetailsEnergyText(text) {
      const raw = String(text || "");
      if (!raw) return "";
      let marked = raw.replace(/\{\s*C\s*\}/g, ENERGY_DETAIL_MARK.C);
      marked = marked.replace(/\{\s*R\s*\}/g, ENERGY_DETAIL_MARK.R);
      marked = marked.replace(/\{\s*W\s*\}/g, ENERGY_DETAIL_MARK.W);
      marked = marked.replace(/\{\s*G\s*\}/g, ENERGY_DETAIL_MARK.G);
      marked = marked.replace(/\{\s*L\s*\}/g, ENERGY_DETAIL_MARK.L);
      marked = marked.replace(/\{\s*P\s*\}/g, ENERGY_DETAIL_MARK.P);
      marked = marked.replace(/\{\s*F\s*\}/g, ENERGY_DETAIL_MARK.F);
      marked = marked.replace(/\{\s*M\s*\}/g, ENERGY_DETAIL_MARK.M);
      marked = marked.replace(/\{\s*D\s*\}/g, ENERGY_DETAIL_MARK.D);
      const splitRe = /(\uE000|\uE001|\uE002|\uE003|\uE004|\uE005|\uE006|\uE007|\uE008)/;
      return marked
        .split(splitRe)
        .map((segment) => ENERGY_DETAIL_ICON_HTML[segment] || escapeHtml(segment))
        .join("");
    }
