    function getSortedCards(cards) {
      const list = [...cards];
      if (state.setSort === "number-desc") {
        list.sort((a, b) => {
          const delta = cardSortNumberKey(b) - cardSortNumberKey(a);
          if (delta !== 0) return delta;
          return b.label.localeCompare(a.label);
        });
      } else if (state.setSort === "name") {
        list.sort((a, b) => a.name.localeCompare(b.name));
      } else if (state.setSort === "name-desc") {
        list.sort((a, b) => b.name.localeCompare(a.name));
      } else if (state.setSort === "price") {
        list.sort((a, b) => {
          const pa = getEffectiveTcgplayerPrice(getCardPricingInfo(a), a);
          const pb = getEffectiveTcgplayerPrice(getCardPricingInfo(b), b);
          const aMissing = !Number.isFinite(pa) || pa <= 0;
          const bMissing = !Number.isFinite(pb) || pb <= 0;
          if (aMissing && bMissing) return cardSortNumberKey(a) - cardSortNumberKey(b);
          if (aMissing) return 1;
          if (bMissing) return -1;
          const delta = pa - pb;
          if (delta !== 0) return delta;
          return cardSortNumberKey(a) - cardSortNumberKey(b);
        });
      } else if (state.setSort === "price-desc") {
        list.sort((a, b) => {
          const pa = getEffectiveTcgplayerPrice(getCardPricingInfo(a), a);
          const pb = getEffectiveTcgplayerPrice(getCardPricingInfo(b), b);
          const aMissing = !Number.isFinite(pa) || pa <= 0;
          const bMissing = !Number.isFinite(pb) || pb <= 0;
          if (aMissing && bMissing) return cardSortNumberKey(a) - cardSortNumberKey(b);
          if (aMissing) return 1;
          if (bMissing) return -1;
          const delta = pb - pa;
          if (delta !== 0) return delta;
          return cardSortNumberKey(a) - cardSortNumberKey(b);
        });
      } else {
        list.sort((a, b) => {
          const delta = cardSortNumberKey(a) - cardSortNumberKey(b);
          if (delta !== 0) return delta;
          return a.label.localeCompare(b.label);
        });
      }
      return list;
    }

    const EX_SYMBOL_URL = "https://archives.bulbagarden.net/media/upload/thumb/e/ec/Pok%C3%A9mon_ex.png/30px-Pok%C3%A9mon_ex.png";
    const VMAX_SYMBOL_URL = "/vmax-logo.png";

    function hasExInName(name) {
      return /\bex\b/i.test(String(name || ""));
    }

    function hasEndingVmax(name) {
      return /\bvmax$/i.test(String(name || "").trim());
    }

    function normalizeCardName(name) {
      let s = String(name || "").trim();
      if (!s) return "";
      for (let pass = 0; pass < 2; pass += 1) {
        s = s
          .replace(/&amp;/gi, "&")
          .replace(/&quot;/gi, "\"")
          .replace(/&#39;|&apos;/gi, "'")
          .replace(/&lt;/gi, "<")
          .replace(/&gt;/gi, ">")
          .replace(/&#(\d+);/g, (_, num) => {
            const code = Number(num);
            return Number.isFinite(code) ? String.fromCharCode(code) : "";
          })
          .replace(/&#x([a-f0-9]+);/gi, (_, hex) => {
            const code = Number.parseInt(hex, 16);
            return Number.isFinite(code) ? String.fromCharCode(code) : "";
          });
      }
      try {
        const ta = document.createElement("textarea");
        ta.innerHTML = s;
        s = String(ta.value || s).trim();
      } catch (_) {
        // keep decoded string
      }
      s = s.replace(/\u2018/g, "'").replace(/\u2019/g, "'");
      return s.replace(/\s{2,}/g, " ").trim();
    }

    function renderCardName(nameOrCard) {
      const name = typeof nameOrCard === "object" && nameOrCard
        ? getCardDisplayName(nameOrCard)
        : normalizeCardName(nameOrCard);
      const safeName = escapeHtml(name);
      if (hasEndingVmax(name)) {
        const baseName = safeName.replace(/\bvmax$/gi, "").replace(/\s{2,}/g, " ").trim();
        return `<span class="card-name-with-ex">${baseName}<img class="vmax-symbol" src="${VMAX_SYMBOL_URL}" alt="VMAX" loading="lazy" /></span>`;
      }
      if (!hasExInName(name)) return safeName;
      const baseName = safeName.replace(/\bex\b/gi, "").replace(/\s{2,}/g, " ").trim();
      return `<span class="card-name-with-ex">${baseName}<img class="ex-symbol" src="${EX_SYMBOL_URL}" alt="ex" loading="lazy" /></span>`;
    }

    function normalizeCardLookupToken(raw) {
      return String(raw || "")
        .trim()
        .replace(/^#+/, "")
        .trim();
    }

    function findCardByNumberInput(cards, rawInput) {
      const token = normalizeCardLookupToken(rawInput);
      if (!token) return null;
      let hit = cards.find((c) => String(c.cardNo) === token);
      if (hit) return hit;
      const labelNorm = (v) => normalizeCardLookupToken(String(v || "").replace(/^#+/, ""));
      hit = cards.find((c) => labelNorm(c.label) === token);
      if (hit) return hit;
      const lower = token.toLowerCase();
      hit = cards.find((c) => String(c.cardNo).toLowerCase() === lower);
      if (hit) return hit;
      hit = cards.find((c) => labelNorm(c.label).toLowerCase() === lower);
      if (hit) return hit;
      if (/^\d+$/.test(token)) {
        const n = parseInt(token, 10);
        if (Number.isFinite(n)) {
          hit = cards.find((c) => String(c.cardNo) === String(n));
          if (hit) return hit;
          const padded3 = String(n).padStart(3, "0");
          hit = cards.find((c) => String(c.cardNo) === padded3);
          if (hit) return hit;
          hit = cards.find((c) => Number(c.cardNo) === n);
          if (hit) return hit;
        }
      }
      return null;
    }

        const hit = findCardByNumberInput(cards, inputEl.value);

          inputEl.value = hit.label;
          if (String(hit.cardNo) !== String(state.selectedCardNumber)) {
            state.selectedCardNumber = hit.cardNo;

            contentEl.querySelectorAll(".card-detail-num-input").forEach((other) => {

        }
        syncInvalid(inputEl);

    function formatReleaseDate(value) {
      const raw = String(value || "").trim();
      if (!raw) return "N/A";
      const date = new Date(raw);
      if (!Number.isFinite(date.getTime())) return raw;
      return date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function scrollToPageTop() {
      window.scrollTo({ top: 0, left: 0, behavior: "auto" });

    function restoreSavedSetGridScroll() {
      const y = state.savedSetGridScrollY;
      state.savedSetGridScrollY = null;
      if (typeof y !== "number" || y < 0) return;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.scrollTo({ top: y, left: 0, behavior: "auto" });
        });
      });
    }

    function handleSelectArrowKey(event, selectEl, onValueChange) {
      if (!selectEl || typeof onValueChange !== "function") return;
      const key = event.key;
      const options = Array.from(selectEl.options || []);
      if (!options.length) return;
      let nextIndex = selectEl.selectedIndex;
      if (key === "ArrowDown") nextIndex += 1;
      else if (key === "ArrowUp") nextIndex -= 1;
      else if (key === "Home") nextIndex = 0;
      else if (key === "End") nextIndex = options.length - 1;
      else return;
      event.preventDefault();
      if (nextIndex < 0) nextIndex = 0;
      if (nextIndex >= options.length) nextIndex = options.length - 1;
      if (nextIndex === selectEl.selectedIndex) return;
      selectEl.selectedIndex = nextIndex;
      onValueChange(selectEl.value || "all");
    }

    function filterCardsBySetQuery(cards, query) {
      const q = String(query || "").trim();
      if (!q) return cards;
      return cards.filter((card) => cardMatchesSearchQuery(card, q));
    }

    function resolveCollectionItemSetCode(item) {
      const code = String(item?.setCode || "")
        .trim()
        .toUpperCase();
      if (code) return code;
      const name = String(item?.setName || "")
        .trim()
        .toLowerCase();
      if (!name) return "";
      const english = setsByEra.english || {};
      for (const list of Object.values(english)) {
        if (!Array.isArray(list)) continue;
        for (const row of list) {
          if (String(row.name || "").trim().toLowerCase() === name) {
            return String(row.code || "").toUpperCase();
          }
        }
      }
      return "";
    }

    function isCollectionSignedIn() {
      if (state.collectionSignedIn) return true;
      return Boolean(window.InfinityAccount && window.InfinityAccount.isSignedIn());
    }

    function resetCollectionOwnershipState() {
      state.collectionItemsCache = null;
      state.collectionItemsFetch = null;
      state.collectionUserItemsAvailable = false;
      state.collectionOwnedKeysBySetCode = {};
      state.collectionOwnedCheckedBySetCode = {};
    }

    function appendCardToCollectionCache(item) {
      if (!item) return;
      if (!Array.isArray(state.collectionItemsCache)) state.collectionItemsCache = [];
      state.collectionItemsCache.unshift(item);
      const code = String(item.setCode || "").toUpperCase();
      if (!code) return;
      if (!state.collectionOwnedKeysBySetCode[code]) {
        state.collectionOwnedKeysBySetCode[code] = new Set();
      }
      const keys = state.collectionOwnedKeysBySetCode[code];
      for (const key of cardNumberLookupKeys(item.cardNumber || "")) keys.add(key);
    }

    function buildOwnedKeysForSetFromItems(setCode, items) {
      const code = String(setCode || "").toUpperCase();
      const keys = new Set();
      if (!code || !Array.isArray(items)) return keys;
      for (const item of items) {
        if (!item || item.type !== "single") continue;
        if (resolveCollectionItemSetCode(item) !== code) continue;
        const cardKeys = cardNumberLookupKeys(item.cardNumber || "");
        if (cardKeys.length) {
          for (const key of cardKeys) keys.add(key);
        } else if (item.id) {
          keys.add(`item:${item.id}`);
        }
      }
      return keys;
    }

    function isCardOwnedInCollection(card, ownedKeys) {
      if (!ownedKeys || !ownedKeys.size || !card) return false;
      const candidates = [
        ...cardNumberLookupKeys(card.cardNo),
        ...cardNumberLookupKeys(String(card.label || "").replace(/^#/, ""))
      ];
      return candidates.some((key) => ownedKeys.has(key));
    }

    function ensureCollectionItems() {
      if (state.collectionItemsCache) {
        return Promise.resolve(state.collectionItemsCache);
      }
      if (state.collectionItemsFetch) return state.collectionItemsFetch;
      state.collectionItemsFetch = fetch("/api/items?syncPrices=0", { credentials: "same-origin" })
        .then((res) => {
          if (!res.ok) {
            state.collectionUserItemsAvailable = false;
            state.collectionItemsCache = [];
            return [];
          }
          state.collectionUserItemsAvailable = true;
          return res.json();
        })
        .then((payload) => {
          const items = Array.isArray(payload?.items) ? payload.items : [];
          state.collectionItemsCache = items;
          return items;
        })
        .catch(() => {
          state.collectionUserItemsAvailable = false;
          state.collectionItemsCache = [];
          return [];
        });
      return state.collectionItemsFetch;
    }

    function syncCollectionOwnedForSet(setCode) {
      const code = String(setCode || "").toUpperCase();
      if (!code) return Promise.resolve(null);
      if (state.collectionOwnedCheckedBySetCode[code]) {
        return Promise.resolve(state.collectionOwnedKeysBySetCode[code] || null);
      }
      if (state.collectionOwnedLoading && state.collectionOwnedSyncInFlight === code) {
        return Promise.resolve(null);
      }
      state.collectionOwnedLoading = true;
      state.collectionOwnedSyncInFlight = code;
      return ensureCollectionItems()
        .then((items) => {
          state.collectionOwnedCheckedBySetCode[code] = true;
          if (!state.collectionUserItemsAvailable) {
            return null;
          }
          state.collectionOwnedKeysBySetCode[code] = buildOwnedKeysForSetFromItems(code, items);
          return state.collectionOwnedKeysBySetCode[code];
        })
        .finally(() => {
          state.collectionOwnedLoading = false;
          if (state.collectionOwnedSyncInFlight === code) {
            state.collectionOwnedSyncInFlight = "";
          }
        });
    }

    function ensureCardAddButton(shell) {
      if (!shell || shell.querySelector(".card-add-btn")) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "card-add-btn";
      btn.setAttribute("data-add-to-collection", "");
      btn.setAttribute("aria-label", "Add to collection");
      btn.setAttribute("title", "Add to collection");
      btn.textContent = "+";
      shell.appendChild(btn);
    }

    async function handleAddCardToCollection(addBtn, setCode, cardNo, allCards) {
      const code = String(setCode || "").toUpperCase();
      const card = findCardInSet(allCards, cardNo);
      if (!code || !card) return;
      const flightKey = `${code}:${card.cardNo}`;
      if (state.collectionAddInFlight === flightKey) return;

      if (!isCollectionSignedIn()) {
        window.InfinityAccount?.openSignIn?.();
        return;
      }

      state.collectionAddInFlight = flightKey;
      addBtn.disabled = true;
      try {
        const res = await fetch("/api/items", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "single",
            name: getCardDisplayName(card),
            setName: card.setName || "",
            cardNumber: card.cardNo,
            quantity: 1,
            setCode: code,
            setLanguage: state.language === "japanese" ? "japanese" : "english",
            imageUrl: card.imageUrl || ""
          })
        });
        const payload = res.ok ? await res.json().catch(() => ({})) : null;
        if (!res.ok) {
          window.alert(payload && payload.error ? String(payload.error) : `Could not add card (${res.status})`);
          return;
        }
        if (payload && payload.item) {
          state.collectionUserItemsAvailable = true;
          appendCardToCollectionCache(payload.item);
        }
        patchCollectionOwnedUI(code, allCards);
      } catch {
        window.alert("Network error while adding the card.");
      } finally {
        state.collectionAddInFlight = "";
        addBtn.disabled = false;
      }
    }

    function initCollectionAddDelegation() {
      const content = document.getElementById("content");
      if (!content || content.dataset.collectionAddDelegation === "1") return;
      content.dataset.collectionAddDelegation = "1";
      content.addEventListener("click", (event) => {
        const addBtn = event.target.closest("[data-add-to-collection]");
        if (!addBtn) return;
        const shell = addBtn.closest(".card-tile-shell[data-card-number]");
        if (!shell || !shell.closest(".set-detail")) return;
        event.preventDefault();
        event.stopPropagation();
        if (!state.selectedSetCode || state.selectedCardNumber) return;
        const setEntry = getSetByCode(state.selectedSetCode);
        if (!setEntry) return;
        const setConfig = detailedSetConfigs[setEntry.code];
        const allCards = getSetCards(setEntry, setConfig);
        void handleAddCardToCollection(addBtn, setEntry.code, shell.getAttribute("data-card-number") || "", allCards);
      });
    }

    function patchCollectionOwnedUI(setCode, allCards) {
      const code = String(setCode || "").toUpperCase();
      const cards = Array.isArray(allCards) ? allCards : [];
      if (!code) return;

      const signedIn = isCollectionSignedIn() && state.collectionUserItemsAvailable !== false;
      const ownedKeys = state.collectionOwnedKeysBySetCode[code] || new Set();
      const ownershipReady = Boolean(state.collectionOwnedCheckedBySetCode[code]);

      if (signedIn && ownershipReady) {
        const ownedInSet = cards.filter((card) => isCardOwnedInCollection(card, ownedKeys)).length;
        const needInSet = Math.max(0, cards.length - ownedInSet);
        let banner = document.getElementById("collectionOwnedBanner");
        if (!banner) {
          const anchor = document.querySelector(".set-detail .sub");
          if (anchor) {
            banner = document.createElement("div");
            banner.id = "collectionOwnedBanner";
            banner.className = "collection-owned-banner";
            banner.setAttribute("role", "status");
            anchor.insertAdjacentElement("afterend", banner);
          }
        }
        if (banner) {
          banner.innerHTML = `You own <strong>${ownedInSet.toLocaleString()}</strong> of <strong>${cards.length.toLocaleString()}</strong> cards in this set${
            needInSet > 0
              ? ` and need <strong>${needInSet.toLocaleString()}</strong> more`
              : ownedInSet > 0
                ? " — complete set!"
                : ""
          }. <span class="hint"> Green border = in your collection. Use <strong>+</strong> to add cards you are missing.</span>`;
        }
      } else {
        document.getElementById("collectionOwnedBanner")?.remove();
      }

      document.querySelectorAll(".set-detail .card-tile-shell[data-card-number]").forEach((shell) => {
        const cardNo = shell.getAttribute("data-card-number") || "";
        const tile = shell.querySelector(".card-tile");
        if (!signedIn) {
          shell.classList.remove("card-tile-shell--owned");
          tile?.removeAttribute("title");
          shell.querySelector(".card-owned-chip")?.remove();
          shell.querySelector(".card-add-btn")?.remove();
          return;
        }

        const owned = ownershipReady && isCardOwnedInCollection({ cardNo, label: `#${cardNo}` }, ownedKeys);
        shell.classList.toggle("card-tile-shell--owned", owned);
        if (owned) {
          tile?.setAttribute("title", "In your collection");
          shell.querySelector(".card-add-btn")?.remove();
          if (!shell.querySelector(".card-owned-chip")) {
            const chip = document.createElement("span");
            chip.className = "card-owned-chip";
            chip.textContent = "In your collection";
            if (tile) tile.insertBefore(chip, tile.firstChild);
            else shell.insertBefore(chip, shell.firstChild);
          }
        } else {
          tile?.removeAttribute("title");
          shell.querySelector(".card-owned-chip")?.remove();
          ensureCardAddButton(shell);
        }
      });
    }

    function queueCollectionOwnedPatch(setCode, allCards) {
      const code = String(setCode || "").toUpperCase();
      if (!code) return;
      const token = ++state.collectionOwnedPatchToken;
      void syncCollectionOwnedForSet(code).then(() => {
        if (token !== state.collectionOwnedPatchToken) return;
        if (state.selectedSetCode !== code || state.selectedCardNumber) return;
        patchCollectionOwnedUI(code, allCards);
      });
    }

    function renderSelectedSetDetail() {
      try {
        renderSelectedSetDetailInner();
      } catch (err) {
        console.error("[sets] renderSelectedSetDetail failed:", err);
        const content = document.getElementById("content");
        if (content) {
          content.innerHTML = `<div class="card-meta" style="padding:16px;">Could not display this set. Try refreshing the page.</div>`;
        }
      }
    }

    function renderSelectedSetDetailInner() {
      if (setDetailRenderLock) {
        setDetailRenderPending = true;
        return;
      }
      setDetailRenderLock = true;
      setDetailRenderPending = false;
      try {
      const selectedSet = getSetByCode(state.selectedSetCode);
      const setConfig = selectedSet ? detailedSetConfigs[selectedSet.code] : null;
      if (!selectedSet) {
        state.selectedSetCode = null;
        state.selectedSetName = "";
        renderAll();
        return;
      }
      const content = document.getElementById("content");
      const allCards = getSetCards(selectedSet, setConfig);
      if (!allCards.length) {
        if (state.cardManifestLoadingBySetCode[selectedSet.code]) {
          content.innerHTML = `<div class="card-meta" style="padding:16px;">Loading cards…</div>`;
          return;
        }
        state.selectedSetCode = null;
        state.selectedSetName = "";
        renderAll();
        return;
      }
      const illustrators = getSetIllustrators(allCards);
      if (state.setArtistFilter !== "all" && !illustrators.includes(state.setArtistFilter)) {
        state.setArtistFilter = "all";
      }
      const rarities = getSetRarities(allCards);
      if (state.setRarityFilter !== "all" && !rarities.includes(state.setRarityFilter)) {
        state.setRarityFilter = "all";
      }
      const activeArtist = state.setArtistFilter !== "all" ? state.setArtistFilter : "";
      const activeRarity = state.setRarityFilter !== "all" ? state.setRarityFilter : "";
      const sortedCards = getSortedCards(allCards);
      const artistFilteredCards = activeArtist
        ? sortedCards.filter((card) => getCardIllustrator(card) === activeArtist)
        : sortedCards;
      const rarityFilteredCards = activeRarity
        ? artistFilteredCards.filter((card) => getCardRarity(card) === activeRarity)
        : artistFilteredCards;
      if (!setHasShinyVaultFilter(selectedSet.code)) {
        state.setShinyVaultOnly = false;
      }
      const vaultFilteredCards = applySetShinyVaultFilter(rarityFilteredCards, selectedSet.code);
      const visibleCards = filterCardsBySetQuery(vaultFilteredCards, state.setCardQuery);
      const setCodeKey = String(selectedSet.code || "").toUpperCase();
      if (lastPrimedSetCode !== setCodeKey) {
        lastPrimedSetCode = setCodeKey;
        primeActiveSetPrices(selectedSet.code, selectedSet.name);
      }
      const countLabel = `${visibleCards.length}/${vaultFilteredCards.length} cards`;
      const cardsSummaryLabel = `${allCards.length} total`;
      const releaseLabel = formatReleaseDate(selectedSet.releaseDate);
      const mostExpensive = getMostExpensiveCardInSet(allCards);
      const mostExpensivePriceLabel = formatUsd(mostExpensive.price) || "N/A";
      const mostExpensiveCardLink = mostExpensive.card
        ? `<button type="button" id="mostExpensiveCardLink" class="set-stat-sub-link">${escapeHtml(String(getCardDisplayName(mostExpensive.card) || mostExpensive.card.label || "Open card"))}</button>`
        : "";
      const fullSetValue = getFullSetMarketValue(allCards);
      const fullSetValueLabel = formatUsd(fullSetValue.total) || "N/A";
      const numberSortActive = state.setSort === "number" || state.setSort === "number-desc";
      const numberSortArrow = state.setSort === "number-desc" ? "▼" : "▲";
      const nameSortActive = state.setSort === "name" || state.setSort === "name-desc";
      const nameSortArrow = state.setSort === "name-desc" ? "▼" : "▲";
      const priceSortActive = state.setSort === "price" || state.setSort === "price-desc";
      const priceSortArrow = state.setSort === "price-desc" ? "▼" : "▲";

      const cardsMarkup = renderSetCardsGridMarkup(visibleCards);

      const setCoverUrl = resolveSetImage(selectedSet);
      const setCoverFallback = getBulbaFallbackImage(selectedSet.code);
      const setCoverAlt = `${selectedSet.name} cover image`;
      const detailZoomClass =
        selectedSet.code === "BS" || selectedSet.code === "BS-1ST" || selectedSet.code === "BS-SHADOWLESS"
          ? " set-detail-cover--zoom-cover"
          : selectedSet.code === "HSP"
            ? " set-detail-cover--blank-bg"
            : "";
      const firstSetStatMarkup = setCoverUrl
        ? `<div class="set-stat set-stat--cover">
            <img class="set-detail-cover${detailZoomClass}" src="${escapeHtml(setCoverUrl)}" alt="${escapeHtml(setCoverAlt)}" loading="lazy"${
              setCoverFallback && setCoverFallback !== setCoverUrl
                ? ` onerror="this.onerror=null;this.src='${escapeHtml(setCoverFallback)}'"`
                : ""
            } />
          </div>`
        : `<div class="set-stat">
            <div class="set-stat-label">Set Name</div>
            <div class="set-stat-value">${escapeHtml(selectedSet.name)}</div>
          </div>`;

      content.innerHTML = `
        <article class="set-detail">
          <div class="set-banner">
            <div class="set-stats-grid">
              ${firstSetStatMarkup}
              <div class="set-stat">
                <div class="set-stat-label">Series</div>
                <div class="set-stat-value">${escapeHtml(selectedSet.era || "N/A")}</div>
              </div>
              <div class="set-stat">
                <div class="set-stat-label">Release Date</div>
                <div class="set-stat-value">${escapeHtml(releaseLabel)}</div>
              </div>
              <div class="set-stat">
                <div class="set-stat-label">Cards</div>
                <div class="set-stat-value">${escapeHtml(cardsSummaryLabel)}</div>
              </div>
              <div class="set-stat">
                <div class="set-stat-label">Most Expensive Card</div>
                <div class="set-stat-value">${escapeHtml(mostExpensivePriceLabel)}</div>
                ${mostExpensiveCardLink}
              </div>
              <div class="set-stat">
                <div class="set-stat-label">Full Set Market Value</div>
                <div class="set-stat-value accent">${escapeHtml(fullSetValueLabel)}</div>
              </div>
            </div>
            <div class="set-filter-row">
              <div class="set-filter-tabs set-filter-tabs--set-toolbar">
                ${
                  setHasShinyVaultFilter(selectedSet.code)
                    ? `<button type="button" id="setShinyVaultFilterBtn" class="set-filter-tab${state.setShinyVaultOnly ? " active" : ""}" aria-pressed="${state.setShinyVaultOnly ? "true" : "false"}">Shiny Vault</button>`
                    : ""
                }
                <button type="button" id="setInlineNumberSortBtn" class="set-filter-tab ${numberSortActive ? "active" : ""}">
                  Number ${numberSortActive ? numberSortArrow : ""}
                </button>
                <button type="button" class="set-filter-tab ${nameSortActive ? "active" : ""}" data-sort-mode="name">Name ${nameSortActive ? nameSortArrow : ""}</button>
                <div class="artist-menu-wrap">
                  <button
                    id="rarityMenuBtn"
                    type="button"
                    class="set-filter-tab ${state.setRarityMenuOpen || state.setRarityFilter !== "all" ? "active" : ""}"
                  >
                    Rarity
                  </button>
                  ${state.setRarityMenuOpen ? `
                    <select id="rarityFilterSelect" class="set-detail-select artist-filter-dropdown" title="Filter by rarity" size="${Math.max(4, rarities.length + 1)}">
                      <option value="all" ${state.setRarityFilter === "all" ? "selected" : ""}>All</option>
                      ${rarities.map((rarity) => `
                        <option value="${escapeHtml(rarity)}" ${state.setRarityFilter === rarity ? "selected" : ""}>
                          ${escapeHtml(rarity)}
                        </option>
                      `).join("")}
                    </select>
                  ` : ""}
                </div>
                <select id="setInlineArtistSelect" class="set-filter-artist-select" title="Filter by illustrator" aria-label="Artists">
                  <option value="all" ${state.setArtistFilter === "all" ? "selected" : ""}>Artists</option>
                  ${illustrators.map((artist) => `
                    <option value="${escapeHtml(artist)}" ${state.setArtistFilter === artist ? "selected" : ""}>
                      ${escapeHtml(artist)}
                    </option>
                  `).join("")}
                </select>
                <button type="button" class="set-filter-tab ${priceSortActive ? "active" : ""}" data-sort-mode="price">Price ${priceSortActive ? priceSortArrow : ""}</button>
                <button id="backToSets" type="button" class="set-filter-tab">Back to Sets</button>
              </div>
            </div>
          </div>
          <div class="sub">${countLabel}${state.setShinyVaultOnly && setHasShinyVaultFilter(selectedSet.code) ? " · Shiny Vault only" : ""} · sorted by ${
            state.setSort === "name"
              ? "name (A-Z)"
              : state.setSort === "name-desc"
                ? "name (Z-A)"
                : state.setSort === "price"
                  ? "price (low-high)"
                  : state.setSort === "price-desc"
                    ? "price (high-low)"
                : "number"
          }</div>
          ${cardsMarkup}
        </article>
      `;

      state.collectionOwnedPatchToken += 1;
      document.getElementById("collectionOwnedBanner")?.remove();
      if (isCollectionSignedIn()) {
        patchCollectionOwnedUI(selectedSet.code, allCards);
      }
      queueCollectionOwnedPatch(selectedSet.code, allCards);

      document.getElementById("backToSets").addEventListener("click", () => {
        exitSelectedSetToCatalog();
      });

      const setShinyVaultFilterBtn = document.getElementById("setShinyVaultFilterBtn");
      if (setShinyVaultFilterBtn) {
        setShinyVaultFilterBtn.addEventListener("click", () => {
          state.setShinyVaultOnly = !state.setShinyVaultOnly;
          state.setRarityMenuOpen = false;
          renderSelectedSetDetail();
        });
      }

      const setInlineNumberSortBtn = document.getElementById("setInlineNumberSortBtn");
      if (setInlineNumberSortBtn) {
        setInlineNumberSortBtn.addEventListener("click", () => {
          if (
            state.setSort === "name" ||
            state.setSort === "name-desc" ||
            state.setSort === "price" ||
            state.setSort === "price-desc"
          ) {
            state.setSort = "number";
          } else {
            state.setSort = state.setSort === "number" ? "number-desc" : "number";
          }
          state.setRarityMenuOpen = false;
          renderSelectedSetDetail();
        });
      }

      const setInlineArtistSelect = document.getElementById("setInlineArtistSelect");
      if (setInlineArtistSelect) {
        setInlineArtistSelect.addEventListener("change", (event) => {
          state.setArtistFilter = event.target.value || "all";
          renderSelectedSetDetail();
        });
        setInlineArtistSelect.addEventListener("keydown", (event) => {
          handleSelectArrowKey(event, setInlineArtistSelect, (value) => {
            state.setArtistFilter = value || "all";
            renderSelectedSetDetail();
          });
        });
      }

      const mostExpensiveCardLinkEl = document.getElementById("mostExpensiveCardLink");
      if (mostExpensiveCardLinkEl && mostExpensive.card) {
        mostExpensiveCardLinkEl.addEventListener("click", () => {
          state.selectedCardNumber = mostExpensive.card.cardNo;
          renderCardPageDetail();
        });
      }

      content.querySelectorAll("[data-sort-mode]").forEach((node) => {
        node.addEventListener("click", () => {
          const mode = node.getAttribute("data-sort-mode");
          if (mode === "name") {
            state.setSort = state.setSort === "name" ? "name-desc" : "name";
            state.setRarityMenuOpen = false;
          } else if (mode === "price") {
            state.setSort = state.setSort === "price" ? "price-desc" : "price";
            state.setRarityMenuOpen = false;
          }
          renderSelectedSetDetail();
        });
      });

      const rarityMenuBtn = document.getElementById("rarityMenuBtn");
      if (rarityMenuBtn) {
        rarityMenuBtn.addEventListener("click", () => {
          state.setRarityMenuOpen = !state.setRarityMenuOpen;
          renderSelectedSetDetail();
        });
      }

      const rarityFilterSelect = document.getElementById("rarityFilterSelect");
      if (rarityFilterSelect) {
        rarityFilterSelect.addEventListener("change", (event) => {
          state.setRarityFilter = event.target.value || "all";
          state.setRarityMenuOpen = false;
          renderSelectedSetDetail();
        });
      }

      content.querySelectorAll(".set-detail .card-tile-shell[data-card-number] .card-tile").forEach((node) => {
        node.addEventListener("click", () => {
          const shell = node.closest(".card-tile-shell[data-card-number]");
          state.catalogBrowseReturnSnapshot = null;
          state.savedSetGridScrollY = window.scrollY;
          state.selectedCardNumber = shell?.getAttribute("data-card-number") || null;
          scrollToPageTop();
          renderAll();
        });
      });
      } finally {
        setDetailRenderLock = false;
        updateSetsCardSky();
        if (setDetailRenderPending) {
          setDetailRenderPending = false;
          renderSelectedSetDetailInner();
        }
      }
    }

    function canOpenSet(setCode) {
      if (detailedSetConfigs[setCode]) return true;
      if (Object.keys(state.cardNamesBySetCode[setCode] || {}).length > 0) return true;
      return Boolean(getSetByCode(setCode));
    }

    function collectGlobalCardMatches(query) {
      const normalizedQuery = normalize(String(query || "").trim());
      if (!normalizedQuery) return [];
      rebuildCatalogSearchIndexIfNeeded();
      const seen = new Set();
      const matches = [];

      for (const entry of getNicknameEntriesForQuery(query)) {
        const card = resolveCardFromNicknameEntry(entry);
        if (!card) continue;
        const key = `${card.setCode}:${card.cardNo}`;
        if (seen.has(key)) continue;
        seen.add(key);
        matches.push(card);
      }

      for (const card of catalogSearchIndex.cards) {
        if (!card._haystack.includes(normalizedQuery)) continue;
        const key = `${card.setCode}:${card.cardNo}`;
        if (seen.has(key)) continue;
        seen.add(key);
        matches.push(card);
      }

      return matches;
    }

    function applyCatalogSearchFilters(matches) {
      let list = matches;
      if (state.catalogArtistFilter !== "all") {
        list = list.filter((c) => getCardIllustrator(c) === state.catalogArtistFilter);
      }
      if (state.eraFilter !== "all") {
        list = list.filter((c) => c.era === state.eraFilter);
      }
      return list;
    }

    function renderEraSidebar() {
      const eraList = document.getElementById("eraList");
      const eras = Object.keys(setsByEra[state.language]);
      const buttons = [
        { key: "all", label: "All Eras" },
        ...eras.map((era) => ({ key: era, label: era }))
      ];

      eraList.innerHTML = buttons.map((btn) => `
        <li>
          <button type="button" data-era="${btn.key}" class="${state.eraFilter === btn.key ? "active" : ""}">
            ${btn.label}
          </button>
        </li>
      `).join("");

      eraList.querySelectorAll("button[data-era]").forEach((button) => {
        button.addEventListener("click", () => {
          state.eraFilter = button.dataset.era;
          scrollToPageTop();
          renderAll();
        });
      });
    }

    function disposeBodyImageZoomOverlay() {
      const el = document.getElementById("imageZoomOverlay");
      if (el && el.parentElement === document.body) el.remove();
    }

    function bindCatalogSearchResultTiles(content) {
      content.querySelectorAll("[data-set-code][data-card-number]").forEach((node) => {
        node.addEventListener("click", () => {
          state.catalogBrowseReturnSnapshot = {
            scrollY: window.scrollY,
            query: state.query,
            catalogArtistFilter: state.catalogArtistFilter,
            eraFilter: state.eraFilter,
            globalSearchSortMode: state.globalSearchSortMode,
            globalSearchSetOrder: state.globalSearchSetOrder,
            globalSearchCardNumberOrder: state.globalSearchCardNumberOrder
          };
          state.savedSetGridScrollY = null;
          const code = node.dataset.setCode || "";
          void openSetView(code, "", { cardNumber: node.dataset.cardNumber || null });
        });
      });
    }

    function renderContent() {
      disposeBodyImageZoomOverlay();
      state.catalogSearchPreviewMatches = null;
      if (state.selectedSetCode && state.selectedCardNumber) {
        renderCardPageDetail();
        return;
      }

      if (state.selectedSetCode) {
        renderSelectedSetDetail();
        return;
      }

      const content = document.getElementById("content");
      const eraSuffix = state.eraFilter !== "all" ? ` · ${escapeHtml(state.eraFilter)}` : "";

      if (state.query.trim()) {
        const matches = getCatalogSearchMatches(state.query);
        const displayMatches = matches.slice(0, CATALOG_SEARCH_DISPLAY_LIMIT);
        const truncated = matches.length > displayMatches.length;
        state.catalogSearchPreviewMatches = matches;
        content.innerHTML = `
          <article class="era-block">
            <h2 class="era-title">Search Results</h2>
            <div class="sub" style="margin-bottom:10px;">${escapeHtml(String(matches.length))} cards for "${escapeHtml(state.query.trim())}"${eraSuffix}${
              truncated
                ? ` · showing first ${escapeHtml(String(displayMatches.length))} (refine search to narrow)`
                : ""
            }</div>
            ${
              displayMatches.length
                ? `<div class="cards-grid">
                    ${displayMatches.map((card) => `
                      <button
                        type="button"
                        class="card-tile"
                        data-set-code="${escapeHtml(card.setCode)}"
                        data-card-number="${escapeHtml(card.cardNo)}"
                      >
                        ${card.imageUrl
                          ? `<img class="card-thumb" src="${escapeHtml(card.imageUrl)}" alt="${escapeHtml(getCardDisplayName(card))}" loading="lazy" />`
                          : `<div class="card-thumb placeholder">No image</div>`}
                        <div>${renderCardName(card)}</div>
                        <div class="card-meta">${escapeHtml(card.setName)} (${escapeHtml(card.setCode)}) · ${escapeHtml(card.label)}</div>
                      </button>
                    `).join("")}
                  </div>`
                : `<div class="card-meta">No cards found.</div>`
            }
          </article>
        `;

        bindCatalogSearchResultTiles(content);
        return;
      }

      if (state.catalogArtistFilter !== "all") {
        const baseMatches = collectAllCatalogCards();
        const matches = applyCatalogSearchFilters(baseMatches);
        sortGlobalSearchMatches(matches);
        state.catalogSearchPreviewMatches = matches;
        const artistLabel = escapeHtml(state.catalogArtistFilter);
        content.innerHTML = `
          <article class="era-block">
            <h2 class="era-title">Artists</h2>
            <div class="sub" style="margin-bottom:10px;">${escapeHtml(String(matches.length))} cards · ${artistLabel}${eraSuffix}</div>
            ${
              matches.length
                ? `<div class="cards-grid">
                    ${matches.map((card) => `
                      <button
                        type="button"
                        class="card-tile"
                        data-set-code="${escapeHtml(card.setCode)}"
                        data-card-number="${escapeHtml(card.cardNo)}"
                      >
                        ${card.imageUrl
                          ? `<img class="card-thumb" src="${escapeHtml(card.imageUrl)}" alt="${escapeHtml(getCardDisplayName(card))}" loading="lazy" />`
                          : `<div class="card-thumb placeholder">No image</div>`}
                        <div>${renderCardName(card)}</div>
                        <div class="card-meta">${escapeHtml(card.setName)} (${escapeHtml(card.setCode)}) · ${escapeHtml(card.label)}</div>
                      </button>
                    `).join("")}
                  </div>`
                : `<div class="card-meta">No cards found for this illustrator.</div>`
            }
          </article>
        `;

        bindCatalogSearchResultTiles(content);
        return;
      }

      const eraEntries = Object.entries(setsByEra[state.language]);
      const filteredEras = eraEntries.filter(([era]) => state.eraFilter === "all" || era === state.eraFilter);

      const blocks = filteredEras.map(([era, sets]) => {
        const filteredSets = sets.filter((setEntry) => matchesQuery(`${setEntry.name} ${setEntry.code}`, state.query));
        if (!filteredSets.length) return "";
        return `
          <article class="era-block">
            <h2 class="era-title">${era}</h2>
            <div class="sets-grid">
              ${filteredSets.map((setEntry, setIndex) => {
                const imageUrl = resolveSetImage(setEntry);
                const fallbackImageUrl = resolveSetCoverFallbackUrl(setEntry);
                const symbolUrl = resolveSetSymbolUrl(setEntry.code);
                const alt = `${setEntry.name} cover image`;
                const zoomCoverClass =
                  setEntry.code === "BS" ? " set-image--zoom-cover" : setEntry.code === "HSP" ? " set-image--blank-bg" : "";
                const eagerLoad = setIndex < 24 ? ' loading="eager" fetchpriority="high"' : ' loading="lazy"';
                const visual = imageUrl
                  ? `<img class="set-image${zoomCoverClass}" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(alt)}" decoding="async"${eagerLoad}${
                    fallbackImageUrl && fallbackImageUrl !== imageUrl
                      ? ` onerror="this.onerror=null;this.src='${escapeHtml(fallbackImageUrl)}'"`
                      : ""
                  } />`
                  : `<div class="set-image placeholder">No image</div>`;
                const symbolLoad = setIndex < 24 ? ' loading="eager" fetchpriority="high"' : ' loading="lazy"';
                const symbolBadge = symbolUrl
                  ? `<div class="set-symbol-row"><img class="set-symbol-image" src="${escapeHtml(symbolUrl)}" alt="${escapeHtml(`${setEntry.name} set symbol`)}" decoding="async" width="24" height="24"${symbolLoad} /></div>`
                  : `<div class="set-symbol-row"></div>`;
                return `
                <a href="#" class="set-card" data-set-code="${escapeHtml(setEntry.code)}" data-set-name="${escapeHtml(setEntry.name)}">
                  ${visual}
                  <h3 class="set-name">${escapeHtml(setEntry.name)}</h3>
                  ${symbolBadge}
                  <div class="set-meta">${symbolUrl ? "" : escapeHtml(setEntry.code)}</div>
                </a>
              `;
              }).join("")}
            </div>
          </article>
        `;
      }).join("");

      content.innerHTML = blocks || `<article class="era-block"><h2 class="era-title">No sets found</h2></article>`;

      content.querySelectorAll(".set-card[data-set-code]").forEach((node) => {
        node.addEventListener("click", (event) => {
          event.preventDefault();
          const code = node.dataset.setCode || "";
          const name = node.dataset.setName || "";
          if (!canOpenSet(code)) return;
          state.catalogBrowseReturnSnapshot = null;
          state.savedSetsCatalogScrollY = window.scrollY;
          void openSetView(code, name);
        });
      });
    }

    function imageUrlDedupeKey(url) {
      const raw = String(url || "").trim();
      if (!raw) return "";
      try {
        if (raw.startsWith("http://") || raw.startsWith("https://")) {
          const u = new URL(raw);
          u.search = "";
          u.hash = "";
          return u.href;
        }
        const u = new URL(raw, window.location.origin);
        u.search = "";
        u.hash = "";
        return u.pathname || raw;
      } catch {
        return raw.split("?")[0].split("#")[0];
      }
    }

    function collectCardFlyingImageUrlsFromMatches(matches) {
      const urls = [];
      const seen = new Set();
      for (const card of matches || []) {
        const s = String(card && card.imageUrl ? card.imageUrl : "").trim();
        if (!s) continue;
        if (state.language === "english" && s.includes("card-images-japanese")) continue;
        if (
          !(
            s.startsWith("/card-images/") ||
            s.startsWith("/card-images-japanese/") ||
            s.startsWith("https://") ||
            s.startsWith("http://")
          )
        ) {
          continue;
        }
        const key = imageUrlDedupeKey(s);
        if (!key || seen.has(key)) continue;
        seen.add(key);
        urls.push(s);
      }
      return urls;
    }

    function collectSetsFlyingImageUrls(setCodes) {
      const filter =
        setCodes == null ? null : new Set(setCodes.map((c) => String(c || "").toUpperCase()).filter(Boolean));
      if (filter && filter.size === 0) return [];
      const urls = [];
      const imagesByCode = state.cardImagesBySetCode || {};
      for (const [code, byNumber] of Object.entries(imagesByCode)) {
        const codeKey = String(code).toUpperCase();
        if (filter && !filter.has(codeKey)) continue;
        for (const src of Object.values(byNumber || {})) {
          const s = String(src || "").trim();
          if (!s) continue;
          if (state.language === "english" && s.includes("card-images-japanese")) continue;
          if (s.startsWith("/card-images/") || s.startsWith("/card-images-japanese/")) {
            urls.push(s);
            continue;
          }
          if (s.startsWith("https://") || s.startsWith("http://")) {
            urls.push(s);
          }
        }
      }
      return [...new Set(urls)];
    }

    async function fetchSetsCardSkyUrlsFromDisk(setCodes) {
      // Random ~500 per visit; refresh / new page load reshuffles via no-store.
      const params = new URLSearchParams({ limit: "500", localOnly: "1" });
      if (setCodes && setCodes.length) {
        params.set(
          "setCodes",
          setCodes.map((c) => String(c || "").toUpperCase()).filter(Boolean).join(",")
        );
      }
      const res = await fetch(`/api/sets/card-sky-urls?${params.toString()}`, { cache: "no-store" });
      if (!res.ok) return [];
      const payload = await res.json();
      return payload && Array.isArray(payload.urls) ? payload.urls : [];
    }

    function getSetsFlyingSetCodesFilter() {
      if (state.selectedSetCode) {
        return [String(state.selectedSetCode).toUpperCase()];
      }
      if (state.eraFilter !== "all") {
        const languageSets = setsByEra[state.language] || {};
        const list = languageSets[state.eraFilter];
        if (!Array.isArray(list) || !list.length) return [];
        return list.map((e) => e && e.code).filter(Boolean);
      }
      return null;
    }

    function collectFlyingUrlsForSelectedSet() {
      const code = String(state.selectedSetCode || "").toUpperCase();
      if (!code) return [];
      const setEntry = getSetByCode(code);
      if (!setEntry) return [];
      const setConfig = detailedSetConfigs[code] || null;
      const allCards = getSetCards(setEntry, setConfig);
      const activeArtist = state.setArtistFilter !== "all" ? state.setArtistFilter : "";
      const activeRarity = state.setRarityFilter !== "all" ? state.setRarityFilter : "";
      let cards = getSortedCards(allCards);
      if (activeArtist) {
        cards = cards.filter((card) => getCardIllustrator(card) === activeArtist);
      }
      if (activeRarity) {
        cards = cards.filter((card) => getCardRarity(card) === activeRarity);
      }
      cards = applySetShinyVaultFilter(cards, code);
      if (String(state.setCardQuery || "").trim()) {
        cards = filterCardsBySetQuery(cards, state.setCardQuery);
      }
      return collectCardFlyingImageUrlsFromMatches(cards);
    }

    function getSetsCardSkySignature(urls, catalogSearch) {
      const mode = catalogSearch ? "search" : "browse";
      const ctx = [
        state.language,
        state.selectedSetCode || "",
        state.selectedCardNumber || "",
        state.eraFilter,
        state.setArtistFilter,
        state.setRarityFilter,
        state.setShinyVaultOnly,
        state.catalogArtistFilter,
        String(state.query || "").trim(),
        String(state.setCardQuery || "").trim()
      ].join("|");
      const sample = urls.slice(0, 48).join("\u0001");
      return `${ctx}|${mode}|${urls.length}|${sample}`;
    }

    async function updateSetsCardSkyNow() {
      const startRecycler =
        typeof startInfinityCardSkyRecycler === "function" ? startInfinityCardSkyRecycler : null;
      const stopRecycler = typeof stopInfinityCardSkyRecycler === "function" ? stopInfinityCardSkyRecycler : null;
      const renderSky = typeof renderInfinityCardSky === "function" ? renderInfinityCardSky : null;
      if (!startRecycler && !renderSky) return;

      let urls = [];
      let catalogSearch = false;

      if (state.selectedSetCode) {
        urls = collectFlyingUrlsForSelectedSet();
        catalogSearch = true;
      } else if (String(state.query || "").trim()) {
        const baseMatches = collectGlobalCardMatches(state.query);
        const matches = applyCatalogSearchFilters(baseMatches);
        sortGlobalSearchMatches(matches);
        urls = collectCardFlyingImageUrlsFromMatches(matches);
        catalogSearch = true;
      } else if (state.catalogArtistFilter !== "all") {
        const baseMatches = collectAllCatalogCards();
        const matches = applyCatalogSearchFilters(baseMatches);
        sortGlobalSearchMatches(matches);
        urls = collectCardFlyingImageUrlsFromMatches(matches);
        catalogSearch = true;
      } else {
        const codes = getSetsFlyingSetCodesFilter();
        urls = await fetchSetsCardSkyUrlsFromDisk(codes);
        if (!urls.length) {
          urls = collectSetsFlyingImageUrls(codes);
        }
      }

      const signature = getSetsCardSkySignature(urls, catalogSearch);
      if (signature === setsCardSkySignature) return;
      setsCardSkySignature = signature;

      const skyOpts = catalogSearch ? { catalogSearch: true } : { homeSky: true };
      if (!urls.length) {
        if (stopRecycler) stopRecycler();
        else if (renderSky) renderSky([], skyOpts);
        return;
      }

      if (startRecycler) {
        startRecycler(urls, skyOpts);
      } else if (renderSky) {
        renderSky(urls, skyOpts);
      }
    }

    function updateSetsCardSky() {
      if (setsCardSkyTimer) clearTimeout(setsCardSkyTimer);
      setsCardSkyTimer = setTimeout(() => {
        setsCardSkyTimer = null;
        void updateSetsCardSkyNow();
      }, 300);
    }

    function renderAll() {
      const page = document.querySelector(".page");
      const layout = document.querySelector(".layout");
      const toolbar = document.querySelector(".toolbar");
      if (page) {
        page.classList.toggle("focused", Boolean(state.selectedSetCode));
      }
      if (layout) {
        layout.classList.toggle("focused", Boolean(state.selectedSetCode));
      }
      if (toolbar) {
        toolbar.classList.toggle("focused", Boolean(state.selectedSetCode));
      }

      const languageToggle = document.getElementById("languageToggle");
      if (languageToggle) languageToggle.hidden = !JAPANESE_CATALOG_ENABLED;

      document.getElementById("langEnglish").classList.toggle("active", state.language === "english");
      if (JAPANESE_CATALOG_ENABLED) {
        document.getElementById("langJapanese").classList.toggle("active", state.language === "japanese");
      }
      renderEraSidebar();
      updateGlobalArtistFilterSelect();
      renderContent();
      updateCatalogSearchControls();
      syncSearchInputsFromState();
      updateSetsCardSky();
    }

    function syncSearchInputsFromState() {
      const v = state.query == null ? "" : String(state.query);
      const top = document.getElementById("topSearch");
      const filter = document.getElementById("filterSearch");
      if (top) top.value = v;
      if (filter) filter.value = v;
    }

    document.getElementById("langEnglish").addEventListener("click", () => {
      clearCatalogSearchTimers();
      invalidateCatalogSearchIndex();
      state.language = "english";
      state.eraFilter = "all";
      state.selectedSetCode = null;
      state.selectedCardNumber = null;
      state.setCardQuery = "";
      state.catalogArtistFilter = "all";
      state.globalSearchSortMode = "set";
      state.globalSearchSetOrder = "asc";
      state.globalSearchCardNumberOrder = "asc";
      state.savedSetGridScrollY = null;
      state.savedSetsCatalogScrollY = null;
      state.catalogBrowseReturnSnapshot = null;
      loadSetCardManifest("english").finally(renderAll);
    });

    if (JAPANESE_CATALOG_ENABLED) {
      document.getElementById("langJapanese").addEventListener("click", () => {
        clearCatalogSearchTimers();
        invalidateCatalogSearchIndex();
        state.language = "japanese";
        state.eraFilter = "all";
        state.selectedSetCode = null;
        state.selectedCardNumber = null;
        state.setCardQuery = "";
        state.catalogArtistFilter = "all";
        state.globalSearchSortMode = "set";
        state.globalSearchSetOrder = "asc";
        state.globalSearchCardNumberOrder = "asc";
        state.savedSetGridScrollY = null;
        state.savedSetsCatalogScrollY = null;
        state.catalogBrowseReturnSnapshot = null;
        Promise.all([loadSetCatalog("japanese"), loadSetCardManifest("japanese")]).finally(renderAll);
      });
    }

    document.getElementById("filterSearch").addEventListener("input", (event) => {
      onCatalogSearchInput(event.target.value || "");
    });

    document.getElementById("topSearch").addEventListener("input", (event) => {
      onCatalogSearchInput(event.target.value || "");
    });

    const catalogSetSortBtn = document.getElementById("catalogSetSortBtn");
    if (catalogSetSortBtn) {
      catalogSetSortBtn.addEventListener("click", () => {
        state.globalSearchSortMode = "set";
        state.globalSearchSetOrder = state.globalSearchSetOrder === "asc" ? "desc" : "asc";
        renderAll();
      });
    }

    const catalogNumberSortBtn = document.getElementById("catalogNumberSortBtn");
    if (catalogNumberSortBtn) {
      catalogNumberSortBtn.addEventListener("click", () => {
        state.globalSearchSortMode = "number";
        state.globalSearchCardNumberOrder =
          state.globalSearchCardNumberOrder === "asc" ? "desc" : "asc";
        renderAll();
      });
    }

    const globalArtistFilterSelect = document.getElementById("globalArtistFilterSelect");
    if (globalArtistFilterSelect) {
      globalArtistFilterSelect.addEventListener("change", (event) => {
        state.catalogArtistFilter = event.target.value || "all";
        void ensureCatalogManifestLoaded().then(() => {
          scrollToPageTop();
          renderAll();
        });
      });
      globalArtistFilterSelect.addEventListener("keydown", (event) => {
        handleSelectArrowKey(event, globalArtistFilterSelect, (value) => {
          state.catalogArtistFilter = value || "all";
          void ensureCatalogManifestLoaded().then(() => {
            scrollToPageTop();
            renderAll();
          });
        });
      });
    }

    function handleSetsViewBackNavigation(event) {
      const target = event.target;
      if (target?.closest?.("a[href]")) return false;
      const tag = String(target?.tagName || "").toLowerCase();
      const isTypingField =
        Boolean(target?.isContentEditable) ||
        tag === "input" ||
        tag === "textarea" ||
        tag === "select";
      if (isTypingField) return false;

      const zoomOverlay = document.getElementById("imageZoomOverlay");
      if (zoomOverlay && zoomOverlay.classList.contains("open")) {
        event.preventDefault();
        event.stopImmediatePropagation();
        zoomOverlay.classList.remove("open");
        return true;
      }

      if (state.selectedCardNumber) {
        event.preventDefault();
        event.stopImmediatePropagation();
        state.selectedCardNumber = null;
        renderAll();
        restoreSavedSetGridScroll();
        return true;
      }

      if (state.selectedSetCode) {
        event.preventDefault();
        event.stopImmediatePropagation();
        if (state.catalogBrowseReturnSnapshot) {
          restoreCatalogBrowseFromSnapshot();
        } else {
          exitSelectedSetToCatalog();
        }
        return true;
      }

      return false;
    }

    window.__icSetsBackNavigation = handleSetsViewBackNavigation;

    document.addEventListener(
      "keydown",
      (event) => {
        if (event.defaultPrevented) return;
        const isBackspaceNav =
          event.key === "Backspace" && !event.altKey && !event.ctrlKey && !event.metaKey;
        const isAltLeft =
          event.key === "ArrowLeft" && event.altKey && !event.ctrlKey && !event.metaKey;
        if (!isBackspaceNav && !isAltLeft) return;
        handleSetsViewBackNavigation(event);
      },
      true
    );

    wireSetsBackNavigation();

    async function applySetsDeepLink() {
      const params = new URLSearchParams(window.location.search);
      const qParam = (params.get("q") || "").trim();
      if (qParam) {
        state.query = qParam;
        await ensureCatalogManifestLoaded();
      }
      const setCode = (params.get("set") || params.get("code") || "").trim().toUpperCase();
      if (!setCode && !qParam) return;
      if (!setCode) return;

      const cardNoParam = primaryCardNumberToken(
        (params.get("card") || params.get("cardNumber") || "").trim()
      );
      const langParam = (params.get("lang") || "").toLowerCase();
      const wantJa = langParam === "ja" || langParam === "jp" || langParam === "japanese";
      const showcaseReturn = String(params.get("showcase") || params.get("return") || "").trim();

      if (wantJa && JAPANESE_CATALOG_ENABLED) {
        if (state.language !== "japanese") {
          state.language = "japanese";
          state.eraFilter = "all";
          state.catalogArtistFilter = "all";
          state.selectedSetCode = null;
          state.selectedCardNumber = null;
          await Promise.all([loadSetCatalog("japanese"), ensureSetCardsLoaded(setCode, "japanese")]);
        }
      } else if (state.language !== "english") {
        state.language = "english";
        state.eraFilter = "all";
        state.catalogArtistFilter = "all";
        state.selectedSetCode = null;
        state.selectedCardNumber = null;
        await ensureSetCardsLoaded(setCode, "english");
      } else {
        await ensureSetCardsLoaded(setCode, "english");
      }

      const entry = getSetByCode(setCode);
      if (!entry || !canOpenSet(setCode)) return;

      const setConfig = detailedSetConfigs[setCode] || null;
      const cards = getSortedCards(getSetCards(entry, setConfig));
      const resolvedCard = cardNoParam ? findCardInSet(cards, cardNoParam) : null;

      state.catalogBrowseReturnSnapshot = null;
      state.selectedSetCode = setCode;
      state.selectedSetName = entry.name || "";
      state.selectedCardNumber = resolvedCard ? resolvedCard.cardNo : cardNoParam || null;
      state.setCardQuery = "";
      state.savedSetsCatalogScrollY = null;
      state.savedSetGridScrollY = null;
      state.showcaseReturnUrl = showcaseReturn || null;

      await ensureSetCardDetailsLoaded(setCode);
      if (resolvedCard && state.language === "english") {
        await ensureSetPricingLoaded(setCode, entry.name || "");
      }

      scrollToPageTop();
      renderAll();

      const urlParams = new URLSearchParams({ set: setCode });
      if (resolvedCard) urlParams.set("card", resolvedCard.cardNo);
      else if (cardNoParam) urlParams.set("card", cardNoParam);
      if (wantJa) urlParams.set("lang", "ja");
      if (showcaseReturn) urlParams.set("showcase", showcaseReturn);
      history.replaceState({}, "", `/sets.html?${urlParams.toString()}`);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible" || state.language !== "english") return;
      if (tcgVisibilitySyncTimer) clearTimeout(tcgVisibilitySyncTimer);
      tcgVisibilitySyncTimer = setTimeout(() => {
        tcgVisibilitySyncTimer = null;
        syncTcgLinkCacheGeneration().then(() => {
          if (!state.selectedSetCode) return;
          scheduleSetLinkPriceWarmup(state.selectedSetCode, state.selectedSetName);
        });
      }, 2500);
    });

    function applySetsCollectionAuth({ signedIn }) {
      state.collectionSignedIn = Boolean(signedIn);
      if (!signedIn) resetCollectionOwnershipState();
      if (state.selectedSetCode && !state.selectedCardNumber) {
        const setEntry = getSetByCode(state.selectedSetCode);
        if (!setEntry) return;
        const setConfig = detailedSetConfigs[setEntry.code];
        const allCards = getSetCards(setEntry, setConfig);
        if (signedIn) {
          delete state.collectionOwnedCheckedBySetCode[setEntry.code];
          queueCollectionOwnedPatch(setEntry.code, allCards);
        } else {
          patchCollectionOwnedUI(setEntry.code, allCards);
        }
      }
    }

    initCollectionAddDelegation();
    if (window.InfinityAccount) {
      window.InfinityAccount.onChange(applySetsCollectionAuth);
    } else {
      state.collectionSignedIn = false;
    }

    (async function bootstrapSetsPage() {
      renderAll();
      try {
        await Promise.all([
          loadPokesymbolsManifest(),
          loadSetImageManifest(),
          loadCardNicknames(),
          loadSetCatalog(state.language)
        ]);
        renderAll();
        await applySetsDeepLink();
        renderAll();
        if (state.language === "english") {
          void syncTcgLinkCacheGeneration();
          startTcgLinkCacheWatch();
        }
      } catch {
        renderAll();
      }
    })();
  </script>
  <script src="/account-ui.js"></script>
</body>
