      UL: "/set-images/UL-unleashed-cover.png",
      HS: "/set-images/HS-heartgold-soulsilver-cover.png",
      HSP: "/set-images/HSP-heartgold-soulsilver-promos-cover.png",
      SWSHP: "/set-images/SWSHP-sword-shield-promos-cover.png",
      SMP: "/set-images/SMP-sun-moon-promos-cover.png",
      BWP: "/set-images/BWP-black-white-promos-cover.png",
      MEP: "/set-images/MEP/cover.png",
      CL: "/set-images/CL-call-of-legends-cover.png",
      RS: "/set-images/RS-ruby-sapphire-cover.png",
      RG: "/set-images/RG/cover.png"
    };

    const localSetCoverNameOverridesByCode = {
      MEW: "151 (MEW)"
    };

    function getBulbaFallbackImage(setCode) {
      const row = state.pokesymbolsByCode[setCode];
      if (row && row.symbol) return row.symbol;
      return getBulbapediaExpansionLogoUrl(setCode) || getBulbapediaSymbolUrl(setCode) || "";
    }

    function getConventionalLocalSetCover(setEntry) {
      const baseName = localSetCoverNameOverridesByCode[setEntry.code] || `${setEntry.name} (${setEntry.code})`;
      return `/set-images/${encodeURIComponent(`${baseName}.png`)}`;
    }

    function matchesQuery(value, query) {
      if (!query) return true;
      return normalize(value).includes(normalize(query));
    }

    function normalizeNicknameQuery(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function nicknameQueryMatchesText(nicknameKey, queryKey) {
      if (!nicknameKey || !queryKey) return false;
      if (nicknameKey === queryKey) return true;
      if (queryKey.length < 3) return false;
      return nicknameKey.includes(queryKey) || queryKey.includes(nicknameKey);
    }

    function cardNumberMatchesTarget(cardNo, targetNo) {
      const left = cardNumberLookupKeys(cardNo);
      const right = new Set(cardNumberLookupKeys(targetNo));
      return left.some((key) => right.has(key));
    }

    function getNicknameEntriesForQuery(query) {
      const queryKey = normalizeNicknameQuery(query);
      if (!queryKey) return [];
      const exact = [];
      const partial = [];
      for (const entry of state.cardNicknames || []) {
        const nickKey = normalizeNicknameQuery(entry.nickname);
        if (!nickKey) continue;
        if (nickKey === queryKey) exact.push(entry);
        else if (nicknameQueryMatchesText(nickKey, queryKey)) partial.push(entry);
      }
      return [...exact, ...partial];
    }

    function cardMatchesNicknameQuery(card, query) {
      const lang = state.language === "japanese" ? "japanese" : "english";
      for (const entry of getNicknameEntriesForQuery(query)) {
        if ((entry.language || "english") !== lang) continue;
        if (String(entry.setCode || "").toUpperCase() !== String(card.setCode || "").toUpperCase()) continue;
        if (cardNumberMatchesTarget(card.cardNo, entry.cardNumber)) return true;
      }
      return false;
    }

    function resolveCardFromNicknameEntry(entry) {
      if (!entry) return null;
      const setCode = String(entry.setCode || "").toUpperCase();
      const language = entry.language === "japanese" ? "japanese" : "english";
      if (language !== state.language) return null;
      const setEntry = getSetByCode(setCode);
      if (!setEntry) return null;
      const setConfig = detailedSetConfigs[setCode] || null;
      const cards = getSetCards(setEntry, setConfig);
      const card = findCardInSet(cards, entry.cardNumber);
      if (!card) return null;
      return { era: setEntry.era, ...card };
    }

    function cardMatchesSearchQuery(card, query) {
      const q = String(query || "").trim();
      if (!q) return true;
      if (cardMatchesNicknameQuery(card, q)) return true;
      if (matchesQuery(getCardDisplayName(card), q)) return true;
      if (matchesQuery(`${card.label} ${card.cardNo}`, q)) return true;
      if (matchesQuery(getCardIllustrator(card), q)) return true;
      return false;
    }

    async function loadCardNicknames() {
      try {
        const response = await fetch("/api/card-nicknames");
        if (!response.ok) {
          state.cardNicknames = [];
          return;
        }
        const payload = await response.json();
        state.cardNicknames = Array.isArray(payload?.nicknames) ? payload.nicknames : [];
      } catch {
        state.cardNicknames = [];
      }
    }

    function updateCatalogSearchControls() {
      const bar = document.getElementById("catalogSearchFieldBar");
      const setBtn = document.getElementById("catalogSetSortBtn");
      const numBtn = document.getElementById("catalogNumberSortBtn");
      if (!bar || !setBtn || !numBtn) return;
      const q = state.query.trim();
      const artistOn = state.catalogArtistFilter !== "all";
      if (!q && !artistOn) {
        bar.hidden = true;
        return;
      }
      bar.hidden = false;
      const setActive = state.globalSearchSortMode === "set";
      const numActive = state.globalSearchSortMode === "number";
      setBtn.textContent = setActive
        ? state.globalSearchSetOrder === "desc"
          ? "Set ▼"
          : "Set ▲"
        : "Set";
      numBtn.textContent = numActive
        ? state.globalSearchCardNumberOrder === "desc"
          ? "Number ▼"
          : "Number ▲"
        : "Number";
    }

    function collectAllCatalogCards() {
      const languageSets = setsByEra[state.language] || {};
      const matches = [];
      for (const [era, setList] of Object.entries(languageSets)) {
        for (const setEntry of setList) {
          if (!canOpenSet(setEntry.code)) continue;
          const setConfig = detailedSetConfigs[setEntry.code] || null;
          const cards = getSetCards(setEntry, setConfig);
          for (const card of cards) {
            matches.push({
              ...card,
              era
            });
          }
        }
      }
      return matches;
    }

    function updateGlobalArtistFilterSelect() {
      const sel = document.getElementById("globalArtistFilterSelect");
      if (!sel) return;
      const all = collectAllCatalogCards();
      const illustrators = [...new Set(all.map((c) => getCardIllustrator(c)).filter(Boolean))].sort((a, b) =>
        a.localeCompare(b)
      );
      if (state.catalogArtistFilter !== "all" && !illustrators.includes(state.catalogArtistFilter)) {
        state.catalogArtistFilter = "all";
      }
      const selected = state.catalogArtistFilter;
      sel.innerHTML = `<option value="all">Artists</option>${illustrators
        .map((i) => `<option value="${escapeHtml(i)}">${escapeHtml(i)}</option>`)
        .join("")}`;
      sel.value = selected === "all" || illustrators.includes(selected) ? selected : "all";
    }

    /**
     * Numeric order for display numbers like #XY184, #SVP45, 045/073, or plain 001 — ignores leading
     * set/promo letter prefixes so search + set sort match collector card order.
     */
    function isShinyVaultCardNumber(cardNo) {
      return /^SV\d+$/i.test(String(cardNo || "").trim());
    }

    function setHasShinyVaultFilter(setCode) {
      return String(setCode || "").toUpperCase() === "HIF";
    }

    function applySetShinyVaultFilter(cards, setCode) {
      if (!setHasShinyVaultFilter(setCode) || !state.setShinyVaultOnly) {
        return Array.isArray(cards) ? cards : [];
      }
      return (Array.isArray(cards) ? cards : []).filter((card) => isShinyVaultCardNumber(card.cardNo));
    }

    function mergeSetCardImageMaps(localImages, remoteImages) {
      const local = localImages && typeof localImages === "object" ? localImages : {};
      const out = {};
      for (const [cardNo, url] of Object.entries(local)) {
        const s = String(url || "").trim();
        if (!s.startsWith("/card-images/") && !s.startsWith("/card-images-japanese/")) continue;
        for (const key of cardNumberLookupKeys(cardNo)) {
          out[key] = s;
        }
      }
      return out;
    }

    function cardSortNumberKey(card) {
      const raw = String(card.cardNo != null ? card.cardNo : "").trim();
      const fromLabel = String(card.label || "").replace(/^#/, "").trim();
      const key = raw || fromLabel;
      if (!key) {
        const fb = Number(card.number);
        return Number.isFinite(fb) ? fb : Number.POSITIVE_INFINITY;
      }
      const stripped = key.replace(/^#/, "").trim();
      const shinyVault = stripped.match(/^SV(\d+)$/i);
      if (shinyVault) {
        return 50000 + parseInt(shinyVault[1], 10);
      }
      const afterLetters = stripped.match(/^[A-Za-z]+[_-]?(.+)$/);
      const numericPart = afterLetters ? afterLetters[1] : stripped;
      const lead = String(numericPart).match(/^(\d+)/);
      if (lead) {
        const n = parseInt(lead[1], 10);
        if (Number.isFinite(n)) return n;
      }
      const fb = Number(card.number);
      if (Number.isFinite(fb)) return fb;
      const any = stripped.match(/(\d+)/g);
      if (any && any.length) {
        const n = parseInt(any[any.length - 1], 10);
        if (Number.isFinite(n)) return n;
      }
      return Number.POSITIVE_INFINITY;
    }

    function sortGlobalSearchMatches(list) {
      if (state.globalSearchSortMode === "number") {
        const desc = state.globalSearchCardNumberOrder === "desc";
        const releaseDesc = state.globalSearchSetOrder === "desc";
        list.sort((a, b) => {
          const ka = cardSortNumberKey(a);
          const kb = cardSortNumberKey(b);
          const numCmp = ka - kb;
          if (numCmp !== 0) return desc ? -numCmp : numCmp;
          const bySet = compareCardsBySetReleaseThenCode(a, b, releaseDesc);
          if (bySet !== 0) return bySet;
          const la = String(a.label || "");
          const lb = String(b.label || "");
          if (desc) return lb.localeCompare(la, undefined, { numeric: true, sensitivity: "base" });
          return la.localeCompare(lb, undefined, { numeric: true, sensitivity: "base" });
        });
        return;
      }
      const setDesc = state.globalSearchSetOrder === "desc";
      list.sort((a, b) => {
        const bySet = compareCardsBySetReleaseThenCode(a, b, setDesc);
        if (bySet !== 0) return bySet;
        const ka = cardSortNumberKey(a);
        const kb = cardSortNumberKey(b);
        const numCmp = ka - kb;
        if (numCmp !== 0) return numCmp;
        const la = String(a.label || "");
        const lb = String(b.label || "");
        return la.localeCompare(lb, undefined, { numeric: true, sensitivity: "base" });
      });
    }

    async function loadSetImageManifest() {
      try {
        const response = await fetch("/api/sets/images");
        if (!response.ok) return;
        const payload = await response.json();
        if (!payload || !payload.ok) return;
        state.imagesByCode = payload.byCode || {};
        state.imagesByName = payload.byName || {};
      } catch {
        state.imagesByCode = {};
        state.imagesByName = {};
      }
    }

    async function loadPokesymbolsManifest() {
      try {
        const response = await fetch("/api/pokesymbols/manifest");
        if (!response.ok) return;
        const payload = await response.json();
        if (!payload || !payload.ok) return;
        state.pokesymbolsBySlug =
          payload.bySlug && typeof payload.bySlug === "object" ? payload.bySlug : {};
        const serverByCode =
          payload.byCode && typeof payload.byCode === "object" ? payload.byCode : {};
        if (Object.keys(serverByCode).length) {
          state.pokesymbolsByCode = { ...serverByCode };
          mergePokesymbolsAppCodeOverrides();
          return;
        }
        recomputePokesymbolsByCodeFromSlugs();
      } catch {
        state.pokesymbolsBySlug = {};
        state.pokesymbolsByCode = {};
      }
    }

    async function loadSetCatalog(language = state.language) {
      try {
        const response = await fetch(`/api/sets/catalog?language=${encodeURIComponent(language)}`);
        if (!response.ok) return;
        const payload = await response.json();
        if (!payload || !payload.ok || !payload.catalogByEra || typeof payload.catalogByEra !== "object") return;

        const normalizedCatalog = {};
        for (const [era, entries] of Object.entries(payload.catalogByEra)) {
          const list = Array.isArray(entries) ? entries : [];
          normalizedCatalog[era] = list.map((row) => {
            const code = String(row && row.code ? row.code : "").toUpperCase();
            const name = String(row && row.name ? row.name : "").trim();
            const symbol = String(row && row.symbol ? row.symbol : code);
            const releaseDate = String(row && row.releaseDate ? row.releaseDate : "").trim();
            return set(name, code, symbol, releaseDate);
          }).filter((entry) => entry.name && entry.code);
        }

        const eraKeys = Object.keys(normalizedCatalog);
        const isFlatFallbackCatalog = eraKeys.length === 1 && eraKeys[0] === "Sets";
        if (eraKeys.length && !isFlatFallbackCatalog) {
          setsByEra[language] = normalizedCatalog;
        }
      } catch {
        // Keep static fallback if API is unavailable.
      }
      if (language === "english" && Object.keys(state.pokesymbolsBySlug || {}).length) {
        recomputePokesymbolsByCodeFromSlugs();
      }
    }

    function applySetCardManifestEntry(codeKey, entry) {
      if (!entry || typeof entry !== "object") return;
      const cards = entry.cards && typeof entry.cards === "object" ? entry.cards : {};
      const decodedCards = {};
      for (const [cardNo, cardName] of Object.entries(cards)) {
        decodedCards[cardNo] = normalizeCardName(cardName);
      }
      const localImages = entry.localImages && typeof entry.localImages === "object" ? entry.localImages : {};
      const remoteImages = entry.images && typeof entry.images === "object" ? entry.images : {};
      state.cardNamesBySetCode[codeKey] = decodedCards;
      state.cardImagesBySetCode[codeKey] = mergeSetCardImageMaps(localImages, remoteImages);
      state.cardSourceBySetCode[codeKey] = String(entry.sourceHref || "");
      invalidateCatalogSearchIndex();
    }

    async function ensureSetCardsLoaded(setCode, language = state.language) {
      const code = String(setCode || "").trim().toUpperCase();
      if (!code) return;
      if (Object.keys(state.cardNamesBySetCode[code] || {}).length > 0) return;
      if (state.cardManifestLoadingBySetCode[code]) {
        await state.cardManifestLoadingBySetCode[code];
        return;
      }
      const loadPromise = (async () => {
        try {
          const response = await fetch(
            `/api/sets/cards?language=${encodeURIComponent(language)}&setCode=${encodeURIComponent(code)}`
          );
          if (!response.ok) return;
          const payload = await response.json();
          if (!payload || !payload.ok || !payload.byCode || typeof payload.byCode !== "object") return;
          const entry = payload.byCode[code];
          if (entry) applySetCardManifestEntry(code, entry);
        } catch {
          /* ignore */
        }
      })();
      state.cardManifestLoadingBySetCode[code] = loadPromise;
      try {
        await loadPromise;
      } finally {
        delete state.cardManifestLoadingBySetCode[code];
      }
    }

    async function loadSetCardManifest(language = state.language) {
      try {
        const response = await fetch(`/api/sets/cards?language=${encodeURIComponent(language)}`);
        if (!response.ok) return;
        const payload = await response.json();
        if (!payload || !payload.ok) return;
        const byCode = payload.byCode || {};
        const normalizedNames = {};
        const normalizedImages = {};
        const normalizedSource = {};
        for (const [code, entry] of Object.entries(byCode)) {
          const cards = entry && entry.cards && typeof entry.cards === "object" ? entry.cards : {};
          const decodedCards = {};
          for (const [cardNo, cardName] of Object.entries(cards)) {
            decodedCards[cardNo] = normalizeCardName(cardName);
          }
          const localImages = entry && entry.localImages && typeof entry.localImages === "object" ? entry.localImages : {};
          const remoteImages = entry && entry.images && typeof entry.images === "object" ? entry.images : {};
          const codeKey = String(code || "").toUpperCase();
          normalizedNames[codeKey] = decodedCards;
          normalizedImages[codeKey] = mergeSetCardImageMaps(localImages, remoteImages);
          normalizedSource[codeKey] = String(entry && entry.sourceHref ? entry.sourceHref : "");
        }
        state.cardNamesBySetCode = normalizedNames;
        state.cardImagesBySetCode = normalizedImages;
        state.cardSourceBySetCode = normalizedSource;
      } catch {
        state.cardNamesBySetCode = {};
        state.cardImagesBySetCode = {};
        state.cardSourceBySetCode = {};
      }
      invalidateCatalogSearchIndex();
      recomputePokesymbolsByCodeFromSlugs();
    }

    function catalogManifestIsLoaded() {
      return Object.keys(state.cardNamesBySetCode || {}).length > 0;
    }

    function ensureCatalogManifestLoaded(language = state.language) {
      if (catalogManifestIsLoaded()) return Promise.resolve();
      if (!catalogManifestLoadPromise) {
        catalogManifestLoadPromise = loadSetCardManifest(language).finally(() => {
          catalogManifestLoadPromise = null;
        });
      }
      return catalogManifestLoadPromise;
    }

    function setCardDetailsReady(code) {
      const entry = state.cardDetailsBySetCode[code];
      return Boolean(
        entry && entry.cards && typeof entry.cards === "object" && Object.keys(entry.cards).length > 0
      );
    }

    async function ensureSetCardDetailsLoaded(setCode) {
      const code = String(setCode || "").trim().toUpperCase();
      if (!code) return;
      if (setCardDetailsReady(code)) return;
      if (state.cardDetailsLoadingBySetCode[code]) {
        await state.cardDetailsLoadingBySetCode[code];
        return;
      }
      const loadPromise = (async () => {
        try {
          const response = await fetch(`/api/sets/card-details?setCode=${encodeURIComponent(code)}`);
          if (!response.ok) return;
          const payload = await response.json();
          if (!payload || !payload.ok || !payload.byCode || typeof payload.byCode !== "object") return;
          Object.assign(state.cardDetailsBySetCode, payload.byCode);
          invalidateCatalogSearchIndex();
        } catch {
          /* ignore */
        }
      })();
      state.cardDetailsLoadingBySetCode[code] = loadPromise;
      try {
        await loadPromise;
      } finally {
        delete state.cardDetailsLoadingBySetCode[code];
      }
    }

    async function loadSetCardDetailsManifest(setCode) {
      if (setCode) {
        await ensureSetCardDetailsLoaded(setCode);
        return;
      }
      try {
        const response = await fetch("/api/sets/card-details");
        if (!response.ok) return;
        const payload = await response.json();
        if (!payload || !payload.ok || !payload.byCode || typeof payload.byCode !== "object") return;
        state.cardDetailsBySetCode = payload.byCode;
        invalidateCatalogSearchIndex();
      } catch {
        state.cardDetailsBySetCode = {};
      }
    }

    async function ensureSetPricingLoaded(setCode, setName = "") {
      const code = String(setCode || "").trim().toUpperCase();
      if (!code || state.language !== "english") return;
      const cached = state.cardPricingBySetCode[code];
      const hasVariantsIndex = Object.prototype.hasOwnProperty.call(state.cardVariantsBySetCode, code);
      if (cached && Object.keys(cached).length > 0 && hasVariantsIndex) {
        await hydrateSetLinkPricesFromCache(code, setName);
        return;
      }
      if (state.cardPricingLoadingBySetCode[code]) return;

      state.cardPricingLoadingBySetCode[code] = true;
      try {
        const params = new URLSearchParams({ setCode: code });
        const cleanName = String(setName || "").trim();
        if (cleanName) params.set("setName", cleanName);
        const response = await fetch(`/api/sets/pricing?${params.toString()}`);
        const payload = response.ok ? await response.json() : null;
        const byCardNo =
          payload && payload.ok && payload.byCardNo && typeof payload.byCardNo === "object"
            ? payload.byCardNo
            : {};
        const variantsByCardNo =
          payload && payload.variantsByCardNo && typeof payload.variantsByCardNo === "object"
            ? payload.variantsByCardNo
            : {};
        state.cardPricingBySetCode[code] = byCardNo;
        state.cardVariantsBySetCode[code] = variantsByCardNo;
      } catch {
        state.cardPricingBySetCode[code] = {};
        state.cardVariantsBySetCode[code] = {};
      } finally {
        delete state.cardPricingLoadingBySetCode[code];
        await hydrateSetLinkPricesFromCache(code, setName);
        if (state.selectedSetCode === code && state.selectedCardNumber) {
          updateCardDetailTcgPanelPrices();
        }
      }
    }

    async function hydrateSetLinkPricesFromCache(setCode, setName = "", options = {}) {
      const code = String(setCode || "").trim().toUpperCase();
      if (!code || state.language !== "english") return;
      if (!state.tcgLinkCacheGenerationKey || options.force) {
        await syncTcgLinkCacheGeneration();
      }
      const hydrationKey = String(state.tcgLinkCacheGenerationKey || "").trim();
      const force = options.force === true;
      if (
        !force &&
        state.setLinkPricesHydratedBySetCode[code] &&
        state.setLinkPricesHydrationKeyByCode[code] === hydrationKey &&
        hydrationKey
      ) {
        return;
      }
      if (state.setLinkPricesHydratingBySetCode[code]) return;

      state.setLinkPricesHydratingBySetCode[code] = true;
      try {
        const params = new URLSearchParams({ setCode: code });
        const cleanName = String(setName || "").trim();
        if (cleanName) params.set("setName", cleanName);
        const response = await fetch(`/api/sets/link-prices?${params.toString()}`);
        const payload = response.ok ? await response.json() : null;
        const serverKey = String(payload?.cacheGenerationKey || "").trim();
        if (serverKey && serverKey !== state.tcgLinkCacheGenerationKey) {
          state.tcgLinkCacheGenerationKey = serverKey;
          purgeStaleTcgLinkPricesFromClient();
        }
        const byUrl =
          payload && payload.byUrl && typeof payload.byUrl === "object" ? payload.byUrl : {};
        const fetchedAtMs = Date.now();
        for (const [url, node] of Object.entries(byUrl)) {
          const normalized = normalizeTcgLinkPriceNode({
            ...node,
            pricingLogicVersion: node.pricingLogicVersion ?? payload?.logicVersion ?? TCG_LINK_PRICE_LOGIC_VERSION,
            fetchedAtMs,
            cacheGenerationKey: serverKey || hydrationKey
          });
          if (normalized) storeTcgLinkPriceForUrl(url, normalized);
        }
        state.setLinkPricesHydratedBySetCode[code] = true;
        state.setLinkPricesHydrationKeyByCode[code] = serverKey || hydrationKey;
      } catch {
        // best effort only
      } finally {
        delete state.setLinkPricesHydratingBySetCode[code];
        purgeStaleTcgLinkPricesFromClient();
        if (state.selectedSetCode === code) {
          scheduleSetPriceRerender();
          if (state.selectedCardNumber) updateCardDetailTcgPanelPrices();
        }
      }
    }

    async function ensureTcgLinkPriceLoaded(tcgplayerUrl, card = null) {
      const url = normalizeTcgLinkLookupUrl(tcgplayerUrl);
      if (!url || state.language !== "english") return;
      const existing = getTcgLinkPriceForUrl(url);
      if (existing) {
        const fetchedAtMs = Number(existing.fetchedAtMs || 0);
        const ageMs = Date.now() - fetchedAtMs;
        const cacheGen = String(existing.cacheGenerationKey || "").trim();
        const currentGen = String(state.tcgLinkCacheGenerationKey || "").trim();
        const generationMatches = !currentGen || !cacheGen || cacheGen === currentGen;
        if (
          Number.isFinite(ageMs) &&
          ageMs >= 0 &&
          ageMs < TCG_LINK_LOCAL_CACHE_TTL_MS &&
          !isTcgLinkPriceNodeStale(existing) &&
          generationMatches
        ) {
          return;
        }
      }
      if (state.cardPricingLoadingByTcgUrl[url]) return;

      state.cardPricingLoadingByTcgUrl[url] = true;
      try {
        const fetchPrice = async (cacheOnly) => {
          const params = new URLSearchParams({ url, cacheOnly: cacheOnly ? "1" : "0" });
          if (card?.setCode) params.set("setCode", String(card.setCode || "").trim());
          if (card?.cardNo) params.set("cardNo", String(card.cardNo || "").trim());
          if (card?.name) params.set("cardName", String(card.name || "").trim());
          const setEntry = getSetByCode(card?.setCode);
          const setName = String(setEntry?.name || "").trim();
          if (setName) params.set("setName", setName);
          const response = await fetch(`/api/tcgplayer/price-from-link?${params.toString()}`);
          return response.ok || response.status === 202 ? await response.json() : null;
        };

        let payload = await fetchPrice(true);
        if (!payload?.ok && card?.setCode && card?.cardNo) {
          payload = await fetchPrice(false);
        }

        const normalized =
          payload && payload.ok
            ? normalizeTcgLinkPriceNode({
                totalPrice: payload.totalPrice ?? payload.price,
                nearMintPrice: payload.nearMintPrice,
                shippingPrice: payload.shippingPrice,
                listingCondition: payload.listingCondition,
                nearMintWithShipping: payload.nearMintWithShipping,
                sellerName: payload.sellerName,
                pricingLogicVersion: payload.logicVersion ?? TCG_LINK_PRICE_LOGIC_VERSION,
                fetchedAtMs: Date.now()
              })
            : null;
        if (normalized) {
          storeTcgLinkPriceForUrl(url, {
            ...normalized,
            cacheGenerationKey: state.tcgLinkCacheGenerationKey || ""
          });
        }

        // keep seeded variant price if present
      } finally {
        delete state.cardPricingLoadingByTcgUrl[url];

          updateCardDetailTcgPanelPrices();
        } else if (state.selectedSetCode) {
          scheduleSetPriceRerender();

    function getImportedSetSlug(setCode) {
      const sourceHref = state.cardSourceBySetCode[String(setCode || "").toUpperCase()] || "";
      const match = sourceHref.match(/\/set\/([^/]+)\//i);
      return match ? match[1] : "";
    }

    function getSortedCardKeys(cardMap) {
      return Object.keys(cardMap || {}).sort((a, b) => {
        const asv = /^SV(\d+)$/i.exec(a);
        const bsv = /^SV(\d+)$/i.exec(b);
        if (asv && bsv) return Number(asv[1]) - Number(bsv[1]);
        if (asv && !bsv) return 1;
        if (!asv && bsv) return -1;
        const an = Number(a);
        const bn = Number(b);
        if (Number.isFinite(an) && Number.isFinite(bn)) return an - bn;
        if (Number.isFinite(an)) return -1;
        if (Number.isFinite(bn)) return 1;
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
      });
    }

    function primaryCardNumberToken(raw) {
      const q = String(raw || "")
        .trim()
        .replace(/^#/, "");
      if (!q) return "";
      const slash = q.match(/^([^/]+)\s*\/\s*.+$/);
      if (slash) return slash[1].trim();
      return q;
    }

    function cardNumberLookupKeys(raw) {
      const primary = primaryCardNumberToken(raw);
      const q = primary || String(raw || "").trim().replace(/^#/, "");
      if (!q) return [];
      const keys = new Set([q, q.toUpperCase()]);
      const stripped = q.replace(/^0+/, "");
      if (stripped) keys.add(stripped);
      const n = Number(stripped);
      if (Number.isFinite(n)) {
        keys.add(String(n));
        keys.add(String(n).padStart(3, "0"));
      }
      const rawText = String(raw || "").trim().replace(/^#/, "");
      if (rawText && rawText !== q) keys.add(rawText);
      return [...keys];
    }

    function lookupSetCardImage(images, cardNo) {
      if (!images || typeof images !== "object") return "";
      for (const key of cardNumberLookupKeys(cardNo)) {
        const url = images[key];
        if (url) return String(url).trim();
      }
      return "";
    }

    function findCardInSet(cards, cardNoQuery) {
      if (!Array.isArray(cards) || !cards.length) return null;
      const query = String(cardNoQuery || "").trim();
      if (!query) return null;

      const exact = cards.find(
        (card) =>
          String(card.cardNo) === query ||
          String(card.label || "").replace(/^#/, "") === query
      );
      if (exact) return exact;

      const wanted = new Set(cardNumberLookupKeys(query));
      if (!wanted.size) return null;
      for (const card of cards) {
        const candidates = [
          ...cardNumberLookupKeys(card.cardNo),
          ...cardNumberLookupKeys(String(card.label || "").replace(/^#/, ""))
        ];
        if (candidates.some((key) => wanted.has(key))) return card;
      }
      return null;
    }

    function resolveSetImage(setEntry) {
      const localOverride = localSetCoverOverridesByCode[setEntry.code];
      if (localOverride) return localOverride;

      const pokeArt = state.pokesymbolsByCode[setEntry.code];
      if (pokeArt && pokeArt.logo) return pokeArt.logo;

      const codeKey = normalize(setEntry.code);
      const nameKey = slugify(setEntry.name);
      // Only use paths from the set-images manifest (or explicit overrides). Inventing
      // `/set-images/{Name} ({CODE}).png` causes a 404 wait before onerror fallback —
      // that is why sets like Mega Evolution Promos (MEP) appear blank at first.
      const localImage = state.imagesByCode[codeKey] || state.imagesByName[nameKey] || "";
      if (localImage) return localImage;

      const bulbapediaLogo = getBulbapediaExpansionLogoUrl(setEntry.code);
      if (bulbapediaLogo) return bulbapediaLogo;
      const bulbapediaSymbol = resolveSetSymbolUrl(setEntry.code);
      if (bulbapediaSymbol) return bulbapediaSymbol;
      return "";
    }

    function resolveSetCoverFallbackUrl(setEntry) {
      const pokeArt = state.pokesymbolsByCode[setEntry.code];
      if (pokeArt && pokeArt.logo) return pokeArt.logo;
      return getBulbapediaExpansionLogoUrl(setEntry.code) || resolveSetSymbolUrl(setEntry.code) || "";
    }

      const languageSets = setsByEra[state.language] || {};
      for (const [era, setList] of Object.entries(languageSets)) {

          if (setEntry.code === code) return { era, ...setEntry };
        }
      }
      return null;
    }

    /** Parse set releaseDate for catalog sort; 0 if missing or unparsable. */
    function releaseTimestampForSet(setCode) {
      const entry = getSetByCode(setCode);
      const raw = entry && entry.releaseDate ? String(entry.releaseDate).trim() : "";
      if (!raw) return 0;
      const t = Date.parse(raw);
      return Number.isFinite(t) ? t : 0;
    }

    /** Sort by release date (not set code). Unknown dates sort after dated sets. Tie-break: set code. */
    function compareCardsBySetReleaseThenCode(a, b, releaseDesc) {
      const ta = releaseTimestampForSet(a.setCode);
      const tb = releaseTimestampForSet(b.setCode);
      const unkA = ta <= 0;
      const unkB = tb <= 0;
      if (unkA && unkB) return a.setCode.localeCompare(b.setCode);
      if (unkA && !unkB) return 1;
      if (!unkA && unkB) return -1;
      const cmp = ta - tb;
      if (cmp !== 0) return releaseDesc ? -cmp : cmp;
      return a.setCode.localeCompare(b.setCode);
    }

    function recomputePokesymbolsByCodeFromSlugs() {
      const bySlug = state.pokesymbolsBySlug || {};
      const slugKeys = Object.keys(bySlug);
      if (!slugKeys.length) {
        if (Object.keys(state.pokesymbolsByCode || {}).length) return;
        state.pokesymbolsByCode = {};
        return;
      }

      const out = {};
      function assignFromSlug(code, slug) {
        if (!code || !slug) return;
        const row = bySlug[slug];
        if (!row || !row.symbol || !row.logo) return;
        out[code] = { slug, symbol: row.symbol, logo: row.logo };
      }

      for (const [code, slug] of Object.entries(POKESYMBOLS_SLUG_BY_APP_CODE)) {
        assignFromSlug(code, slug);
      }

      const english = setsByEra.english || {};
      for (const list of Object.values(english)) {
        if (!Array.isArray(list)) continue;
        for (const se of list) {
          const code = se.code;
          if (out[code]) continue;

          let slug = POKESYMBOLS_SLUG_BY_APP_CODE[code] || "";
          if (!slug) slug = getImportedSetSlug(code) || "";
          if (!slug && detailedSetConfigs[code]) slug = detailedSetConfigs[code].slug || "";
          if (slug) assignFromSlug(code, slug);
          if (out[code]) continue;

          const guess = slugify(se.name);
          if (guess && bySlug[guess]) assignFromSlug(code, guess);
        }
      }

      state.pokesymbolsByCode = out;
    }

    function buildCardImageUrl(setCode, cardNo) {
      const code = String(setCode || "").trim().toUpperCase();

      return `/card-images/${encodeURIComponent(code)}/${encodeURIComponent(no)}.jpg`;
    }

    function getSetCards(setEntry, setConfig) {
      const importedNames = state.cardNamesBySetCode[setEntry.code] || {};
      const importedImages = state.cardImagesBySetCode[setEntry.code] || {};
      const importedCardKeys = getSortedCardKeys(importedNames);
      const importedSlug = getImportedSetSlug(setEntry.code);

      if (importedCardKeys.length) {
        return importedCardKeys.map((cardNo, index) => {
          const numericValue = Number(cardNo);
          const fallbackImage = buildCardImageUrl(setEntry.code, cardNo);
          const setSlug = importedSlug || (setConfig ? setConfig.slug : "");
          return {
            setCode: setEntry.code,
            setName: setEntry.name,
            setSlug,
            cardNo,
            number: Number.isFinite(numericValue) ? numericValue : index + 1,
            label: `#${cardNo}`,
            name: getCardDisplayName({
              setCode: setEntry.code,
              cardNo,
              name: importedNames[cardNo] || `${setEntry.name} Card ${cardNo}`
            }),
            imageUrl: lookupSetCardImage(importedImages, cardNo) || fallbackImage,
            link: ""
          };
        });
      }

      if (!setConfig) return [];

      const cards = [];
      for (let i = 1; i <= setConfig.total; i += 1) {
        const cardNo = String(i).padStart(3, "0");
        const specificName = importedNames[cardNo] || (setEntry.code === "POR" ? perfectOrderCardNames[cardNo] : "");
        cards.push({
          setCode: setEntry.code,
          setName: setEntry.name,
          setSlug: setConfig.slug,
          cardNo,
          number: i,
          label: `#${cardNo}`,
          name: getCardDisplayName({
            setCode: setEntry.code,
            cardNo,
            name: specificName || `${setEntry.name} Card ${cardNo}`
          }),
          imageUrl: lookupSetCardImage(importedImages, cardNo) || buildCardImageUrl(setEntry.code, cardNo),
          link: ""
        });
      }
      return cards;
    }

    /** Decode HTML entities (e.g. &#8220; … &#8221;) and normalize typographic quotes for display/filtering. */
    function normalizeIllustratorName(raw) {
      let s = String(raw || "").trim();
      if (!s) return "";
      try {
        const ta = document.createElement("textarea");
        ta.innerHTML = s;
        s = String(ta.value || "").trim();
      } catch (_) {
        return s;
      }
      s = s.replace(/\u201c/g, '"').replace(/\u201d/g, '"');
      s = s.replace(/\u2018/g, "'").replace(/\u2019/g, "'");
      return s.trim();
    }

    function getCardDetailForCard(card) {
      if (!card) return null;
      const setDetails = state.cardDetailsBySetCode[card.setCode];
      const cardsByNumber = setDetails && setDetails.cards && typeof setDetails.cards === "object"
        ? setDetails.cards
        : {};
      for (const key of cardNumberLookupKeys(card.cardNo)) {
        const detail = cardsByNumber[key];
        if (detail) return detail;
      }
      return null;
    }

    function getCardDisplayName(card) {
      const detail = getCardDetailForCard(card);
      const raw = String((detail && detail.name) || (card && card.name) || "").trim();
      return normalizeCardName(raw);
    }

    function getCardIllustrator(card) {
      const detail = getCardDetailForCard(card);
      const raw = String(detail && detail.illustrator ? detail.illustrator : "").trim();
      return normalizeIllustratorName(raw);
    }

    function getSetIllustrators(cards) {
      const illustrators = [];
      const seen = new Set();
      for (const card of cards) {
        const illustrator = getCardIllustrator(card);
        if (!illustrator || seen.has(illustrator)) continue;
        seen.add(illustrator);
        illustrators.push(illustrator);
      }
      illustrators.sort((a, b) => a.localeCompare(b));
      return illustrators;
    }

    function getCardRarity(card) {
      const detail = getCardDetailForCard(card);
      return String(detail && detail.rarity ? detail.rarity : "").trim();
    }

    const MARKET_HISTORY_RANGE_DAYS = {
      "30": 30,
      "90": 90,
      "180": 180,
      "365": 365,
      all: 0
    };
    const MARKET_HISTORY_RANGE_OPTIONS = [
      { key: "all", label: "All Time" },
      { key: "30", label: "30 Days" },
      { key: "90", label: "3 Months" },
      { key: "180", label: "6 Months" },
      { key: "365", label: "1 Year" }
    ];
    const MARKET_HISTORY_EXTENDED_MIN_SPAN_MS = 30 * 24 * 60 * 60 * 1000;

    function getMarketHistoryEarliestTs(series) {
      let minTs = Infinity;
      for (const row of Array.isArray(series) ? series : []) {
        for (const point of Array.isArray(row.points) ? row.points : []) {
          const ts = Number(point.ts);
          if (Number.isFinite(ts)) minTs = Math.min(minTs, ts);
        }
      }
      return Number.isFinite(minTs) ? minTs : null;
    }

    function marketHistorySupportsExtendedRanges(series) {
      const minTs = getMarketHistoryEarliestTs(series);
      if (!Number.isFinite(minTs)) return false;
      return Date.now() - minTs > MARKET_HISTORY_EXTENDED_MIN_SPAN_MS;
    }

    function getMarketHistoryRangeOptionsForCard(card, pricingInfo) {
      const cacheKey = getMarketHistoryCacheKey(card);
      const cached = state.marketHistoryByKey[cacheKey];
      if (!cached || !cached.ok || state.marketHistoryLoadingKey === cacheKey) {
        return MARKET_HISTORY_RANGE_OPTIONS.filter((opt) => opt.key === "all" || opt.key === "30");
      }
      const fullSeries = filterMarketHistorySeriesForDisplay(
        Array.isArray(cached.series) ? cached.series : [],
        card,
        pricingInfo
      );
      if (!marketHistorySupportsExtendedRanges(fullSeries)) {
        return MARKET_HISTORY_RANGE_OPTIONS.filter((opt) => opt.key === "all" || opt.key === "30");
      }
      return MARKET_HISTORY_RANGE_OPTIONS;
    }

    function computeMarketHistoryDeltaFromPoints(points) {
      const usable = (Array.isArray(points) ? points : []).filter(
        (point) => Number.isFinite(point?.price) && point.price > 0
      );
      if (!usable.length) {
        return { priceChange: null, percentChange: null, startPrice: null, endPrice: null };
      }
      const first = usable[0].price;
      const last = usable[usable.length - 1].price;
      const priceChange = Number((last - first).toFixed(2));
      const percentChange =
        Number.isFinite(first) && first > 0 ? Number(((priceChange / first) * 100).toFixed(2)) : null;
      return { priceChange, percentChange, startPrice: first, endPrice: last };
    }

    function filterMarketHistorySeriesByRange(series, rangeKey) {
      const rangeDays = MARKET_HISTORY_RANGE_DAYS[rangeKey];
      const list = Array.isArray(series) ? series : [];
      if (!rangeDays) return list;
      const cutoff = Date.now() - rangeDays * 24 * 60 * 60 * 1000;
      return list
        .map((row) => {
          const points = (Array.isArray(row.points) ? row.points : []).filter(
            (point) => Number(point.ts) >= cutoff
          );
          return { ...row, points, ...computeMarketHistoryDeltaFromPoints(points) };
        })
        .filter((row) => Array.isArray(row.points) && row.points.length > 0);
    }

    function getMarketHistoryRangeLabel(rangeKey) {
      const option = MARKET_HISTORY_RANGE_OPTIONS.find((opt) => opt.key === rangeKey);
      return option ? option.label : "All Time";
    }

    const MARKET_HISTORY_COLOR_BY_LABEL = {
      Normal: "#f5c518",
      Holofoil: "#b88cff",
      "Reverse Holofoil": "#c0c8d4",
      "Holo Rare": "#b88cff",
      Common: "#f5c518",
      Uncommon: "#4a9eff",
      Rare: "#b88cff",
      "Secret Rare": "#ff7f6a",
      "PSA 10": "#b88cff"
    };

    const MARKET_HISTORY_COLOR_FALLBACK = ["#f5c518", "#4a9eff", "#b88cff", "#36d18d", "#ff7f6a"];

    function getMarketHistoryCacheKey(card) {
      return `${String(card.setCode || "").toUpperCase()}:${String(card.cardNo || "").trim()}`;
    }

    function marketHistoryColorForLabel(label, index = 0) {
      const key = String(label || "").trim();
      if (MARKET_HISTORY_COLOR_BY_LABEL[key]) return MARKET_HISTORY_COLOR_BY_LABEL[key];
      return MARKET_HISTORY_COLOR_FALLBACK[index % MARKET_HISTORY_COLOR_FALLBACK.length];
    }

    function marketHistoryVariantMatchesTcgPrintings(variantKey, tcgPrintings) {
      const key = String(variantKey || "").trim();
      if (!key) return false;
      if (tcgPrintings.has(key)) return true;
      if (tcgPrintings.size === 1) {
        const onlyPrinting = [...tcgPrintings][0];
        if (onlyPrinting === "Normal" && key === "Holofoil") return true;
        if (onlyPrinting === "Holofoil" && key === "Normal") return true;
      }
      return false;
    }

    function isPriceChartingUngradedSeries(row) {
      const variantKey = String(row?.variantKey || "").trim();
      return row?.source === "pricecharting" && variantKey === "used";
    }

    function isPriceChartingPsa10Series(row) {
      const variantKey = String(row?.variantKey || "").trim();
      const label = String(row?.label || "").trim();
      return variantKey === "manualonly" || label === "PSA 10";
    }

    function marketHistoryPrintingKey(row) {
      if (isPriceChartingPsa10Series(row)) return "PSA 10";
      if (isPriceChartingUngradedSeries(row)) return "Normal";
      return normalizeTcgPrintingFinish(String(row?.variantKey || row?.printing || "").trim());
    }

    function marketHistorySeriesSortRank(row) {
      const printing = marketHistoryPrintingKey(row);
      if (printing === "PSA 10" || isPriceChartingPsa10Series(row)) return 2;
      if (printing === "Reverse Holofoil") return 1;
      return 0;
    }

    function compareMarketHistorySeriesForDisplay(a, b) {
      const rankA = marketHistorySeriesSortRank(a);
      const rankB = marketHistorySeriesSortRank(b);
      if (rankA !== rankB) return rankA - rankB;
      return String(a?.label || "").localeCompare(String(b?.label || ""), undefined, {
        sensitivity: "base"
      });
    }

    function marketHistoryDisplayLabelForRow(row, card, pricingInfo) {
      if (isPriceChartingPsa10Series(row)) return "PSA 10";
      if (isPriceChartingUngradedSeries(row)) {
        const rarity = getCardRarity(card);
        if (rarity) return rarity;
      }
      const printing = marketHistoryPrintingKey(row);
      return getTcgVariantDisplayLabel(
        printing,
        getCardRarity(card),
        String((pricingInfo && pricingInfo.rarity) || "").trim()
      );
    }

    function dedupeMarketHistorySeries(rows) {
      const byKey = new Map();
      for (const row of Array.isArray(rows) ? rows : []) {
        const key = marketHistorySeriesKey(row);
        const existing = byKey.get(key);
        if (!existing) {
          byKey.set(key, row);
          continue;
        }
        const existingPoints = Array.isArray(existing.points) ? existing.points.length : 0;
        const candidatePoints = Array.isArray(row.points) ? row.points.length : 0;
        if (candidatePoints > existingPoints) byKey.set(key, row);
      }
      return [...byKey.values()];
    }

    function filterMarketHistorySeriesForDisplay(series, card, pricingInfo = null) {
      const info = pricingInfo || getCardPricingInfo(card);
      const rawList = Array.isArray(series) ? series : [];
      const hasTcgNormalHistory = rawList.some(
        (row) =>
          row?.source === "tcgplayer" &&
          normalizeTcgPrintingFinish(String(row?.variantKey || row?.printing || "").trim()) === "Normal"
      );
      const tcgPrintingsInPayload = new Set();
      for (const row of rawList) {
        if (row?.source === "tcgplayer") {
          const printing = marketHistoryPrintingKey(row);
          if (printing) tcgPrintingsInPayload.add(printing);
        }
      }
      const mapped = rawList
        .filter((row) => {
          if (row?.source === "pricecharting") {
            if (isPriceChartingPsa10Series(row)) return true;
            if (isPriceChartingUngradedSeries(row)) return !hasTcgNormalHistory;
            return false;
          }
          if (row?.source === "tcgplayer") {
            const printing = marketHistoryPrintingKey(row);
            if (!printing || printing === "Unknown") return false;
            const rarity = getCardRarity(card) || String(info?.rarity || "").trim();
            if (printing === "Holofoil" && isHoloOnlyRarity(rarity)) {
              if (rawList.some((entry) => isPriceChartingUngradedSeries(entry))) return false;
            }
            if (
              printing === "Holofoil" &&
              (tcgPrintingsInPayload.has("Normal") || tcgPrintingsInPayload.has("Reverse Holofoil"))
            ) {
              return false;
            }
            return true;
          }
          const variantKey = String(row.variantKey || row.printing || "").trim();
          return variantKey && variantKey !== "Unknown";
        })
        .map((row) => {
          const printing = marketHistoryPrintingKey(row);
          const label = marketHistoryDisplayLabelForRow(row, card, info);
          if (row?.source === "pricecharting" && isPriceChartingPsa10Series(row)) {
            return { ...row, label: "PSA 10", printing: "PSA 10", variantKey: "manualonly" };
          }
          if (row?.source === "pricecharting" && isPriceChartingUngradedSeries(row)) {
            return { ...row, printing: "Normal", label, variantKey: "used" };
          }
          if (row?.source === "tcgplayer") {
            return { ...row, printing, label, variantKey: printing };
          }
          return { ...row, label };
        });
      return dedupeMarketHistorySeries(mapped).sort(compareMarketHistorySeriesForDisplay);
    }

    function marketHistorySeriesKey(row) {
      if (isPriceChartingUngradedSeries(row)) {
        return `pc:${String(row?.id || row?.productId || "used").trim()}:used`;
      }
      if (row?.source === "pricecharting") {
        return String(row?.id || `pc:${String(row?.variantKey || "manualonly").trim()}`).trim();
      }
      const printing = marketHistoryPrintingKey(row);
      return printing ? `tcg:${printing}` : String(row?.id || row?.label || "").trim();
    }

    function getMarketHistorySelectedSet(cacheKey, series) {
      const key = String(cacheKey || "").trim();
      ensureDefaultMarketHistorySeriesSelection(key, series);
      if (!state.marketHistorySelectedSeriesByKey[key]) {
        state.marketHistorySelectedSeriesByKey[key] = new Set();
      }
      return state.marketHistorySelectedSeriesByKey[key];
    }

    function ensureDefaultMarketHistorySeriesSelection(cacheKey, series) {
      const key = String(cacheKey || "").trim();
      if (!key) return;
      const list = Array.isArray(series) ? series : [];
      if (!list.length) return;

      if (!state.marketHistorySelectedSeriesByKey[key]) {
        state.marketHistorySelectedSeriesByKey[key] = new Set();
      }
      const selected = state.marketHistorySelectedSeriesByKey[key];
      if (state.marketHistoryDefaultsAppliedByKey[key] && selected.size > 0) return;

      selected.clear();
      for (const row of list) {
        if (!isPriceChartingPsa10Series(row)) {
          selected.add(marketHistorySeriesKey(row));
        }
      }
      if (!selected.size) {
        const psa10 = list.find((row) => isPriceChartingPsa10Series(row));
        if (psa10) selected.add(marketHistorySeriesKey(psa10));
      }
      state.marketHistoryDefaultsAppliedByKey[key] = true;
    }

    function toggleMarketHistorySeriesSelection(cacheKey, seriesKey, series) {
      const key = String(cacheKey || "").trim();
      const id = String(seriesKey || "").trim();
      if (!key || !id) return;
      const list = Array.isArray(series) ? series : [];
      const row = list.find((entry) => marketHistorySeriesKey(entry) === id);
      if (!row) return;
      const selected = getMarketHistorySelectedSet(key, list);

      if (selected.has(id)) {
        const tcgSelected = list.filter(
          (entry) =>
            !isPriceChartingPsa10Series(entry) && selected.has(marketHistorySeriesKey(entry))
        );
        const psa10Selected = list.some(
          (entry) =>
            isPriceChartingPsa10Series(entry) && selected.has(marketHistorySeriesKey(entry))
        );
        if (!isPriceChartingPsa10Series(row) && tcgSelected.length <= 1 && !psa10Selected) {
          return;
        }
        selected.delete(id);
        return;
      }

      selected.add(id);
    }

    function isMarketHistorySeriesSelected(cacheKey, seriesKey, series) {
      return getMarketHistorySelectedSet(cacheKey, series).has(String(seriesKey || "").trim());
    }

    function filterMarketHistorySeriesBySelection(cacheKey, series) {
      const selected = getMarketHistorySelectedSet(cacheKey, series);
      return (Array.isArray(series) ? series : []).filter((row) =>
        selected.has(marketHistorySeriesKey(row))
      );
    }

    function formatMarketDeltaValue(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      const abs = Math.abs(n).toFixed(2);
      if (n > 0) return `$${abs}`;
      if (n < 0) return `$-${abs}`;
      return "$0.00";
    }

    function formatMarketDeltaPercent(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "—";
      const abs = Math.abs(n).toFixed(2);
      if (n > 0) return `${abs}%`;
      if (n < 0) return `-${abs}%`;
      return "0.00%";
    }

    function marketDeltaDirection(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n === 0) return "flat";
      return n > 0 ? "up" : "down";
    }

    function marketDeltaArrow(value) {
      const dir = marketDeltaDirection(value);
      if (dir === "up") return "▲";
      if (dir === "down") return "▼";
      return "•";
    }

    function buildMarketHistoryStatCard(title, rangeLabel, valueText, direction) {
      const arrowValue = direction === "up" ? 1 : direction === "down" ? -1 : 0;
      return `<div class="mph-stat-card">
        <div class="mph-stat-card-head"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(rangeLabel)}</span></div>
        <div class="mph-stat-card-value ${escapeHtml(direction)}"><span aria-hidden="true">${marketDeltaArrow(arrowValue)}</span> ${escapeHtml(valueText)}</div>
      </div>`;
    }

    function interpolateMarketHistoryPriceAtTs(points, ts) {
      const list = (Array.isArray(points) ? points : [])
        .filter((point) => Number.isFinite(point?.price) && point.price > 0)
        .sort((a, b) => a.ts - b.ts);
      if (!list.length) return null;
      if (list.length === 1) {
        return {
          price: list[0].price,
          date: list[0].date || new Date(list[0].ts).toISOString().slice(0, 10)
        };
      }
      if (ts <= list[0].ts) {
        return {
          price: list[0].price,
          date: list[0].date || new Date(list[0].ts).toISOString().slice(0, 10)
        };
      }
      const last = list[list.length - 1];
      if (ts >= last.ts) {
        return {
          price: last.price,
          date: last.date || new Date(last.ts).toISOString().slice(0, 10)
        };
      }
      for (let i = 1; i < list.length; i += 1) {
        const prev = list[i - 1];
        const next = list[i];
        if (ts < prev.ts || ts > next.ts) continue;
        const span = next.ts - prev.ts;
        const ratio = span > 0 ? (ts - prev.ts) / span : 0;
        const price = Number((prev.price + ratio * (next.price - prev.price)).toFixed(2));
        return {
          price,
          date: new Date(ts).toISOString().slice(0, 10)
        };
      }
      return null;
    }

    function findMarketHistoryHoverState(canvas, clientX, clientY) {
      const chart = canvas && canvas._mphChartState;
      if (!chart || !Array.isArray(chart.list) || !chart.list.length) return null;
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      const { padL, padT, plotW, plotH, minTs, maxTs, list } = chart;
      if (x < padL || x > padL + plotW || y < padT || y > padT + plotH) return null;

      const ts = minTs + ((x - padL) / plotW) * (maxTs - minTs);
      const entries = [];
      list.forEach((row, index) => {
        const sample = interpolateMarketHistoryPriceAtTs(row.points, ts);
        if (!sample) return;
        entries.push({
          label: row.label,
          color: marketHistoryColorForLabel(row.label, index),
          price: sample.price,
          date: sample.date
        });
      });
      if (!entries.length) return null;

      return {
        x,
        y,
        ts,
        date: entries[0].date,
        entries
      };
    }

    function buildMarketHistoryTooltipHtml(hover) {
      const rows = hover.entries
        .map((entry) => {
          const priceText = formatUsd(entry.price) || `$${Number(entry.price).toFixed(2)}`;
          return `<div class="mph-tip-row"><span class="mph-tip-series"><span class="mph-tip-swatch" style="background:${entry.color};"></span>${escapeHtml(entry.label)}</span><span class="mph-tip-values"><span class="mph-tip-price">${escapeHtml(priceText)}</span></span></div>`;
        })
        .join("");
      return `<div>${escapeHtml(hover.date)}</div>${rows}`;
    }

    async function ensureMarketHistoryLoaded(card) {
      const code = String(card?.setCode || "").trim().toUpperCase();
      const cardNo = String(card?.cardNo || "").trim();
      if (!code || !cardNo || state.language !== "english") return;
      const cacheKey = getMarketHistoryCacheKey(card);
      if (state.marketHistoryByKey[cacheKey]) return;
      if (state.marketHistoryLoadingKey === cacheKey) return;

      state.marketHistoryLoadingKey = cacheKey;
      if (document.getElementById("cardPagePricing")) {
        requestCardDetailRefresh();
      }
      try {
        const params = new URLSearchParams({
          setCode: code,
          cardNo,
          range: "all"
        });
        const setName = String(card.setName || state.selectedSetName || "").trim();
        if (setName) params.set("setName", setName);
        const rarity = getCardRarity(card);
        if (rarity) params.set("rarity", rarity);
        const displayName = getCardDisplayName(card);
        if (displayName) params.set("cardName", displayName);
        const pricingInfo = getCardPricingInfo(card);
        const tcgUrl = String((pricingInfo && pricingInfo.tcgplayerUrl) || "").trim();
        if (tcgUrl) params.set("tcgplayerUrl", tcgUrl);
        const productId = Number(pricingInfo && pricingInfo.productId);
        if (Number.isFinite(productId) && productId > 0) {
          params.set("productId", String(productId));
        }
        const response = await fetch(`/api/sets/market-history?${params.toString()}`);
        const payload = response.ok ? await response.json() : null;
        state.marketHistoryByKey[cacheKey] =
          payload && payload.ok
            ? payload
            : { ok: false, series: [], rangeLabel: "All Time", rangeKey: "all" };
      } catch {
        state.marketHistoryByKey[cacheKey] = {
          ok: false,
          series: [],
          rangeLabel: "All Time",
          rangeKey: "all"
        };
      } finally {
        if (state.marketHistoryLoadingKey === cacheKey) {
          state.marketHistoryLoadingKey = "";
        }
        if (
          state.selectedCardNumber &&
          String(state.selectedSetCode || "").toUpperCase() === code &&
          String(state.selectedCardNumber) === cardNo
        ) {
          requestCardDetailRefresh();
        }
      }
    }

    function drawMarketHistoryChart(canvas, series) {
      if (!canvas) return null;
      const list = Array.isArray(series) ? series.filter((s) => Array.isArray(s.points) && s.points.length) : [];
      const rect = canvas.getBoundingClientRect();
      const cssW = Math.max(280, Math.floor(rect.width || canvas.clientWidth || 280));
      const cssH = Math.max(160, Math.floor(rect.height || 210));
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);
      const ctx = canvas.getContext("2d");
      if (!ctx) return null;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);

      if (!list.length) {
        ctx.fillStyle = "#93a8c7";
        ctx.font = "12px Inter, Segoe UI, Arial, sans-serif";
        ctx.fillText("No market history available for this range.", 14, cssH / 2);
        canvas._mphChartState = null;
        return null;
      }

      const padL = 44;
      const padR = 12;
      const padT = 8;
      const padB = 26;
      const plotW = cssW - padL - padR;
      const plotH = cssH - padT - padB;

      let minTs = Infinity;
      let maxTs = -Infinity;
      let minPrice = Infinity;
      let maxPrice = 0;
      for (const row of list) {
        for (const point of row.points) {
          const p = Number(point.price);
          if (!Number.isFinite(p) || p <= 0) continue;
          minTs = Math.min(minTs, point.ts);
          maxTs = Math.max(maxTs, point.ts);
          minPrice = Math.min(minPrice, p);
          maxPrice = Math.max(maxPrice, p);
        }
      }
      if (!Number.isFinite(minTs) || !Number.isFinite(maxTs)) return null;
      if (maxTs <= minTs) maxTs = minTs + 86400000;
      if (!Number.isFinite(minPrice) || minPrice <= 0) minPrice = maxPrice;
      if (maxPrice <= minPrice) maxPrice = minPrice + 0.05;
      const pricePad = Math.max(0.02, (maxPrice - minPrice) * 0.08);
      const chartMin = Math.max(0.01, minPrice - pricePad);
      const chartMax = maxPrice + pricePad;

      const xAt = (ts) => padL + ((ts - minTs) / (maxTs - minTs)) * plotW;
      const yAt = (price) => padT + plotH - ((price - chartMin) / (chartMax - chartMin)) * plotH;

      ctx.strokeStyle = "rgba(147, 168, 199, 0.1)";
      ctx.lineWidth = 1;
      const gridLines = 5;
      for (let i = 0; i <= gridLines; i += 1) {
        const y = padT + (plotH / gridLines) * i;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(padL + plotW, y);
        ctx.stroke();
        const price = chartMax - ((chartMax - chartMin) / gridLines) * i;
        ctx.fillStyle = "#7d92af";
        ctx.font = "10px Inter, Segoe UI, Arial, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`$${price.toFixed(2)}`, padL - 6, y + 3);
      }

      const tickCount = 5;
      ctx.textAlign = "center";
      for (let i = 0; i <= tickCount; i += 1) {
        const ts = minTs + ((maxTs - minTs) / tickCount) * i;
        const x = xAt(ts);
        const d = new Date(ts);
        const label = `${d.getMonth() + 1}/${d.getDate()}`;
        ctx.fillStyle = "#7d92af";
        ctx.fillText(label, x, cssH - 6);
      }

      list.forEach((row, index) => {
        const color = marketHistoryColorForLabel(row.label, index);
        const points = row.points;
        if (points.length < 2) {
          const p = points[0];
          const y = yAt(p.price);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(padL, y);
          ctx.lineTo(padL + plotW, y);
          ctx.stroke();
          return;
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        points.forEach((point, pointIndex) => {
          const x = xAt(point.ts);
          const y = yAt(point.price);
          if (pointIndex === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });

      const chartState = {
        list,
        cssW,
        cssH,
        padL,
        padT,
        padB,
        plotW,
        plotH,
        minTs,
        maxTs,
        chartMin,
        chartMax
      };
      canvas._mphChartState = chartState;
      return chartState;
    }

    function buildMarketPriceHistoryMarkup(card, payload, loading) {
      const pricingInfo = getCardPricingInfo(card);
      const rangeOptions = getMarketHistoryRangeOptionsForCard(card, pricingInfo);
      const range = String(state.marketHistoryRange || "all");
      const activeRangeOption = rangeOptions.find((opt) => opt.key === range) || rangeOptions[0];
      const effectiveRange = activeRangeOption ? activeRangeOption.key : "all";
      if (effectiveRange !== range) {
        state.marketHistoryRange = effectiveRange;
      }
      const cacheKey = getMarketHistoryCacheKey(card);
      const effectivePayload = state.marketHistoryByKey[cacheKey] || payload;
      const rangeLabel = getMarketHistoryRangeLabel(effectiveRange);
      const rawSeries =
        effectivePayload && Array.isArray(effectivePayload.series) ? effectivePayload.series : [];
      const historyCacheKey = cacheKey;
      const displaySeries = filterMarketHistorySeriesByRange(
        filterMarketHistorySeriesForDisplay(rawSeries, card, pricingInfo),
        effectiveRange
      );
      const series = displaySeries;
      ensureDefaultMarketHistorySeriesSelection(historyCacheKey, series);
      const filterButtons = rangeOptions.length > 1
        ? rangeOptions
            .map(
              (opt) =>
                `<button type="button" class="mph-filter${opt.key === effectiveRange ? " active" : ""}" data-mph-range="${escapeHtml(opt.key)}">${escapeHtml(opt.label)}</button>`
            )
            .join("")
        : "";

      const showLoading = Boolean(loading) && !series.length;
      const deltasHtml = series.length
        ? series
            .map((row, index) => {
              const color = marketHistoryColorForLabel(row.label, index);
              const priceDir = marketDeltaDirection(row.priceChange);
              const pctDir = marketDeltaDirection(row.percentChange);
              const seriesKey = marketHistorySeriesKey(row);
              const selected = isMarketHistorySeriesSelected(historyCacheKey, seriesKey, series);
              const selectTitle = `Add or remove ${row.label} on chart`;
              return `<div class="mph-variant-delta-row${selected ? " is-selected" : ""}" data-mph-series-id="${escapeHtml(seriesKey)}">
                <button type="button" class="mph-variant-label mph-series-select${selected ? " is-selected" : ""}" data-mph-series-id="${escapeHtml(seriesKey)}" aria-pressed="${selected ? "true" : "false"}" title="${escapeHtml(selectTitle)}"><span class="mph-dot" style="background:${color};"></span>${escapeHtml(row.label)}</button>
                ${buildMarketHistoryStatCard("Price Change", rangeLabel, formatMarketDeltaValue(row.priceChange), priceDir)}
                ${buildMarketHistoryStatCard("Percent Change", rangeLabel, formatMarketDeltaPercent(row.percentChange), pctDir)}
              </div>`;
            })
            .join("")
        : "";

      return `<section class="card-price-panel market-price-history" id="marketPriceHistoryPanel">
        <h4 class="mph-title">Market Price History</h4>
        ${deltasHtml ? `<div class="mph-deltas-stack">${deltasHtml}</div>` : ""}
        ${filterButtons ? `<div class="mph-toolbar"><div class="mph-filters">${filterButtons}</div></div>` : ""}
        <div class="mph-chart-wrap${showLoading ? " is-loading" : ""}">
          <canvas id="marketPriceHistoryChart" class="mph-chart" aria-label="Market price history chart for ${escapeHtml(rangeLabel)}"></canvas>
          <div id="marketPriceHistoryCrosshair" class="mph-chart-crosshair" aria-hidden="true"></div>
          <div id="marketPriceHistoryTooltip" class="mph-chart-tooltip" role="tooltip"></div>
          ${showLoading ? `<p class="mph-empty mph-chart-loading">Loading market history…</p>` : ""}
          ${!showLoading && !series.length ? `<p class="mph-empty mph-chart-empty">No market history available for this range.</p>` : ""}
        </div>
      </section>`;
    }

    function wireMarketPriceHistoryPanel(root, card) {
      if (!root || !card) return;
      const panel = root.querySelector("#marketPriceHistoryPanel");
      if (!panel) return;

      panel.querySelectorAll("[data-mph-range]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const nextRange = btn.getAttribute("data-mph-range");
          if (!nextRange || nextRange === state.marketHistoryRange) return;
          state.marketHistoryRange = nextRange;
          if (state.selectedCardNumber) {
            refreshCardDetailPricingExtra();
          } else {
            renderAll();
          }
        });
      });

      const cacheKey = getMarketHistoryCacheKey(card);
      const payload = state.marketHistoryByKey[cacheKey];
      const effectiveRange = String(state.marketHistoryRange || "all");
      const chartSeries = filterMarketHistorySeriesByRange(
        payload && Array.isArray(payload.series)
          ? filterMarketHistorySeriesForDisplay(payload.series, card, getCardPricingInfo(card))
          : [],
        effectiveRange
      );
      ensureDefaultMarketHistorySeriesSelection(cacheKey, chartSeries);
      const canvas = panel.querySelector("#marketPriceHistoryChart");
      const chartWrap = panel.querySelector(".mph-chart-wrap");
      const tooltip = panel.querySelector("#marketPriceHistoryTooltip");
      const crosshair = panel.querySelector("#marketPriceHistoryCrosshair");

      const syncSeriesSelectUi = () => {
        const selected = getMarketHistorySelectedSet(cacheKey, chartSeries);
        panel.querySelectorAll(".mph-series-select[data-mph-series-id]").forEach((btn) => {
          const seriesKey = btn.getAttribute("data-mph-series-id") || "";
          const isSelected = selected.has(seriesKey);
          btn.classList.toggle("is-selected", isSelected);
          btn.setAttribute("aria-pressed", isSelected ? "true" : "false");
          const row = btn.closest(".mph-variant-delta-row");
          if (row) row.classList.toggle("is-selected", isSelected);
        });
      };

      const paintChart = () => {
        if (!canvas) return;
        const isLoading = Boolean(chartWrap && chartWrap.classList.contains("is-loading"));
        if (isLoading) {
          const ctx = canvas.getContext("2d");
          if (ctx) {
            const rect = canvas.getBoundingClientRect();
            const cssW = Math.max(280, Math.floor(rect.width || 280));
            const cssH = Math.max(160, Math.floor(rect.height || 210));
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(cssW * dpr);
            canvas.height = Math.floor(cssH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
          }
          canvas._mphChartState = null;
          syncSeriesSelectUi();
          return;
        }
        const visibleSeries = filterMarketHistorySeriesBySelection(cacheKey, chartSeries);
        if (visibleSeries.length) {
          drawMarketHistoryChart(canvas, visibleSeries);
        } else if (chartSeries.length) {
          const ctx = canvas.getContext("2d");
          if (ctx) {
            const rect = canvas.getBoundingClientRect();
            const cssW = Math.max(280, Math.floor(rect.width || 280));
            const cssH = Math.max(160, Math.floor(rect.height || 210));
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(cssW * dpr);
            canvas.height = Math.floor(cssH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
            ctx.fillStyle = "#93a8c7";
            ctx.font = "12px Inter, Segoe UI, Arial, sans-serif";
            ctx.fillText("Select a variant above to view its chart.", 14, cssH / 2);
          }
          canvas._mphChartState = null;
        }
        syncSeriesSelectUi();
      };
      paintChart();

      panel.querySelectorAll(".mph-series-select[data-mph-series-id]").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.preventDefault();
          const seriesKey = btn.getAttribute("data-mph-series-id") || "";
          toggleMarketHistorySeriesSelection(cacheKey, seriesKey, chartSeries);
          if (tooltip) tooltip.classList.remove("visible");
          paintChart();
        });
      });

      if (canvas && tooltip && chartWrap) {
        const onMove = (event) => {
          const hover = findMarketHistoryHoverState(canvas, event.clientX, event.clientY);
          if (!hover) {
            tooltip.classList.remove("visible");
            if (crosshair) crosshair.classList.remove("visible");
            return;
          }
          const wrapRect = chartWrap.getBoundingClientRect();
          const canvasRect = canvas.getBoundingClientRect();
          const pointerLeft = event.clientX - wrapRect.left;
          const pointerTop = event.clientY - wrapRect.top;
          tooltip.style.left = `${pointerLeft}px`;
          tooltip.style.top = `${pointerTop}px`;
          tooltip.innerHTML = buildMarketHistoryTooltipHtml(hover);
          tooltip.classList.add("visible");
          if (crosshair) {
            const crossLeft = canvasRect.left - wrapRect.left + hover.x;
            crosshair.style.left = `${crossLeft}px`;
            crosshair.classList.add("visible");
          }
        };
        const onLeave = () => {
          tooltip.classList.remove("visible");
          if (crosshair) crosshair.classList.remove("visible");
        };
        canvas.addEventListener("mousemove", onMove);
        canvas.addEventListener("mouseleave", onLeave);
      }

      if (canvas && !panel.dataset.mphResizeBound) {
        panel.dataset.mphResizeBound = "1";
        window.addEventListener("resize", paintChart);
      }
    }

    function getPriceChartingDetailsCacheKey(card) {
      const code = String(card?.setCode || "").trim().toUpperCase();
      const cardNo = String(card?.cardNo || "").trim();
      return `${code}:${cardNo}`;
    }

    async function ensurePriceChartingDetailsLoaded(card) {
      const code = String(card?.setCode || "").trim().toUpperCase();
      const cardNo = String(card?.cardNo || "").trim();
      if (!code || !cardNo || state.language !== "english") return;
      const cacheKey = getPriceChartingDetailsCacheKey(card);
      if (state.priceChartingDetailsByKey[cacheKey]) return;
      if (state.priceChartingDetailsLoadingKey === cacheKey) return;

      state.priceChartingDetailsLoadingKey = cacheKey;
      if (document.getElementById("cardPagePricing")) {
        requestCardDetailRefresh();
      }
      try {
        const params = new URLSearchParams({ setCode: code, cardNo });
        const setName = String(card.setName || state.selectedSetName || "").trim();
        if (setName) params.set("setName", setName);
        const displayName = getCardDisplayName(card);
        if (displayName) params.set("cardName", displayName);
        const response = await fetch(`/api/sets/pricecharting-card-details?${params.toString()}`);
        const payload = response.ok ? await response.json() : null;
        state.priceChartingDetailsByKey[cacheKey] =
          payload && payload.ok
            ? payload
            : { ok: false, soldListings: [], gradedGuides: [], productUrl: "" };
      } catch {
        state.priceChartingDetailsByKey[cacheKey] = {
          ok: false,
          soldListings: [],
          gradedGuides: [],
          productUrl: ""
        };
      } finally {
        if (state.priceChartingDetailsLoadingKey === cacheKey) {
          state.priceChartingDetailsLoadingKey = "";
        }
        if (
          state.selectedCardNumber &&
          String(state.selectedSetCode || "").toUpperCase() === code &&
          String(state.selectedCardNumber) === cardNo
        ) {
          requestCardDetailRefresh();
        }
      }
    }

                  rows
                    ? `<div class="pc-sold-table-wrap"><table class="pc-sold-table"><thead><tr><th>Date</th><th>Title</th><th>Price</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div>`

    function getCardPricingInfo(card) {
      const byCardNo = state.cardPricingBySetCode[card.setCode];
      if (!byCardNo || typeof byCardNo !== "object") return null;

      const rawCardNo = String(card.cardNo || "").trim();
      const trailingDigitsMatch = rawCardNo.match(/(\d{1,4})$/);
      const trailingDigits = trailingDigitsMatch ? trailingDigitsMatch[1] : "";
      const numericTail = trailingDigits ? String(Number(trailingDigits)) : "";
      const candidates = [
        rawCardNo.toUpperCase(),
        normalizeCardNumberToken(card.cardNo),
        normalizeCardNumberToken(card.label),
        normalizeCardNumberToken(String(card.cardNo || "").replace(/^0+/, "")),
        trailingDigits,
        numericTail
      ].filter(Boolean);
      for (const key of candidates) {
        if (byCardNo[key]) return byCardNo[key];
      }
      return null;
    }

    function collectTcgPriceLookupUrlsForCard(card, pricingInfo) {
      const urls = new Set();
      const info = pricingInfo || getCardPricingInfo(card);
      const variants = resolveTcgPrintVariantsForDisplay(card, info);
      if (variants.length) {
        for (const row of variants) {
          const lookup = normalizeTcgLinkLookupUrl(row.priceLookupUrl || row.tcgplayerUrl || "");
          if (lookup) urls.add(lookup);
        }
      } else {
        const base = normalizeTcgLinkLookupUrl(info?.tcgplayerUrl || "");
        if (base) urls.add(base);
      }
      return [...urls];
    }

    function getTcgLinkPriceNodeForCard(card, pricingInfo) {
      const urls = collectTcgPriceLookupUrlsForCard(card, pricingInfo);
      let bestNode = null;
      let bestTotal = Number.POSITIVE_INFINITY;
      for (const url of urls) {
        const node = getTcgLinkPriceForUrl(url);
        if (!node || isTcgLinkPriceNodeStale(node)) continue;
        const total = Number(node.totalPrice);
        if (Number.isFinite(total) && total > 0 && total < bestTotal) {
          bestTotal = total;
          bestNode = node;
        }
      }
      if (bestNode) return bestNode;
      for (const url of urls) {
        const node = getTcgLinkPriceForUrl(url);
        if (node && !isTcgLinkPriceNodeStale(node)) return node;
      }
      return null;
    }

    function getEffectiveTcgplayerPrice(pricingInfo, card = null) {
      const info =
        pricingInfo && typeof pricingInfo === "object"
          ? pricingInfo
          : card
            ? getCardPricingInfo(card)
            : null;
      if (!info) return null;
      const resolvedCard = card || null;
      const node = resolvedCard ? getTcgLinkPriceNodeForCard(resolvedCard, info) : null;
      if (node) {
        const resolved = Number(node.totalPrice);
        if (Number.isFinite(resolved) && resolved > 0) return resolved;
      }
      const tcgplayerUrl = normalizeTcgLinkLookupUrl(info.tcgplayerUrl || "");
      if (tcgplayerUrl) {
        const hit = getTcgLinkPriceForUrl(tcgplayerUrl);
        if (hit && !isTcgLinkPriceNodeStale(hit)) {
          const resolved = Number(hit.totalPrice);
          if (Number.isFinite(resolved) && resolved > 0) return resolved;
        }
      }
      const fallback = Number(info.tcgplayerPrice);
      return Number.isFinite(fallback) && fallback > 0 ? fallback : null;
    }

    function formatCardPriceInline(card) {
      const pricingInfo = getCardPricingInfo(card);
      const total = getEffectiveTcgplayerPrice(pricingInfo, card);
      if (Number.isFinite(total) && total > 0) return formatUsd(total);
      return "";
    }

    function getMostExpensiveCardInSet(cards) {
      const list = Array.isArray(cards) ? cards : [];
      let bestCard = null;
      let bestPrice = -1;
      for (const card of list) {
        const price = getEffectiveTcgplayerPrice(getCardPricingInfo(card), card);
        if (!Number.isFinite(price) || price <= 0) continue;
        if (price > bestPrice) {
          bestPrice = price;
          bestCard = card;
        }
      }
      return {
        card: bestCard,
        price: Number.isFinite(bestPrice) && bestPrice > 0 ? bestPrice : null
      };
    }

    function getFullSetMarketValue(cards) {
      const list = Array.isArray(cards) ? cards : [];
      let total = 0;
      let count = 0;
      for (const card of list) {
        const price = getEffectiveTcgplayerPrice(getCardPricingInfo(card), card);
        if (!Number.isFinite(price) || price <= 0) continue;
        total += price;
        count += 1;
      }
      return {
        total: count > 0 ? Number(total.toFixed(2)) : null,
        pricedCount: count
      };
    }

    function getSetRarities(cards) {
      const rarities = [];
      const seen = new Set();
      for (const card of cards) {
        const rarity = getCardRarity(card);
        if (!rarity || seen.has(rarity)) continue;
        seen.add(rarity);
        rarities.push(rarity);
      }
      rarities.sort((a, b) => a.localeCompare(b));
      return rarities;
    }

    function renderSetCardTileMarkup(card) {
      return `
              <div class="card-tile-shell" data-card-number="${escapeHtml(card.cardNo)}">

                }

                }
                <div>${renderCardName(card)}</div>
                <div class="card-meta card-meta-row">

                  <span class="card-price-inline">${escapeHtml(formatCardPriceInline(card) || "—")}</span>
                </div>
                </button>

    function renderSetCardsGridMarkup(cards) {
      const list = Array.isArray(cards) ? cards : [];
      if (!list.length) return "";
      const markup = list.map((card) => renderSetCardTileMarkup(card)).join("");
      return `<div class="cards-grid">${markup}</div>`;
