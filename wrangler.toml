name = "pokemonview"
main = "cloudflare/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Public site URL — used for OAuth redirects, password-reset links, etc.
[vars]
APP_PUBLIC_URL = "https://pokemonview.com"
DEFAULT_CURRENCY = "USD"
DEFAULT_REGION = "US"

[[containers]]
class_name = "PokemonViewContainer"
image = "./Dockerfile"
max_instances = 2
# Default "lite" is 256MiB — Node + catalog JSON OOMs and never stays running.
instance_type = "standard-2"

[[durable_objects.bindings]]
name = "POKEMONVIEW"
class_name = "PokemonViewContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokemonViewContainer"]

# Card art (~3 GB) — served at the edge from R2; not baked into the Docker image.
[[r2_buckets]]
binding = "CARD_IMAGES"
bucket_name = "pokemonview-card-images"

# Custom domain (keep in sync with dashboard so deploys do not drop it)
[[routes]]
pattern = "pokemonview.com"
custom_domain = true
# [[routes]]
# pattern = "www.pokemonview.com"
# custom_domain = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
