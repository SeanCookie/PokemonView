name = "pokemonview"
main = "cloudflare/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Public site URL — used for OAuth redirects, password-reset links, etc.
[vars]
APP_PUBLIC_URL = "https://pokemonview.com"
DEFAULT_CURRENCY = "USD"
DEFAULT_REGION = "US"

[[containers]]
class_name = "PokemonViewContainer"
image = "./Dockerfile"
max_instances = 2
# Default "lite" is 256MiB — Node + catalog JSON OOMs and never stays running.
instance_type = "standard-2"

[[durable_objects.bindings]]
name = "POKEMONVIEW"
class_name = "PokemonViewContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokemonViewContainer"]

# Card art (~3 GB) — served at the edge from R2; not baked into the Docker image.
[[r2_buckets]]
binding = "CARD_IMAGES"
bucket_name = "pokemonview-card-images"

# Apex custom domain only. Do NOT add www as custom_domain here — Wrangler’s
# /domains/records call fails when www already has a manual DNS record, and that
# aborts the whole deploy after the Worker/container already uploaded.
# Serve www via Cloudflare Redirect Rule (www → https://pokemonview.com/$1) with
# a proxied DNS AAAA www → 100:: (or A → 192.0.2.1) in the zone dashboard.
[[routes]]
pattern = "pokemonview.com"
custom_domain = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
